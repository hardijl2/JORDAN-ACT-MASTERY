matically acceptable?", "choices": ["NO CHANGE", "and", ", so", "; and"], "correctIndex": 1, "explanation": "\"Labeled each folder clearly\" has no subject of its own -- it's a compound predicate sharing \"She\" with \"organized.\" No comma is needed before \"and.\" NO CHANGE wrongly adds one, as if two independent clauses were being joined."}, {"question": "The committee reviewed every proposal, __and they__ voted on the winner by secret ballot.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "and they", "and, they", "; they"], "correctIndex": 0, "explanation": "\"They voted on the winner\" is a full independent clause with its own subject, \"they.\" A comma correctly precedes \"and\" here, joining two independent clauses. NO CHANGE is correct."}, {"question": "He studied the map carefully __and__ he charted a new route through the mountains.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ", and", "; and", "and then"], "correctIndex": 1, "explanation": "\"He charted a new route\" is a full independent clause with its own subject, \"he.\" A comma is required before \"and\" when it joins two independent clauses. NO CHANGE omits the required comma."}, {"question": "The chef prepared the sauce__, and__ seasoned it to perfection before plating.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "and", ", but", "; and"], "correctIndex": 1, "explanation": "\"Seasoned it to perfection\" has no subject of its own -- a compound predicate sharing \"chef.\" No comma is needed before \"and.\" NO CHANGE wrongly inserts one."}, {"question": "The forecast predicted rain__ but__ the skies stayed clear all afternoon.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ", but", "; but", "but,"], "correctIndex": 1, "explanation": "\"The skies stayed clear\" is a full independent clause. A comma is required before \"but\" when it joins two independent clauses. NO CHANGE omits it."}, {"question": "Visitors can tour the gallery__ or__ attend one of the guided lectures instead.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ", or", "; or", "or,"], "correctIndex": 0, "explanation": "\"Attend one of the guided lectures\" has no subject of its own -- a compound predicate sharing \"Visitors can\" with \"tour.\" No comma is needed before \"or.\" NO CHANGE is correct as printed."}, {"question": "The bridge was closed for repairs__ so__ commuters had to take a longer detour.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ", so", "; so", "so,"], "correctIndex": 1, "explanation": "\"Commuters had to take a longer detour\" is a full independent clause -- needs a comma before \"so.\" NO CHANGE omits it, creating a run-on."}, {"question": "The design looked simple__ yet__ required months of careful engineering to perfect.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ", yet", "; yet", "yet,"], "correctIndex": 0, "explanation": "\"Required months of careful engineering\" has no subject of its own -- a compound predicate sharing \"design.\" No comma before \"yet\" is needed. NO CHANGE is correct as printed."}, {"question": "She left the party early__ for__ she had an early flight the next morning.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ", for", "; for", "for,"], "correctIndex": 1, "explanation": "\"She had an early flight\" is a full independent clause -- needs a comma before the conjunction \"for.\" NO CHANGE creates a run-on."}, {"question": "The committee did not approve the budget__ nor__ did it offer an alternative plan.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ", nor", "; nor", "nor,"], "correctIndex": 1, "explanation": "\"Did it offer an alternative plan\" is an independent clause (inverted word order, common after \"nor\") -- needs a comma before \"nor.\" NO CHANGE creates a run-on."}, {"question": "The architect designed a __well thought out__ layout for the new library.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "well-thought-out", "well, thought, out", "well thought-out"], "correctIndex": 1, "explanation": "Three words working together to modify \"layout,\" immediately before the noun, need to be fully hyphenated."}, {"question": "Critics agreed that the film's plot was __well thought-out__, if a bit predictable.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "well thought out", "well-thought-out", "well, thought out"], "correctIndex": 1, "explanation": "The modifier comes AFTER the noun it describes (\"plot was...\"), so no hyphen is needed at all."}, {"question": "The team delivered a __highly-detailed__ report ahead of schedule.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "highly detailed", "highly, detailed", "highly-detail"], "correctIndex": 1, "explanation": "Never hyphenate after an \"-ly\" adverb. \"Highly\" already signals it modifies \"detailed,\" so no hyphen is needed."}, {"question": "The bridge spans nearly __two miles__ and took a decade to build.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "two-miles", "two, miles", "two- miles"], "correctIndex": 0, "explanation": "\"Two miles\" here isn't modifying a noun directly before it -- it's a plain measurement phrase after the verb \"spans.\" No hyphen needed. (Compare: \"a two-mile bridge,\" where it DOES modify \"bridge\" directly before it.)"}, {"question": "The recipe calls for __one third__ cup of olive oil.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "one-third", "one, third", "one thirds"], "correctIndex": 1, "explanation": "Fractions used as modifiers are hyphenated: \"one-third cup.\""}, {"question": "She recently turned __twenty one__ and celebrated with her closest friends.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "twenty-one", "twenty, one", "twenty-first"], "correctIndex": 1, "explanation": "Compound numbers from 21 to 99 are hyphenated: \"twenty-one.\""}, {"question": "The museum's __newly-renovated__ east wing reopens to the public next month.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "newly renovated", "newly, renovated", "newly-renovate"], "correctIndex": 1, "explanation": "\"Newly\" is an \"-ly\" adverb -- never hyphenate it to the word it modifies."}, {"question": "Choose the sentence with correct hyphenation.", "choices": ["The committee proposed a well-thought-out plan for the merger.", "The committee proposed a well thought out plan for the merger.", "The plan the committee proposed was well-thought-out for the merger.", "The committee proposed a well-thought out-plan for the merger."], "correctIndex": 0, "explanation": "The three-word modifier sits immediately before \"plan\" and needs full hyphenation. The plan-was-well-thought-out version is wrong because the modifier comes AFTER the noun there, so it shouldn't be hyphenated at all."}, {"question": "Choose the sentence with correct hyphenation.", "choices": ["She wore a bright-colored scarf to the highly anticipated event.", "She wore a bright colored scarf to the highly-anticipated event.", "She wore a bright-colored scarf to the highly-anticipated event.", "She wore a bright colored scarf to the highly anticipated event, which was well known."], "correctIndex": 0, "explanation": "\"Bright-colored\" (two words modifying \"scarf\" directly before it) needs a hyphen. \"Highly anticipated\" should NOT be hyphenated since \"highly\" is an -ly adverb."}, {"question": "The company's __ten page__ proposal impressed every member of the board.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "ten-page", "ten, page", "ten-pages"], "correctIndex": 1, "explanation": "\"Ten-page\" modifies \"proposal\" directly before it and needs a hyphen."}, {"question": "The negotiations came down to a single issue__,__ who would cover the shipping costs.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "--", ";", "OMIT the underlined portion"], "correctIndex": 1, "explanation": "\"The negotiations came down to a single issue\" is a complete sentence, and what follows explains exactly what that issue was -- a dash (working just like a colon) correctly introduces it. A comma alone creates a splice."}, {"question": "Her advice boiled down to one simple habit__,__ writing down every idea the moment it occurred to her.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "--", ";", "OMIT the underlined portion"], "correctIndex": 1, "explanation": "The first part is a complete sentence, and a dash correctly introduces the explanation of what the habit was -- functioning exactly like a colon."}, {"question": "The renovation had one clear goal__,__ preserving the building's original facade while modernizing everything behind it.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "--", ";", "OMIT the underlined portion"], "correctIndex": 1, "explanation": "\"The renovation had one clear goal\" is complete on its own; the dash introduces what that goal was, just like a colon would."}, {"question": "The lecture covered a single theme throughout__,__ how small daily habits compound into major life changes.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "--", ";", "OMIT the underlined portion"], "correctIndex": 1, "explanation": "The dash introduces an explanation after a complete sentence, functioning like a colon. A comma alone would create a splice."}], "quizLength": 15}, "sva_advanced": {"name": "SVA -- Advanced", "lesson": "**Subject-Verb Agreement -- Advanced**\n\nBeyond crossing out interrupters, these traps require knowing specific\ncategories of words and structures:\n\n**SANAM pronouns** (Some, Any, None, All, Most, more): these have NO fixed\nnumber of their own. Look at the noun in the \"of ___\" phrase that\nfollows: countable/plural noun -> plural verb; uncountable/singular noun\n-> singular verb. The exact same pronoun can go either way depending on\nwhat follows it.\n*\"Some of the cake IS gone\"* (cake = uncountable) vs. *\"Some of the\ncookies ARE gone\"* (cookies = countable, plural).\n\n**Fixed indefinite pronouns**: some never change, regardless of what\nfollows them.\n*Always singular:* each, either, neither, everyone, everybody, everything,\nsomeone, somebody, something, anyone, anybody, anything, no one, nobody,\nnothing, one.\n*Always plural:* both, few, many, several, others.\n\n**\"There is/are\" inversions**: \"there\" is never the subject -- it's a\nplaceholder. The real subject comes AFTER the verb, so the verb has to\nagree with THAT.\n*\"There WERE several manuscripts in the archive\"* (subject is\n\"manuscripts,\" plural, even though it comes after \"were\").\n\n**\"The number of\" vs. countable plurals**: \"the number of X\" is always\nsingular (it's the number -- one thing -- that's doing something), even\nthough X itself is plural. \"A number of X,\" by contrast, functions like\n\"several\" and takes a plural verb.\n\n**Irregular Latin plurals**: data, criteria, phenomena, media, and alumni\nare already PLURAL forms (of datum, criterion, phenomenon, medium,\nalumnus) -- treat them as plural on the test, even though everyday speech\noften treats \"data\" as singular.\n\n**Titles and subject complements**: the title of a single work (even one\nthat sounds plural, like a book titled with a plural-sounding phrase) is\ntreated as ONE singular thing. And the verb always agrees with the actual\nsubject, never with a plural noun sitting on the other side of \"is/was.\"\n\n**Stacked traps**: the hardest sentences combine two of the above rules at\nonce -- solve each piece separately before deciding on either verb.\n", "flashcards": [{"front": "SANAM pronouns -- how do you decide singular or plural?", "back": "Look at the noun in the \"of ___\" phrase after it. Countable/plural noun -> plural verb. Uncountable/singular noun -> singular verb. Example: \"Some of the cake IS gone\" vs. \"Some of the cookies ARE gone.\""}, {"front": "Which indefinite pronouns are ALWAYS singular, no matter what follows?", "back": "each, either, neither, everyone, everybody, everything, someone, somebody, something, anyone, anybody, anything, no one, nobody, nothing, one."}, {"front": "Which indefinite pronouns are ALWAYS plural?", "back": "both, few, many, several, others."}, {"front": "\"There is/are\" sentences -- what's the actual subject?", "back": "Never \"there\" -- it's a placeholder. The real subject comes AFTER the verb; match the verb to that."}, {"front": "\"The number of X\" vs. \"A number of X\" -- singular or plural?", "back": "\"The number of X\" is always singular (the number itself is one thing). \"A number of X\" acts like \"several\" and is plural."}, {"front": "Are \"data,\" \"criteria,\" and \"phenomena\" singular or plural on the ACT?", "back": "Plural -- they're the plural forms of datum, criterion, and phenomenon. \"The data ARE conclusive,\" not \"is.\""}, {"front": "How do you handle a sentence with two separate SVA traps stacked together?", "back": "Solve each piece separately -- find each clause's own subject and match its own verb, one at a time."}], "bank": [{"question": "Some of the paperwork required for the merger ___ still missing signatures.", "choices": ["is", "are", "were", "have been"], "correctIndex": 0, "explanation": "\"Paperwork\" (the noun after \"of\") is uncountable, so \"some\" takes a singular verb here."}, {"question": "Some of the volunteers who signed up ___ unaware of the schedule change.", "choices": ["was", "were", "is", "has been"], "correctIndex": 1, "explanation": "\"Volunteers\" (the noun after \"of\") is countable and plural, so \"some\" takes a plural verb here -- same word, opposite answer from an uncountable noun."}, {"question": "None of the advice she received ___ actually useful in the end.", "choices": ["was", "were", "are", "have been"], "correctIndex": 0, "explanation": "\"Advice\" is uncountable, so \"none\" takes a singular verb. Don't assume \"none\" always means \"not one\" and is therefore always singular -- it depends on the noun that follows."}, {"question": "None of the applicants ___ aware of the interview's new format.", "choices": ["was", "were", "is", "has been"], "correctIndex": 1, "explanation": "\"Applicants\" is countable and plural, so \"none\" takes a plural verb here."}, {"question": "All of the cake ___ eaten before the party even started.", "choices": ["was", "were", "are", "have been"], "correctIndex": 0, "explanation": "\"Cake\" is uncountable/singular, so \"all\" takes a singular verb."}, {"question": "All of the guests ___ already seated when the ceremony began.", "choices": ["was", "were", "is", "has been"], "correctIndex": 1, "explanation": "\"Guests\" is countable and plural, so \"all\" takes a plural verb."}, {"question": "Most of the equipment ___ still under warranty.", "choices": ["is", "are", "were", "have been"], "correctIndex": 0, "explanation": "\"Equipment\" is uncountable, so \"most\" takes a singular verb."}, {"question": "Most of the machines in the factory ___ replaced last year.", "choices": ["was", "were", "is", "has been"], "correctIndex": 1, "explanation": "\"Machines\" is countable and plural, so \"most\" takes a plural verb."}, {"question": "Each of the finalists ___ nervous backstage before the announcement.", "choices": ["was", "were", "are", "have been"], "correctIndex": 0, "explanation": "\"Each\" is always singular, regardless of the plural noun (\"finalists\") that follows it."}, {"question": "Both of the interns ___ offered full-time positions after the internship ended.", "choices": ["was", "were", "is", "has been"], "correctIndex": 1, "explanation": "\"Both\" is always plural, regardless of context."}, {"question": "Neither of the proposals ___ approved by the board.", "choices": ["was", "were", "are", "have been"], "correctIndex": 0, "explanation": "\"Neither\" is always singular."}, {"question": "Several of the recipes in the book ___ handed down from her grandmother.", "choices": ["was", "were", "is", "has been"], "correctIndex": 1, "explanation": "\"Several\" is always plural."}, {"question": "Everybody in the auditorium ___ silent when the speaker began.", "choices": ["was", "were", "are", "have been"], "correctIndex": 0, "explanation": "\"Everybody\" is always singular, even though it describes a whole room of people."}, {"question": "Few of the reviewers ___ impressed by the film's ending.", "choices": ["was", "were", "is", "has been"], "correctIndex": 1, "explanation": "\"Few\" is always plural."}, {"question": "There ___ several first-edition manuscripts in the back corner of the archive.", "choices": ["was", "were", "is", "has been"], "correctIndex": 1, "explanation": "\"There\" is a placeholder, not the subject. The real subject, \"manuscripts,\" is plural and comes after the verb."}, {"question": "There ___ a single reason why the project was delayed.", "choices": ["was", "were", "are", "have been"], "correctIndex": 0, "explanation": "The real subject, \"a single reason,\" is singular, even though it comes after the verb."}, {"question": "There ___, tucked into the margins of the manuscript, several handwritten notes from the author.", "choices": ["was", "were", "is", "has been"], "correctIndex": 1, "explanation": "The interrupting phrase doesn't change anything -- the real subject, \"several handwritten notes,\" is plural."}, {"question": "The number of applicants ___ grown every year since the program's founding.", "choices": ["has", "have", "were", "are"], "correctIndex": 0, "explanation": "\"The number of X\" is always singular -- it's the number itself, one thing, that's growing."}, {"question": "A number of applicants ___ already submitted their materials early.", "choices": ["has", "have", "was", "is"], "correctIndex": 1, "explanation": "\"A number of X\" functions like \"several\" and takes a plural verb -- different from \"the number of,\" which is always singular."}, {"question": "The data from the study ___ conclusive, according to the researchers.", "choices": ["is", "are", "was", "has been"], "correctIndex": 1, "explanation": "\"Data\" is the plural form of \"datum\" and is treated as plural on the test, even though everyday speech often treats it as singular."}, {"question": "The criteria for admission ___ clearly listed on the website.", "choices": ["is", "are", "was", "has been"], "correctIndex": 1, "explanation": "\"Criteria\" is the plural of \"criterion\" and takes a plural verb."}, {"question": "The Canterbury Tales ___ currently being digitized by the university library.", "choices": ["is", "are", "was", "were"], "correctIndex": 0, "explanation": "The title of a single work is treated as one singular thing, even if it sounds plural."}, {"question": "The most memorable part of the entire tour ___ the hand-painted murals on the ceiling.", "choices": ["was", "were", "are", "have been"], "correctIndex": 0, "explanation": "The verb agrees with the actual subject, \"the most memorable part\" (singular) -- not with \"murals,\" the plural noun on the other side of the verb."}, {"question": "Her primary concern throughout the negotiation ___ the unresolved shipping costs.", "choices": ["was", "were", "are", "have been"], "correctIndex": 0, "explanation": "The subject is \"her primary concern\" (singular); don't let \"costs,\" the plural noun after the verb, decide the answer."}, {"question": "The number of applicants who ___ the minimum GPA requirement ___ grown every year.", "choices": ["meet...has", "meets...have", "meet...have", "meets...has"], "correctIndex": 0, "explanation": "Two separate checks: (1) \"applicants who meet...\" -- the relative clause's subject is \"applicants,\" plural, so \"meet.\" (2) \"The number...has grown\" -- \"the number of X\" is always singular, so \"has.\""}, {"question": "Every one of the recommendations that the committee ___ to the board ___ met with approval.", "choices": ["submitted...was", "submitted...were", "submits...was", "submit...were"], "correctIndex": 0, "explanation": "Two checks: (1) inside the relative clause, \"the committee submitted\" -- \"committee\" acts as one singular unit. (2) The main subject is \"Every one,\" always singular, so \"was.\""}, {"question": "Neither the assistant coaches nor the head coach ___ willing to change the lineup, even though several of the players ___ requesting it.", "choices": ["is...are", "are...is", "is...is", "are...are"], "correctIndex": 0, "explanation": "Two separate rules: (1) with \"neither...nor,\" the verb matches the CLOSER noun, \"head coach\" (singular) -> \"is.\" (2) \"Several\" is always plural -> \"are,\" regardless of the first clause's answer."}, {"question": "Each of the finalists ___ nervous backstage, even though several of the judges ___ already whispering about their favorite.", "choices": ["was...were", "were...was", "was...was", "were...were"], "correctIndex": 0, "explanation": "Two different indefinite pronouns, opposite fixed numbers: \"each\" is always singular (\"was\"), \"several\" is always plural (\"were\") -- independent of each other."}]}, "transitions": {"name": "Transitions", "lesson": "**Transitions**\n\nThe core skill: identify the actual logical relationship between two\nideas BEFORE picking a transition word. Don't scan the answer choices\nfirst and guess which \"sounds right\" -- name the relationship, then find\nthe word that matches it.\n\n**Six relationship categories:**\n\n1. **Contrast**: however, nevertheless, on the other hand, in contrast,\n   yet, still, conversely. Use when the second idea pushes against or\n   undercuts the first.\n\n2. **Cause/Effect**: therefore, consequently, as a result, thus, hence.\n   Use when the second idea is a direct RESULT of the first.\n\n3. **Addition**: furthermore, moreover, in addition, also, additionally.\n   Use when the second idea simply adds another supporting point, same\n   direction as the first.\n\n4. **Sequence/Time**: subsequently, meanwhile, afterward, then,\n   eventually. Use when the relationship is about WHEN things happen\n   relative to each other, not logic.\n\n5. **Concession**: although, granted, admittedly, of course, to be sure.\n   Use when you're conceding a point before pivoting -- a specific,\n   narrower flavor of contrast (concede first, then contrast).\n\n6. **Emphasis/Example**: indeed, in fact, for example, specifically, for\n   instance. Use when the second idea illustrates or reinforces the\n   first, rather than adding something new or contrasting it.\n\n**The trap**: many wrong answers are transition words that would be\nperfectly grammatical in some OTHER sentence -- they're not \"wrong\"\nwords, just wrong for the actual relationship in front of you. Always\nask \"does the second idea agree with, oppose, result from, exemplify, or\njust come after the first?\" before choosing.\n", "flashcards": [{"front": "Core skill for transition questions?", "back": "Identify the logical relationship FIRST -- contrast, cause/effect, addition, sequence, concession, or emphasis/example -- then pick the word that matches. Don't scan answers and guess."}, {"front": "Contrast transition words?", "back": "however, nevertheless, on the other hand, in contrast, yet, conversely -- use when the second idea pushes against the first."}, {"front": "Cause/effect transition words?", "back": "therefore, consequently, as a result, thus, hence -- use when the second idea is a direct RESULT of the first."}, {"front": "Addition transition words?", "back": "furthermore, moreover, in addition, also -- use when the second idea just adds another point in the same direction."}, {"front": "What's the difference between concession and plain contrast?", "back": "Concession (although, granted, admittedly) concedes a point before pivoting -- it's a narrower, two-step version of contrast."}, {"front": "Why are transition questions harder than they look?", "back": "Wrong answers are often grammatically fine words -- just wrong for THIS relationship. The word itself isn't the trap; misreading the relationship is."}], "bank": [{"question": "The forecast called for clear skies all week; ___, a sudden storm rolled in by Thursday afternoon.", "choices": ["however", "therefore", "furthermore", "subsequently"], "correctIndex": 0, "explanation": "The storm contradicts the forecast -- a contrast relationship. \"However\" fits; the others signal cause/effect, addition, or sequence, none of which match."}, {"question": "Critics dismissed the film as forgettable; audiences, ___, made it a surprise box-office hit.", "choices": ["on the other hand", "as a result", "for example", "meanwhile"], "correctIndex": 0, "explanation": "Audiences' reaction directly contrasts with critics' -- a contrast relationship, not a result, example, or simultaneous event."}, {"question": "The company's profits declined for three straight quarters. ___, executives refused to change the pricing strategy.", "choices": ["Nevertheless", "Consequently", "Specifically", "Afterward"], "correctIndex": 0, "explanation": "Refusing to change strategy despite declining profits is a contrast (an unexpected persistence), not a result of the decline."}, {"question": "The trail looked easy on the map; in ___, it took twice as long as expected to hike.", "choices": ["reality", "addition", "sequence", "conclusion"], "correctIndex": 0, "explanation": "\"In reality\" signals a contrast between expectation and what actually happened."}, {"question": "The bridge had been closed for repairs for months; ___, commuters faced hour-long detours every day.", "choices": ["as a result", "however", "for instance", "meanwhile"], "correctIndex": 0, "explanation": "The detours are a direct RESULT of the closure -- a cause/effect relationship."}, {"question": "Ticket sales far exceeded expectations. ___, the theater extended the show's run by another month.", "choices": ["Consequently", "Nevertheless", "In addition", "Eventually"], "correctIndex": 0, "explanation": "Extending the run is a direct consequence of strong sales -- cause/effect, not contrast or addition."}, {"question": "The soil in the region lacks essential nutrients; ___, farmers rely heavily on fertilizer.", "choices": ["therefore", "furthermore", "for example", "afterward"], "correctIndex": 0, "explanation": "Relying on fertilizer is a direct result of poor soil -- cause/effect."}, {"question": "The airline canceled dozens of flights due to the storm. ___, thousands of passengers were left stranded overnight.", "choices": ["As a result", "In contrast", "Specifically", "Similarly"], "correctIndex": 0, "explanation": "Passengers being stranded is a direct effect of the cancellations."}, {"question": "The museum's new wing features rotating art exhibits. ___, it houses a research library open to the public.", "choices": ["In addition", "As a result", "However", "Eventually"], "correctIndex": 0, "explanation": "The library is another feature alongside the exhibits -- addition, not a result or contrast."}, {"question": "The proposal would cut costs significantly. ___, it would streamline the approval process for future projects.", "choices": ["Furthermore", "Nevertheless", "Consequently", "Meanwhile"], "correctIndex": 0, "explanation": "This is a second, supporting benefit in the same direction as the first -- addition."}, {"question": "The new policy reduces paperwork for small businesses. It ___ simplifies the tax filing process.", "choices": ["also", "however", "therefore", "eventually"], "correctIndex": 0, "explanation": "\"Also\" signals a second supporting point, same direction as the first -- addition, not contrast or result."}, {"question": "The film's cinematography drew widespread praise. ___, its score was nominated for several awards.", "choices": ["Moreover", "Instead", "Thus", "Afterward"], "correctIndex": 0, "explanation": "A second point of praise in the same direction -- addition."}, {"question": "The committee reviewed the initial proposal in March. ___, they requested substantial revisions before the final vote.", "choices": ["Subsequently", "However", "For example", "Additionally"], "correctIndex": 0, "explanation": "This is about the ORDER of events over time, not a logical contrast, example, or addition -- sequence."}, {"question": "The construction crew poured the foundation in early spring. ___, the framing began once it had fully cured.", "choices": ["Afterward", "Nevertheless", "Consequently", "Specifically"], "correctIndex": 0, "explanation": "This describes a time sequence (foundation, then framing) -- not cause/effect or contrast."}, {"question": "The chef prepped all the vegetables the night before. ___, she focused only on the sauces and proteins during service.", "choices": ["That way", "However", "For instance", "In addition"], "correctIndex": 0, "explanation": "This signals the sequence and purpose of the earlier prep enabling the later focus, a time/method relationship."}, {"question": "The band recorded the album over six months. ___, they spent an additional year mixing and mastering it.", "choices": ["Then", "Therefore", "In contrast", "For example"], "correctIndex": 0, "explanation": "This is a straightforward time sequence between two stages of production."}, {"question": "___ the new software has a steep learning curve, most employees found it far more efficient within a few weeks.", "choices": ["Although", "Because", "Since", "So that"], "correctIndex": 0, "explanation": "\"Although\" concedes the learning curve before pivoting to the larger benefit -- a concession, not a plain cause."}, {"question": "___, the restaurant's prices are steep, but regulars insist the quality justifies the cost.", "choices": ["Granted", "Therefore", "Specifically", "Afterward"], "correctIndex": 0, "explanation": "\"Granted\" concedes the price point before pivoting to the counterpoint about quality -- concession."}, {"question": "The plan has clear flaws, ___, but it remains the most realistic option on the table.", "choices": ["admittedly", "consequently", "similarly", "eventually"], "correctIndex": 0, "explanation": "\"Admittedly\" concedes the flaws before pivoting to the practical case for the plan -- concession."}, {"question": "The city's public transit system has improved dramatically; ___, ridership has doubled in just two years.", "choices": ["indeed", "however", "meanwhile", "although"], "correctIndex": 0, "explanation": "\"Indeed\" reinforces and emphasizes the improvement with supporting evidence -- emphasis, not contrast."}, {"question": "Many of the region's crops struggled this season. Corn yields, ___, fell by nearly forty percent.", "choices": ["for example", "however", "therefore", "meanwhile"], "correctIndex": 0, "explanation": "This introduces a specific illustration of the general struggle described first -- example."}, {"question": "The senator's voting record reveals a consistent pattern; ___, she has opposed every major spending bill since taking office.", "choices": ["in fact", "in contrast", "as a result", "subsequently"], "correctIndex": 0, "explanation": "\"In fact\" reinforces the claim with a specific, stronger detail -- emphasis."}]}, "pronoun_agreement": {"name": "Pronoun-Antecedent Agreement & Case", "lesson": "**Pronoun-Antecedent Agreement & Case**\n\n**Number agreement**: trace a pronoun back to the EXACT noun it replaces\n(its antecedent), not just whichever noun happens to be closest, and match\nnumber (singular/plural).\n*Wrong:* Each of the students turned in their essay. *(Careful -- \"each\"\nis singular; the traditional ACT-tested fix is \"his or her essay,\" though\nsome modern usage accepts singular \"they.\" When both a clearly singular\noption and a clean rewrite are available, prefer the singular pronoun on\nthis test.)*\n*Right:* Each of the students turned in his or her essay.\n\n**Subject vs. object pronoun case**: subject pronouns (I, he, she, they,\nwho) perform the action; object pronouns (me, him, her, them, whom)\nreceive it.\n*Wrong:* Me and him went to the store. *Right:* He and I went to the\nstore.\n*Wrong:* The prize was given to she and I. *Right:* The prize was given\nto her and me.\n\n**The \"compound pronoun\" trick**: to check a pronoun in a compound\n(\"John and ___\"), mentally delete the other person and read it alone --\n\"Give the tickets to (John and) I\" sounds wrong alone (\"Give the tickets\nto I\"), revealing it should be \"me.\"\n\n**Who vs. whom**: \"who\" is a subject pronoun (performs the action); \"whom\"\nis an object pronoun (receives it). Trick: if you could answer the\nimplied question with \"he/she/they,\" use \"who\"; if you'd answer with\n\"him/her/them,\" use \"whom.\"\n*\"Who called?\" -> \"He called.\"* (who)\n*\"To whom did you give it?\" -> \"I gave it to him.\"* (whom)\n\n**Vague/ambiguous antecedents**: if a pronoun could logically refer to\nmore than one noun in the sentence, it's ambiguous and needs to be\nreplaced with the specific noun itself.\n*Ambiguous:* When Maria talked to Elena, she seemed upset. *(Who was\nupset -- Maria or Elena?)*\n*Fixed:* When Maria talked to Elena, Elena seemed upset.\n", "flashcards": [{"front": "Core rule for pronoun-antecedent number agreement?", "back": "Trace the pronoun back to the EXACT noun it replaces, not just the nearest noun, and match its number."}, {"front": "Subject vs. object pronouns -- what's the difference?", "back": "Subject pronouns (I, he, she, they, who) perform the action. Object pronouns (me, him, her, them, whom) receive it."}, {"front": "Quick trick for checking a pronoun in a compound (\"John and ___\")?", "back": "Delete the other person and read the pronoun alone. \"Give the tickets to I\" sounds wrong -> it should be \"me.\""}, {"front": "Who vs. whom -- how do you decide?", "back": "If you'd answer the implied question with \"he/she/they,\" use \"who.\" If you'd answer with \"him/her/them,\" use \"whom.\""}, {"front": "What makes a pronoun \"ambiguous,\" and how do you fix it?", "back": "It could logically refer to more than one noun in the sentence. Fix by replacing the pronoun with the specific noun itself."}], "bank": [{"question": "Each of the runners crossed the finish line with ___ arms raised in triumph.", "choices": ["his or her", "their", "its", "our"], "correctIndex": 0, "explanation": "\"Each\" is singular, so the pronoun referring back to it should be singular: \"his or her,\" not the plural \"their.\""}, {"question": "Neither the coach nor the players expressed ___ disappointment publicly after the loss.", "choices": ["their", "his", "its", "her"], "correctIndex": 0, "explanation": "The pronoun agrees with the closer noun, \"players\" (plural), matching the same proximity rule as subject-verb agreement with \"nor.\""}, {"question": "Every student must bring ___ own laptop to the exam.", "choices": ["his or her", "their", "its", "our"], "correctIndex": 0, "explanation": "\"Every\" makes the antecedent singular, so the pronoun should be singular: \"his or her.\""}, {"question": "The company announced that ___ would open three new locations this year.", "choices": ["it", "they", "them", "those"], "correctIndex": 0, "explanation": "A company is a singular entity (like \"committee\" or \"team\"), so it's referred to with \"it,\" not \"they.\""}, {"question": "The jury reached ___ verdict after six hours of deliberation.", "choices": ["its", "their", "it's", "his"], "correctIndex": 0, "explanation": "\"Jury\" is a singular collective noun, so the possessive pronoun is \"its,\" not \"their.\""}, {"question": "___ and I finished the project a week ahead of schedule.", "choices": ["He", "Him", "Me", "Them"], "correctIndex": 0, "explanation": "The pronoun performs the action (finished), so it needs the subject form: \"He,\" not the object form \"Him.\""}, {"question": "The manager assigned the new project to ___ and me.", "choices": ["him", "he", "I", "myself"], "correctIndex": 0, "explanation": "The pronoun receives the action (was assigned to), so it needs the object form: \"him,\" not \"he.\""}, {"question": "Between you and ___, this plan has serious flaws.", "choices": ["me", "I", "myself", "mine"], "correctIndex": 0, "explanation": "After a preposition (\"between\"), pronouns take the object form: \"me,\" not the subject form \"I.\""}, {"question": "The tickets were given to Sam and ___ before the show started.", "choices": ["her", "she", "herself", "hers"], "correctIndex": 0, "explanation": "The pronoun receives the action (were given to), so it needs the object form \"her.\""}, {"question": "___ and the twins arrived at the airport two hours early.", "choices": ["She", "Her", "Hers", "Herself"], "correctIndex": 0, "explanation": "The pronoun performs the action (arrived), so it needs the subject form \"She.\""}, {"question": "The award was presented to the coach and ___ at the banquet.", "choices": ["them", "they", "themselves", "theirs"], "correctIndex": 0, "explanation": "The pronoun receives the action (was presented to), so it needs the object form \"them.\""}, {"question": "___ left the door unlocked after the last customer left?", "choices": ["Who", "Whom", "Whoever's", "Who's"], "correctIndex": 0, "explanation": "The pronoun performs the action (left the door unlocked) -- \"He left the door unlocked\" confirms the subject form \"who.\""}, {"question": "___ did the committee select for the leadership position?", "choices": ["Whom", "Who", "Whose", "Who's"], "correctIndex": 0, "explanation": "The pronoun receives the action (was selected) -- \"They selected him\" confirms the object form \"whom.\""}, {"question": "The scholarship goes to the student ___ shows the most improvement over the year.", "choices": ["who", "whom", "whose", "who's"], "correctIndex": 0, "explanation": "The pronoun performs the action (shows improvement) -- \"He shows improvement\" confirms \"who.\""}, {"question": "Choose the panelist ___ you trust most to give an honest opinion.", "choices": ["whom", "who", "whose", "who's"], "correctIndex": 0, "explanation": "The pronoun receives the action (you trust him) -- \"You trust him\" confirms the object form \"whom.\""}, {"question": "Which choice avoids an ambiguous pronoun reference?", "choices": ["When Maria talked to Elena, she seemed upset about the decision.", "When Maria talked to Elena, Elena seemed upset about the decision.", "She seemed upset when Maria talked to Elena about the decision.", "Maria and Elena talked, and she seemed upset about the decision."], "correctIndex": 1, "explanation": "In the other options, \"she\" could logically refer to either Maria or Elena -- ambiguous. Naming \"Elena\" directly removes the ambiguity."}, {"question": "Which choice avoids an ambiguous pronoun reference?", "choices": ["The report contradicted the summary, which surprised the board.", "The report contradicted the summary, and this discrepancy surprised the board.", "It contradicted the summary, which surprised the board.", "The report contradicted the summary, surprising them."], "correctIndex": 1, "explanation": "\"Which\" in the other options could vaguely refer to the whole situation or either noun. \"This discrepancy\" names the specific thing that surprised the board."}, {"question": "Which choice avoids an ambiguous pronoun reference?", "choices": ["After the manager spoke with the intern, he submitted his resignation.", "After the manager spoke with the intern, the intern submitted his resignation.", "He submitted his resignation after speaking with the intern.", "The manager and the intern spoke, and he later submitted his resignation."], "correctIndex": 1, "explanation": "In the other choices, \"he\" could refer to either the manager or the intern. Naming \"the intern\" directly removes the ambiguity."}]}, "parallel_structure": {"name": "Parallel Structure", "lesson": "**Parallel Structure**\n\nEvery item in a list, series, or comparison must share the SAME\ngrammatical form -- all \"-ing\" words, all \"to + verb,\" all plain nouns,\nnever a mix.\n\n**Lists/series**: check each item's form matches the others.\n*Wrong:* She enjoys hiking, swimming, and to bike on weekends.\n*Right:* She enjoys hiking, swimming, and biking on weekends.\n\n**Correlative conjunctions** (not only...but also; either...or;\nneither...nor; both...and): whatever grammatical form follows the FIRST\nhalf must match the form following the SECOND half.\n*Wrong:* The plan was not only expensive but also it would take too long.\n*Right:* The plan was not only expensive but also time-consuming.\n(adjective matches adjective)\n\n**Comparisons**: the two things being compared need matching grammatical\nform.\n*Wrong:* Learning to code is harder than to learn a new language.\n*Right:* Learning to code is harder than learning a new language.\n\n**The test**: isolate just the list items (or the two halves of the\ncorrelative pair, or the two things being compared) and read them side by\nside, stripped of the surrounding sentence -- if they don't \"match\noutfits\" grammatically, something needs to change.\n", "flashcards": [{"front": "Core rule for parallel structure?", "back": "Every item in a list, series, or comparison must share the same grammatical form -- all -ing, all \"to + verb,\" all plain nouns, never mixed."}, {"front": "Correlative conjunctions to watch for?", "back": "not only...but also; either...or; neither...nor; both...and -- whatever form follows the first half must match the form after the second half."}, {"front": "Quick test for spotting a parallel structure error?", "back": "Isolate just the list items (or comparison halves) and read them side by side, stripped of the sentence around them -- do they \"match outfits\" grammatically?"}, {"front": "Example fix: \"She enjoys hiking, swimming, and to bike.\"", "back": "\"She enjoys hiking, swimming, and biking\" -- all three items need the same -ing form."}], "bank": [{"question": "Choose the version with correct parallel structure.", "choices": ["The recipe requires chopping the onions, dicing the peppers, and to season with salt.", "The recipe requires chopping the onions, dicing the peppers, and seasoning with salt.", "The recipe requires to chop the onions, dicing the peppers, and seasoning with salt.", "The recipe requires chopping the onions, to dice the peppers, and seasoning with salt."], "correctIndex": 1, "explanation": "All three items need the same \"-ing\" form. Only this option keeps \"chopping, dicing, seasoning\" consistent throughout."}, {"question": "Choose the version with correct parallel structure.", "choices": ["He is known for his patience, his creativity, and being generous.", "He is known for his patience, his creativity, and his generosity.", "He is known for being patient, his creativity, and his generosity.", "He is known for patience, being creative, and generosity."], "correctIndex": 1, "explanation": "All three items should be matching possessive noun phrases: \"his patience, his creativity, his generosity.\""}, {"question": "Choose the version with correct parallel structure.", "choices": ["The workshop covers how to write a resume, interview skills, and negotiating salary.", "The workshop covers writing a resume, interviewing skills, and negotiating salary.", "The workshop covers how to write a resume, how to interview, and how to negotiate salary.", "The workshop covers resume writing, interview skills, and how to negotiate salary."], "correctIndex": 2, "explanation": "All three items match the \"how to + verb\" pattern consistently."}, {"question": "Choose the version with correct parallel structure.", "choices": ["The novel is praised for its vivid imagery, complex characters, and it has a gripping plot.", "The novel is praised for its vivid imagery, its complex characters, and its gripping plot.", "The novel is praised for vivid imagery, complex characters, and having a gripping plot.", "The novel is praised because of vivid imagery, complex characters, and a gripping plot."], "correctIndex": 1, "explanation": "All three items should be matching possessive noun phrases beginning with \"its.\""}, {"question": "Choose the version with correct parallel structure.", "choices": ["The coach emphasized discipline, teamwork, and to communicate clearly.", "The coach emphasized discipline, teamwork, and clear communication.", "The coach emphasized being disciplined, teamwork, and clear communication.", "The coach emphasized discipline, working as a team, and clear communication."], "correctIndex": 1, "explanation": "All three items are plain noun phrases, consistently matched."}, {"question": "Choose the version with correct parallel structure.", "choices": ["The plan was not only expensive but also it would take too long.", "The plan was not only expensive but also time-consuming.", "The plan was not only costing a lot but also time-consuming.", "Not only was the plan expensive, but also it was time-consuming too."], "correctIndex": 1, "explanation": "Both halves of \"not only...but also\" need the same form -- here, two adjectives: \"expensive\" and \"time-consuming.\""}, {"question": "Choose the version with correct parallel structure.", "choices": ["The festival offers either live music or you can visit local food vendors.", "The festival offers either live music or local food vendors.", "The festival either offers live music or you can visit local food vendors.", "Either the festival offers live music, or local food vendors are available."], "correctIndex": 1, "explanation": "Both halves of \"either...or\" need the same form -- here, two matching noun phrases."}, {"question": "Choose the version with correct parallel structure.", "choices": ["The proposal was rejected because it was neither cost-effective nor did it solve the problem.", "The proposal was rejected because it was neither cost-effective nor effective at solving the problem.", "The proposal was rejected because it was neither cost-effective nor it solved the problem.", "Neither was the proposal cost-effective, nor did it solve the problem effectively."], "correctIndex": 1, "explanation": "Both halves of \"neither...nor\" need the same form -- here, two matching adjective phrases."}, {"question": "Choose the version with correct parallel structure.", "choices": ["The program is designed both to educate students and for entertaining them.", "The program is designed both to educate students and to entertain them.", "The program is designed both for educating students and to entertain them.", "Both the program educates students, and it entertains them too."], "correctIndex": 1, "explanation": "Both halves of \"both...and\" need matching \"to + verb\" phrases."}, {"question": "Choose the version with correct parallel structure.", "choices": ["Learning to code is harder than to learn a new language.", "Learning to code is harder than learning a new language.", "To learn to code is harder than learning a new language.", "Coding is harder than to learn a new language."], "correctIndex": 1, "explanation": "Both halves of the comparison need the same \"-ing\" form: \"learning to code\" and \"learning a new language.\""}, {"question": "Choose the version with correct parallel structure.", "choices": ["Running a marathon requires more discipline than to train for a sprint.", "Running a marathon requires more discipline than training for a sprint.", "To run a marathon requires more discipline than training for a sprint.", "Running a marathon requires more discipline than a sprint's training."], "correctIndex": 1, "explanation": "Both halves of the comparison need matching \"-ing\" forms."}, {"question": "Choose the version with correct parallel structure.", "choices": ["Her approach to teaching is more patient than his approach, which is strict.", "Her approach to teaching is more patient than his strict approach.", "Her teaching approach is more patient than how strictly he approaches it.", "She teaches more patiently than his approach, which is strict."], "correctIndex": 1, "explanation": "Comparing \"her approach\" to \"his approach\" (both noun phrases) keeps the comparison parallel and concise."}]}, "advanced_circles": {"name": "Advanced Circles", "lesson": "**Advanced Circles**\n\nThree sub-skills, each building on the basic arc length idea:\n\n**1. Basic arc length**: arc length = (angle/360) x circumference =\n(angle/360) x 2 x pi x r. The angle is always the CENTRAL angle (measured\nfrom the circle's center), as a fraction of the full 360 degrees.\n\n**2. Concentric arcs sharing a central angle**: if two arcs share the same\ncentral angle but have different radii, their arc lengths are in the SAME\nratio as their radii (since the angle-fraction is identical for both).\narc_length_2 = arc_length_1 x (r2 / r1). You don't need to know the angle\nat all -- just the ratio of the radii.\n\n**3. Inscribed angle and arc length**: the Inscribed Angle Theorem says an\ninscribed angle is always HALF the central angle that subtends the same\narc. So if you're given an inscribed angle, double it to get the central\nangle before computing arc length. A key related fact: if the hypotenuse\nof a right triangle is a diameter of the circle it's inscribed in, the\nright angle sits on the circle (Thales' theorem) -- useful for setting up\nwhich arcs correspond to which angles.\n", "flashcards": [{"front": "Arc length formula?", "back": "arc length = (central angle / 360) x 2 x pi x r"}, {"front": "Two concentric arcs share the same central angle but different radii -- how do their arc lengths relate?", "back": "They're in the same ratio as their radii: arc_2 = arc_1 x (r2/r1). The angle cancels out."}, {"front": "Inscribed Angle Theorem?", "back": "An inscribed angle is always HALF the central angle subtending the same arc. Double an inscribed angle to get the corresponding central angle."}, {"front": "Thales' theorem -- when does a right angle sit on a circle?", "back": "Whenever the hypotenuse of the right triangle is a diameter of the circle it's inscribed in."}], "bank": [{"question": "A circle has radius 12. What is the length of an arc with a central angle of 60 degrees? (Express your answer in terms of pi.)", "choices": ["2pi", "24pi", "8pi", "4pi"], "correctIndex": 3, "explanation": "Arc length = (60/360) x 2 x pi x 12 = 4pi."}, {"question": "A circle has radius 8. What is the length of an arc with a central angle of 90 degrees? (Express your answer in terms of pi.)", "choices": ["8pi", "16pi", "2pi", "4pi"], "correctIndex": 3, "explanation": "Arc length = (90/360) x 2 x pi x 8 = 4pi."}, {"question": "A circle has radius 9. What is the length of an arc with a central angle of 120 degrees? (Express your answer in terms of pi.)", "choices": ["18pi", "3pi", "12pi", "6pi"], "correctIndex": 3, "explanation": "Arc length = (120/360) x 2 x pi x 9 = 6pi."}, {"question": "A circle has radius 16. What is the length of an arc with a central angle of 45 degrees? (Express your answer in terms of pi.)", "choices": ["8pi", "2pi", "4pi", "32pi"], "correctIndex": 2, "explanation": "Arc length = (45/360) x 2 x pi x 16 = 4pi."}, {"question": "A circle has radius 24. What is the length of an arc with a central angle of 30 degrees? (Express your answer in terms of pi.)", "choices": ["4pi", "48pi", "2pi", "8pi"], "correctIndex": 0, "explanation": "Arc length = (30/360) x 2 x pi x 24 = 4pi."}, {"question": "A circle has radius 18. What is the length of an arc with a central angle of 60 degrees? (Express your answer in terms of pi.)", "choices": ["3pi", "36pi", "6pi", "12pi"], "correctIndex": 2, "explanation": "Arc length = (60/360) x 2 x pi x 18 = 6pi."}, {"question": "Two arcs share the same central angle from the same center point. The smaller arc has radius 6 and length 9. The larger arc has radius 16. What is the length of the larger arc?", "choices": ["24", "9", "12", "19"], "correctIndex": 0, "explanation": "Arcs sharing the same central angle have lengths in the same ratio as their radii: length_2 = 9 x (16/6) = 24. The angle itself doesn't need to be known."}, {"question": "Two arcs share the same central angle from the same center point. The smaller arc has radius 4 and length 6. The larger arc has radius 10. What is the length of the larger arc?", "choices": ["12", "9", "15", "6"], "correctIndex": 2, "explanation": "Arcs sharing the same central angle have lengths in the same ratio as their radii: length_2 = 6 x (10/4) = 15. The angle itself doesn't need to be known."}, {"question": "Two arcs share the same central angle from the same center point. The smaller arc has radius 3 and length 12. The larger arc has radius 15. What is the length of the larger arc?", "choices": ["15", "60", "24", "12"], "correctIndex": 1, "explanation": "Arcs sharing the same central angle have lengths in the same ratio as their radii: length_2 = 12 x (15/3) = 60. The angle itself doesn't need to be known."}, {"question": "A triangle is inscribed in a circle of radius 12, with one side of the triangle as a diameter. The inscribed angle opposite a particular arc measures 30 degrees. What is the length of that arc? (In terms of pi.)", "choices": ["4pi", "24pi", "2pi", "8pi"], "correctIndex": 0, "explanation": "The Inscribed Angle Theorem: the central angle is DOUBLE the inscribed angle, so the central angle is 60 degrees. Arc length = (60/360) x 2 x pi x 12 = 4pi. (A common mistake is using the inscribed angle 30 directly without doubling it.)"}, {"question": "A triangle is inscribed in a circle of radius 8, with one side of the triangle as a diameter. The inscribed angle opposite a particular arc measures 45 degrees. What is the length of that arc? (In terms of pi.)", "choices": ["16pi", "4pi", "2pi", "8pi"], "correctIndex": 1, "explanation": "The Inscribed Angle Theorem: the central angle is DOUBLE the inscribed angle, so the central angle is 90 degrees. Arc length = (90/360) x 2 x pi x 8 = 4pi. (A common mistake is using the inscribed angle 45 directly without doubling it.)"}, {"question": "A triangle is inscribed in a circle of radius 18, with one side of the triangle as a diameter. The inscribed angle opposite a particular arc measures 60 degrees. What is the length of that arc? (In terms of pi.)", "choices": ["24pi", "6pi", "12pi", "36pi"], "correctIndex": 2, "explanation": "The Inscribed Angle Theorem: the central angle is DOUBLE the inscribed angle, so the central angle is 120 degrees. Arc length = (120/360) x 2 x pi x 18 = 12pi. (A common mistake is using the inscribed angle 60 directly without doubling it.)"}, {"question": "A triangle is inscribed in a circle of radius 9, with one side of the triangle as a diameter. The inscribed angle opposite a particular arc measures 20 degrees. What is the length of that arc? (In terms of pi.)", "choices": ["18pi", "4pi", "2pi", "pi"], "correctIndex": 2, "explanation": "The Inscribed Angle Theorem: the central angle is DOUBLE the inscribed angle, so the central angle is 40 degrees. Arc length = (40/360) x 2 x pi x 9 = 2pi. (A common mistake is using the inscribed angle 20 directly without doubling it.)"}]}, "hard_math_mixed": {"name": "Hard Math Test Questions", "lesson": "**Hard Math Test Questions -- mixed practice**\n\nThese are the kinds of problems that tend to show up in the last 10\nquestions of an ACT math section -- across many different subjects\n(Algebra, Plane Geometry, Statistics, Coordinate Geometry, Trigonometry,\nComplex Numbers, Number Theory, Functions, and Sequences), mixed together\njust like they would be on the real test.\n\nThere's no single technique to learn here -- the skill is diagnosing\nWHICH subject a problem belongs to at a glance, then applying the right\ntool quickly, the same way you'd need to on test day when hard problems\nfrom completely different topics appear back to back.\n", "flashcards": [{"front": "What makes late-test math problems harder than early ones?", "back": "Not usually harder individual concepts -- more steps combined together, and less obvious which formula/technique applies at first glance."}, {"front": "Strategy for a mixed hard-question set like this one?", "back": "Diagnose the subject first (Algebra? Geometry? Trig?) before picking a technique -- the same triage instinct as the probability decision tree, applied across all of math."}], "bank": [{"question": "For what value of k does the system 2x + 3y = 12 and kx - y = 5 have NO solution?", "choices": ["3/2", "-3/2", "2/3", "-2/3"], "correctIndex": 3, "explanation": "Rewrite both in slope-intercept form: y = -(2/3)x + 4, and y = kx - 5. No solution requires equal slopes with different intercepts: k = -2/3 (and -5 != 4, so it's automatically satisfied)."}, {"question": "A ball's height is modeled by h(t) = -16t^2 + 64t (in feet, t in seconds). What is the ball's maximum height?", "choices": ["64", "4", "52", "72"], "correctIndex": 0, "explanation": "Maximum occurs at the vertex, t = -b/(2a) = -64/(2*-16) = 2. h(2) = -16(2)^2 + 64(2) = 64 feet."}, {"question": "For how many integer values of x is |2x - 5| < 9 true?", "choices": ["8", "9", "7", "10"], "correctIndex": 0, "explanation": "-9 < 2x-5 < 9 -> -4 < 2x < 14 -> -2 < x < 7. Integers strictly between -2 and 7: -1, 0, 1, 2, 3, 4, 5, 6 -- that's 8 values."}, {"question": "Simplify: (x^2 - 9) / (x^2 - x - 12)", "choices": ["(x+3)/(x-4)", "(x-3)/(x+4)", "(x-3)/(x-4)", "(x-3)/(x-12)"], "correctIndex": 2, "explanation": "Factor both: (x-3)(x+3) / ((x-4)(x+3)). The (x+3) factors cancel, leaving (x-3)/(x-4)."}, {"question": "A boat travels 60 miles downstream in 3 hours and returns the same 60 miles upstream in 5 hours. What is the boat's speed in still water, in mph?", "choices": ["12", "16", "18", "17"], "correctIndex": 1, "explanation": "Downstream speed = 60/3 = 20 = boat+current. Upstream speed = 60/5 = 12 = boat-current. Adding the two equations: 2*boat = 32, so boat = 16 mph."}, {"question": "If x = 3 is one root of x^3 - 2x^2 - 5x + 6 = 0, what are the other two roots?", "choices": ["2 and 1", "2 and -1", "-2 and -1", "-2 and 1"], "correctIndex": 3, "explanation": "Dividing by (x-3) gives x^2 + x - 2 = (x+2)(x-1), so the other roots are x = -2 and x = 1."}, {"question": "Solve for r in terms of A and P: A = P(1 + r)^2", "choices": ["r = sqrt(A) / P - 1", "r = sqrt(A/P) + 1", "r = sqrt(A/P) - 1", "r = A/P - 1"], "correctIndex": 2, "explanation": "Divide both sides by P: (1+r)^2 = A/P. Take the square root: 1 + r = sqrt(A/P). Subtract 1: r = sqrt(A/P) - 1."}, {"question": "A rectangle's length is 3 more than twice its width. If the perimeter is at most 42, what is the maximum possible width?", "choices": ["6", "12", "7", "9"], "correctIndex": 0, "explanation": "Perimeter = 2(L+W) = 2((2W+3)+W) = 6W+6. Setting 6W+6 <= 42 gives W <= 6, so the maximum width is 6."}, {"question": "A rectangular prism has length 8, width 5, and volume 200. What is its height?", "choices": ["8", "5", "10", "4"], "correctIndex": 1, "explanation": "Volume = l*w*h, so 200 = 8*5*h = 40h, giving h = 5."}, {"question": "A cube has a volume of 125 cubic units. What is its total surface area?", "choices": ["125", "175", "150", "100"], "correctIndex": 2, "explanation": "Volume 125 means each side is the cube root of 125 = 5. Surface area = 6 * side^2 = 6*25 = 150."}, {"question": "A figure consists of a 10-by-6 rectangle with a semicircle of diameter 6 removed from one side. What is the area of the figure?", "choices": ["54 - 4.5pi", "60 - 4.5pi", "60 - 3pi", "60 - 9pi"], "correctIndex": 1, "explanation": "Rectangle area = 60. The removed semicircle has radius 3, area = (1/2)*pi*3^2 = 4.5pi. Remaining area = 60 - 4.5pi."}, {"question": "Triangle ABC is similar to triangle DEF. If AB = 8, BC = 12, and DE = 6, what is EF?", "choices": ["9", "10", "7.5", "8"], "correctIndex": 0, "explanation": "The scale factor is DE/AB = 6/8 = 3/4. EF = BC * (3/4) = 12 * 3/4 = 9."}, {"question": "In a 30-60-90 triangle, the longer leg measures 5*sqrt(3). What is the triangle's perimeter?", "choices": ["15 + 5*sqrt(3)", "20", "15 + 10*sqrt(3)", "10 + 5*sqrt(3)"], "correctIndex": 0, "explanation": "In a 30-60-90 triangle, sides are in ratio x : x*sqrt(3) : 2x. If the longer leg (x*sqrt(3)) is 5*sqrt(3), then x=5 (short leg) and the hypotenuse is 10. Perimeter = 5 + 5*sqrt(3) + 10 = 15 + 5*sqrt(3)."}, {"question": "A running track has two straight sides of 100 meters connected by two semicircular ends of radius 20 meters. What is the total perimeter?", "choices": ["240pi", "100 + 40pi", "200 + 20pi", "200 + 40pi"], "correctIndex": 3, "explanation": "The two straight sides contribute 200 meters. The two semicircular ends together form one full circle: circumference = 2*pi*20 = 40pi. Total: 200 + 40pi."}, {"question": "A 25-foot ladder leans against a wall with its base 7 feet from the wall. If the base is pulled out to 15 feet from the wall, how far does the top of the ladder slide down?", "choices": ["3", "5", "7", "4"], "correctIndex": 3, "explanation": "Original height: sqrt(25^2 - 7^2) = sqrt(625-49) = sqrt(576) = 24. New height: sqrt(625-225) = sqrt(400) = 20. The top slides down 24 - 20 = 4 feet."}, {"question": "Two parallel lines are cut by a transversal. One same-side interior angle measures (3x + 10) degrees, and the other measures (2x + 30) degrees. What is x?", "choices": ["28", "30", "25", "20"], "correctIndex": 0, "explanation": "Same-side interior angles are supplementary: (3x+10) + (2x+30) = 180. That's 5x + 40 = 180, so 5x = 140 and x = 28."}, {"question": "Two similar polygons have corresponding sides in a ratio of 2:5. If the smaller polygon has an area of 12, what is the area of the larger polygon?", "choices": ["30", "75", "48", "60"], "correctIndex": 1, "explanation": "Area ratio equals the square of the side ratio: (5/2)^2 = 25/4. Larger area = 12 * 25/4 = 75."}, {"question": "The mean of 5 numbers is 14. Four of the numbers are 10, 12, 16, and 18. What is the fifth number?", "choices": ["14", "16", "12", "10"], "correctIndex": 0, "explanation": "The sum of all 5 numbers is 5*14 = 70. The known four sum to 56, so the fifth number is 70 - 56 = 14."}, {"question": "A student's grade is 30% based on one test (scored 80) and 70% based on a second test (scored 92). What is the weighted average grade?", "choices": ["86", "84.4", "90", "88.4"], "correctIndex": 3, "explanation": "Weighted average = 0.30(80) + 0.70(92) = 24 + 64.4 = 88.4."}, {"question": "A data set of 6 numbers has a mean of 20. If a 7th value of 34 is added, what is the new mean?", "choices": ["20", "22", "24", "23"], "correctIndex": 1, "explanation": "Original sum = 6*20 = 120. New sum = 120+34 = 154. New mean = 154/7 = 22."}, {"question": "A data set is 4, 6, 6, 8, 10, x. If the mean of the data set equals its mode, what is x?", "choices": ["8", "6", "2", "4"], "correctIndex": 2, "explanation": "The mode is 6 (it appears twice). Setting the mean equal to 6: (4+6+6+8+10+x)/6 = 6, so 34+x = 36, giving x = 2."}, {"question": "In a survey of 100 students, 60 play a sport and 45 play an instrument. If 20 students do neither, how many play both?", "choices": ["20", "15", "25", "30"], "correctIndex": 2, "explanation": "At least one activity: 100 - 20 = 80. By inclusion-exclusion: 60 + 45 - both = 80, so both = 105 - 80 = 25."}, {"question": "A line of best fit is given by y = 2.5x + 10. Using this model, what is the predicted y-value when x = 8?", "choices": ["28", "32", "30", "25"], "correctIndex": 2, "explanation": "y = 2.5(8) + 10 = 20 + 10 = 30."}, {"question": "A class of 25 students has an average score of 78. If 5 new students join with an average score of 90, what is the new overall average?", "choices": ["82", "79", "80", "84"], "correctIndex": 2, "explanation": "Original total: 25*78 = 1950. New students' total: 5*90 = 450. Combined: 2400 over 30 students = 80."}, {"question": "What is the center and radius of the circle x^2 + y^2 - 6x + 4y - 12 = 0?", "choices": ["center (-3, 2), radius 5", "center (3, -2), radius 25", "center (6, -4), radius 5", "center (3, -2), radius 5"], "correctIndex": 3, "explanation": "Complete the square: (x-3)^2 - 9 + (y+2)^2 - 4 - 12 = 0, so (x-3)^2 + (y+2)^2 = 25. Center (3,-2), radius sqrt(25)=5."}, {"question": "What is the vertex of the parabola y = 2(x-3)^2 + 7?", "choices": ["(-3, 7)", "(3, 7)", "(2, 7)", "(3, -7)"], "correctIndex": 1, "explanation": "In vertex form y = a(x-h)^2 + k, the vertex is (h,k) = (3,7)."}, {"question": "Point P divides segment AB such that AP:PB = 2:3. If A = (1,1) and B = (11,16), what are the coordinates of P?", "choices": ["(6, 8)", "(4, 6)", "(5, 7)", "(7, 10)"], "correctIndex": 2, "explanation": "P = A + (2/5)(B-A) = (1 + 2/5*10, 1 + 2/5*15) = (1+4, 1+6) = (5,7)."}, {"question": "What is the area of the triangle with vertices (0,0), (6,0), and (0,8)?", "choices": ["28", "48", "14", "24"], "correctIndex": 3, "explanation": "This is a right triangle with legs 6 and 8 along the axes. Area = (1/2)(6)(8) = 24."}, {"question": "The point (4,-3) is reflected over the y-axis, then translated up 5 units. What are the resulting coordinates?", "choices": ["(4, 2)", "(-4, -8)", "(-4, 8)", "(-4, 2)"], "correctIndex": 3, "explanation": "Reflecting over the y-axis negates the x-coordinate: (-4,-3). Translating up 5 units adds 5 to y: (-4, 2)."}, {"question": "Find the distance between the points (-3,4) and (5,-2).", "choices": ["14", "sqrt(28)", "10", "8"], "correctIndex": 2, "explanation": "Distance = sqrt((5-(-3))^2 + (-2-4)^2) = sqrt(64+36) = sqrt(100) = 10."}, {"question": "In triangle ABC, a = 5, b = 8, and angle C = 60 degrees. Find side c using the Law of Cosines.", "choices": ["13", "sqrt(67)", "7", "6"], "correctIndex": 2, "explanation": "c^2 = a^2+b^2-2ab*cos(C) = 25+64-2(5)(8)(0.5) = 89-40 = 49, so c = 7."}, {"question": "In triangle ABC, angle A = 30 degrees, angle B = 45 degrees, and side a = 10. Find side b using the Law of Sines.", "choices": ["14.1", "5*sqrt(2)", "10*sqrt(2)", "10*sqrt(3)"], "correctIndex": 2, "explanation": "b/sin(B) = a/sin(A), so b = 10*sin(45)/sin(30) = 10*(sqrt(2)/2)/(1/2) = 10*sqrt(2)."}, {"question": "What is the exact value of sin(120 degrees)?", "choices": ["1/2", "sqrt(3)/2", "sqrt(2)/2", "-sqrt(3)/2"], "correctIndex": 1, "explanation": "120 degrees = 180-60, and sin(180-x)=sin(x), so sin(120) = sin(60) = sqrt(3)/2."}, {"question": "A ladder leans against a wall making a 60-degree angle with the ground. If the base is 4 feet from the wall, how high up the wall does the ladder reach?", "choices": ["4/sqrt(3)", "4*sqrt(2)", "4*sqrt(3)", "8"], "correctIndex": 2, "explanation": "tan(60) = height/4, so height = 4*tan(60) = 4*sqrt(3)."}, {"question": "What are the amplitude and period of y = 3sin(2x)?", "choices": ["amplitude 3, period pi", "amplitude 6, period pi", "amplitude 3, period 2pi", "amplitude 2, period pi"], "correctIndex": 0, "explanation": "Amplitude is the coefficient in front, 3. Period = 2*pi / |b| where b is the coefficient of x: 2*pi/2 = pi."}, {"question": "What is i^37?", "choices": ["i", "-i", "1", "-1"], "correctIndex": 0, "explanation": "Powers of i cycle every 4: i, -1, -i, 1. 37 mod 4 = 1, so i^37 = i^1 = i."}, {"question": "Simplify: (3 + 4i) + (2 - 7i)", "choices": ["5 - 3i", "5 - 11i", "5 + 3i", "1 - 3i"], "correctIndex": 0, "explanation": "Add real parts (3+2=5) and imaginary parts (4-7=-3): 5 - 3i."}, {"question": "Simplify: (2 + 3i)(1 - 4i)", "choices": ["-10 - 5i", "2 - 12i", "14 + 5i", "14 - 5i"], "correctIndex": 3, "explanation": "Expand: 2 - 8i + 3i - 12i^2 = 2 - 5i - 12(-1) = 2 - 5i + 12 = 14 - 5i."}, {"question": "Simplify: (5 + 2i) / (1 - i)", "choices": ["5/2 + 2i", "3 + 7i", "3/2 + 7i/2", "5 + 2i"], "correctIndex": 2, "explanation": "Multiply numerator and denominator by the conjugate (1+i): (5+2i)(1+i) / ((1)^2+(1)^2) = (5+5i+2i-2) / 2 = (3+7i)/2."}, {"question": "What is the greatest common factor of 84, 126, and 210?", "choices": ["21", "14", "6", "42"], "correctIndex": 3, "explanation": "GCF(84,126): 126-84=42, and 42 divides both. GCF(42,210): 210/42=5 exactly. So the GCF of all three is 42."}, {"question": "When a number N is divided by 12, the remainder is 7. What is the remainder when 3N is divided by 12?", "choices": ["21", "9", "3", "7"], "correctIndex": 1, "explanation": "N = 12k+7, so 3N = 36k+21 = 12(3k+1) + 9. The remainder is 9."}, {"question": "Two lights blink every 8 seconds and 12 seconds respectively, blinking together at t=0. How many more times will they blink together within the next 120 seconds?", "choices": ["6", "5", "4", "10"], "correctIndex": 1, "explanation": "They blink together every LCM(8,12)=24 seconds. Within the next 120 seconds: 24, 48, 72, 96, 120 -- that's 5 times."}, {"question": "If f(x) = 2x + 3 and g(x) = x^2 - 1, find f(g(2)).", "choices": ["13", "9", "7", "11"], "correctIndex": 1, "explanation": "First g(2) = 4-1 = 3. Then f(3) = 2(3)+3 = 9."}, {"question": "The graph of y = f(x) is shifted 3 units left and 2 units down. Write the new function in terms of f.", "choices": ["y = f(x-3) + 2", "y = f(x+3) - 2", "y = f(x+3) + 2", "y = f(x-3) - 2"], "correctIndex": 1, "explanation": "Shifting left 3 replaces x with (x+3) inside the function. Shifting down 2 subtracts 2 from the outside: f(x+3) - 2."}, {"question": "What is the domain of f(x) = sqrt(x - 5)?", "choices": ["all real numbers", "x <= 5", "x > 5", "x >= 5"], "correctIndex": 3, "explanation": "The expression under a square root must be non-negative: x-5 >= 0, so x >= 5."}, {"question": "Find the sum of the first 20 terms of the arithmetic sequence 3, 7, 11, 15, ...", "choices": ["820", "840", "800", "780"], "correctIndex": 0, "explanation": "a1=3, d=4, n=20. Sum = n/2 * (2*a1 + (n-1)*d) = 10*(6+76) = 10*82 = 820."}, {"question": "Find the sum of the first 6 terms of the geometric sequence 2, 6, 18, 54, ...", "choices": ["728", "730", "726", "364"], "correctIndex": 0, "explanation": "a1=2, r=3, n=6. Sum = a1*(r^n - 1)/(r-1) = 2*(729-1)/2 = 728."}]}, "speed_round_bank": [{"topic": "Ratios & Proportional Relationships", "question": "A mixture has ingredients in the ratio 3:5. If the total is 24 units, how many units of the first ingredient are there?", "choices": ["14", "9", "24", "15"], "correctIndex": 1, "explanation": "Total parts = 3+5 = 8. First ingredient = (3/8) x 24 = 9."}, {"topic": "Ratios & Proportional Relationships", "question": "A mixture has ingredients in the ratio 2:7. If the total is 36 units, how many units of the first ingredient are there?", "choices": ["8", "28", "15", "36"], "correctIndex": 0, "explanation": "Total parts = 2+7 = 9. First ingredient = (2/9) x 36 = 8."}, {"topic": "Ratios & Proportional Relationships", "question": "A mixture has ingredients in the ratio 5:8. If the total is 52 units, how many units of the first ingredient are there?", "choices": ["32", "52", "28", "20"], "correctIndex": 3, "explanation": "Total parts = 5+8 = 13. First ingredient = (5/13) x 52 = 20."}, {"topic": "Ratios & Proportional Relationships", "question": "A mixture has ingredients in the ratio 7:3. If the total is 30 units, how many units of the first ingredient are there?", "choices": ["30", "21", "9", "24"], "correctIndex": 1, "explanation": "Total parts = 7+3 = 10. First ingredient = (7/10) x 30 = 21."}, {"topic": "Ratios & Proportional Relationships", "question": "A mixture has ingredients in the ratio 6:11. If the total is 68 units, how many units of the first ingredient are there?", "choices": ["68", "44", "24", "35"], "correctIndex": 2, "explanation": "Total parts = 6+11 = 17. First ingredient = (6/17) x 68 = 24."}, {"topic": "Ratios & Proportional Relationships", "question": "A mixture has ingredients in the ratio 9:4. If the total is 65 units, how many units of the first ingredient are there?", "choices": ["20", "49", "45", "65"], "correctIndex": 2, "explanation": "Total parts = 9+4 = 13. First ingredient = (9/13) x 65 = 45."}, {"topic": "Ratios & Proportional Relationships", "question": "A mixture has ingredients in the ratio 5:12. If the total is 85 units, how many units of the first ingredient are there?", "choices": ["25", "37", "85", "60"], "correctIndex": 0, "explanation": "Total parts = 5+12 = 17. First ingredient = (5/17) x 85 = 25."}, {"topic": "Ratios & Proportional Relationships", "question": "A mixture has ingredients in the ratio 4:9. If the total is 39 units, how many units of the first ingredient are there?", "choices": ["27", "12", "39", "21"], "correctIndex": 1, "explanation": "Total parts = 4+9 = 13. First ingredient = (4/13) x 39 = 12."}, {"topic": "Polynomial Operations", "question": "Expand and simplify: (2x + 3)(x - 4)", "choices": ["2x^2 - 12", "2x^2 - 5x - 12", "2x^2 + 5x - 12", "2x^2 - 5x + 12"], "correctIndex": 1, "explanation": "FOIL/distribute each term and combine like terms to get 2x^2 - 5x - 12."}, {"topic": "Polynomial Operations", "question": "Expand and simplify: (x + 5)(x + 5)", "choices": ["x^2 + 10x - 25", "x^2 + 10x + 25", "x^2 + 5x + 25", "x^2 + 25"], "correctIndex": 1, "explanation": "FOIL/distribute each term and combine like terms to get x^2 + 10x + 25."}, {"topic": "Polynomial Operations", "question": "Ex let audioCtx = null;
let soundOn = true;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, startOffset, dur, type, vol) {
  if (!soundOn) return;
  try {
    const c = ctx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, c.currentTime + startOffset);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + startOffset + dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(c.currentTime + startOffset); osc.stop(c.currentTime + startOffset + dur);
  } catch (e) { /* ignore audio errors */ }
}
function sweep(freqStart, freqEnd, startOffset, dur, type, vol) {

  try {
    const c = ctx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, c.currentTime + startOffset);
    osc.frequency.linearRampToValueAtTime(freqEnd, c.currentTime + startOffset + dur);
    gain.gain.setValueAtTime(vol, c.currentTime + startOffset);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + startOffset + dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(c.currentTime + startOffset); osc.stop(c.currentTime + startOffset + dur);
  } catch (e) { /* ignore audio errors */ }
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function progressDocId(conceptId) { return state.user + "_" + conceptId; }
function metaDocId() { return state.user + "_meta"; }

async function loadProgress() {
  state.progress = {};
  state.meta = defaultMeta();
  let metaExisted = false;
  if (db) {
    for (const cid of CONCEPT_ORDER) {
      try {
        const snap = await db.collection(PROGRESS_COLLECTION).doc(progressDocId(cid)).get();
        if (snap.exists) state.progress[cid] = snap.data();
      } catch (e) { console.error("load progress failed", cid, e); }
    }
    try {
      const msnap = await db.collection(META_COLLECTION).doc(metaDocId()).get();
      if (msnap.exists) { state.meta = { ...defaultMeta(), ...msnap.data() }; metaExisted = true; }
    } catch (e) { console.error("load meta failed", e); }
  }
  state.isFirstTimeSetup = !metaExisted;
}

async function saveMeta() {
  if (db) {
    try { await db.collection(META_COLLECTION).doc(metaDocId()).set(state.meta, {merge: true}); }
    catch (e) { console.error("save meta failed", e); }
  }
}
async function savePassDate(conceptId) {
  const existing = state.progress[conceptId] || { passDates: [], attempts: 0 };
  const passDates = Array.from(new Set([...(existing.passDates || []), todayStr()]));
  const attempts = (existing.attempts || 0) + 1;
  const data = { user: state.user, conceptId, passDates, attempts, lastAttemptAt: Date.now() };
  state.progress[conceptId] = data;
  if (db) {
    try { await db.collection(PROGRESS_COLLECTION).doc(progressDocId(conceptId)).set(data, {merge: true}); }
    catch (e) { console.error("save failed", e); }
  }
}
async function saveAttemptOnly(conceptId) {
  const existing = state.progress[conceptId] || { passDates: [], attempts: 0 };
  const attempts = (existing.attempts || 0) + 1;
  const data = { ...existing, user: state.user, conceptId, attempts, lastAttemptAt: Date.now() };
  state.progress[conceptId] = data;
  if (db) {
    try { await db.collection(PROGRESS_COLLECTION).doc(progressDocId(conceptId)).set(data, {merge: true}); }
    catch (e) { console.error("save failed", e); }
  }
}
function recordQuizStreak(perfect) {
  if (perfect) {
    state.meta.currentStreak = (state.meta.currentStreak || 0) + 1;
    if (state.meta.currentStreak > (state.meta.bestStreak || 0)) state.meta.bestStreak = state.meta.currentStreak;
  } else {
    state.meta.currentStreak = 0;

function isMastered(conceptId) {
  const p = state.progress[conceptId];

function hasOnePass(conceptId) {

function shuffledIndices(n) {
  const arr = Array.from({length: n}, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function buildQuizQueue(conceptId) {
  const bank = CONTENT[conceptId].bank;
  const quizLen = CONTENT[conceptId].quizLength || 10;
  const idx = shuffledIndices(bank.length);
  const take = idx.slice(0, Math.min(quizLen, bank.length));
  return take.map(i => bank[i]);
}
function buildBossQueue() {
  const masteredIds = CONCEPT_ORDER.filter(isMastered);
  let pool = [];
  masteredIds.forEach(cid => { pool = pool.concat(CONTENT[cid].bank); });
  const idx = shuffledIndices(pool.length);
  const take = idx.slice(0, Math.min(12, pool.length));
  return take.map(i => pool[i]);
}
