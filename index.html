, so the square's side is r*sqrt(2) and its area is 2r^2. Circle area = pi*r^2. Ratio = 2r^2/(pi*r^2) = 2/pi."}, {"question": "A point is chosen randomly within a 7-by-6 rectangular region. A 2-by-4 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["4/21", "17/21", "6/13", "2/7"], "correctIndex": 0, "explanation": "Area-based: favorable area (2x4=8) over total area (7x6=42) = 4/21."}, {"question": "A point is chosen randomly within a 8-by-10 rectangular region. A 2-by-6 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["1/4", "4/9", "3/20", "17/20"], "correctIndex": 2, "explanation": "Area-based: favorable area (2x6=12) over total area (8x10=80) = 3/20."}, {"question": "A point is chosen randomly within a 12-by-4 rectangular region. A 11-by-2 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["11/24", "13/16", "11/12", "13/24"], "correctIndex": 0, "explanation": "Area-based: favorable area (11x2=22) over total area (12x4=48) = 11/24."}, {"question": "A point is chosen randomly within a 12-by-10 rectangular region. A 10-by-7 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["5/12", "17/22", "7/12", "5/6"], "correctIndex": 2, "explanation": "Area-based: favorable area (10x7=70) over total area (12x10=120) = 7/12."}, {"question": "A point is chosen randomly within a 8-by-4 rectangular region. A 7-by-2 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["7/8", "7/16", "3/4", "9/16"], "correctIndex": 1, "explanation": "Area-based: favorable area (7x2=14) over total area (8x4=32) = 7/16."}, {"question": "A point is chosen randomly within a 10-by-9 rectangular region. A 5-by-7 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["7/18", "12/19", "1/2", "11/18"], "correctIndex": 0, "explanation": "Area-based: favorable area (5x7=35) over total area (10x9=90) = 7/18."}, {"question": "A dart lands randomly within a circular target of radius 15. A smaller circle of radius 5 sits at the center. What is the probability the dart lands inside the smaller circle?", "choices": ["1/3", "2/3", "8/9", "1/9"], "correctIndex": 3, "explanation": "Area ratio of two circles: (r_inner/r_outer)^2 = (5/15)^2 = 1/9. The pi cancels out entirely since both areas use it."}, {"question": "A dart lands randomly within a circular target of radius 15. A smaller circle of radius 5 sits at the center. What is the probability the dart lands inside the smaller circle?", "choices": ["1/3", "8/9", "1/9", "2/3"], "correctIndex": 2, "explanation": "Area ratio of two circles: (r_inner/r_outer)^2 = (5/15)^2 = 1/9. The pi cancels out entirely since both areas use it."}, {"question": "A dart lands randomly within a circular target of radius 15. A smaller circle of radius 5 sits at the center. What is the probability the dart lands inside the smaller circle?", "choices": ["8/9", "2/3", "1/9", "1/3"], "correctIndex": 2, "explanation": "Area ratio of two circles: (r_inner/r_outer)^2 = (5/15)^2 = 1/9. The pi cancels out entirely since both areas use it."}, {"question": "A dart lands randomly within a circular target of radius 12. A smaller circle of radius 4 sits at the center. What is the probability the dart lands inside the smaller circle?", "choices": ["8/9", "2/3", "1/9", "1/3"], "correctIndex": 2, "explanation": "Area ratio of two circles: (r_inner/r_outer)^2 = (4/12)^2 = 1/9. The pi cancels out entirely since both areas use it."}]}, "prob_equation_diagnosis": {"name": "Probability: Choose the Equation", "lesson": "**Choosing the right equation**\n\nThis is the same diagnostic skill as before, one level more concrete: instead\nof naming the category, you pick the actual SETUP that solves it. You don't\neven need to compute the final answer -- just recognize which expression\ncorrectly represents the problem.\n\nThis matters because on the real test, picking the right setup is 90% of\nthe battle -- the arithmetic afterward is usually simple. Common wrong\nchoices swap addition for multiplication, forget to flip for a complement,\nforget to subtract an overlap, or use the wrong (unshrunk) denominator for a\nwithout-replacement second draw.\n", "flashcards": [{"front": "Why practice choosing the equation instead of just solving?", "back": "Picking the right setup is the hard part on the real test -- the arithmetic afterward is usually simple."}, {"front": "Most common wrong-equation trap for Complement problems?", "back": "Forgetting the \"1 -\" and just answering with P(the thing you were computing to flip)."}, {"front": "Most common wrong-equation trap for without-replacement AND problems?", "back": "Using the same (unshrunk) denominator for the second draw as the first."}, {"front": "Most common wrong-equation trap for overlapping OR problems?", "back": "Forgetting to subtract the overlap term entirely."}], "bank": [{"question": "A jar has 5 red and 3 blue marbles. Which equation gives the probability of drawing red?", "choices": ["5/8", "8/5", "3/8", "5/3"], "correctIndex": 0, "explanation": "Direct: favorable (5) over total (8)."}, {"question": "A jar has 3 red and 8 blue marbles. Which equation gives the probability of drawing red?", "choices": ["8/11", "3/11", "11/3", "3/8"], "correctIndex": 1, "explanation": "Direct: favorable (3) over total (11)."}, {"question": "A jar has 6 red and 4 blue marbles. Which equation gives the probability of drawing red?", "choices": ["10/6", "4/10", "6/10", "6/4"], "correctIndex": 2, "explanation": "Direct: favorable (6) over total (10)."}, {"question": "A jar has 8 red and 4 blue marbles. Which equation gives the probability of drawing red?", "choices": ["4/12", "8/12", "8/4", "12/8"], "correctIndex": 1, "explanation": "Direct: favorable (8) over total (12)."}, {"question": "A bag has 11 items, 2 defective. You draw 2 with replacement. Which equation gives P(at least one defective)?", "choices": ["2/11", "1-((11-2)/11)*((11-2)/11)", "((11-2)/11)*((11-2)/11)", "(2/11)*(2/11)"], "correctIndex": 1, "explanation": "\"At least one\" -> complement: 1 - P(none). P(none) = ((11-2)/11)*((11-2)/11)."}, {"question": "A bag has 10 items, 2 defective. You draw 2 with replacement. Which equation gives P(at least one defective)?", "choices": ["(2/10)*(2/10)", "1-((10-2)/10)*((10-2)/10)", "((10-2)/10)*((10-2)/10)", "2/10"], "correctIndex": 1, "explanation": "\"At least one\" -> complement: 1 - P(none). P(none) = ((10-2)/10)*((10-2)/10)."}, {"question": "A bag has 13 items, 2 defective. You draw 2 with replacement. Which equation gives P(at least one defective)?", "choices": ["2/13", "1-((13-2)/13)*((13-2)/13)", "(2/13)*(2/13)", "((13-2)/13)*((13-2)/13)"], "correctIndex": 1, "explanation": "\"At least one\" -> complement: 1 - P(none). P(none) = ((13-2)/13)*((13-2)/13)."}, {"question": "A bag has 15 items, 3 defective. You draw 2 with replacement. Which equation gives P(at least one defective)?", "choices": ["3/15", "(3/15)*(3/15)", "((15-3)/15)*((15-3)/15)", "1-((15-3)/15)*((15-3)/15)"], "correctIndex": 3, "explanation": "\"At least one\" -> complement: 1 - P(none). P(none) = ((15-3)/15)*((15-3)/15)."}, {"question": "A coin is flipped and a 4-sided die is rolled. Which equation gives P(heads AND rolling a specific number)?", "choices": ["1/2", "(1/2)*(1/4)", "(1/2)+(1/4)", "1/4"], "correctIndex": 1, "explanation": "Independent events joined by AND -> multiply the individual probabilities."}, {"question": "A coin is flipped and a 8-sided die is rolled. Which equation gives P(heads AND rolling a specific number)?", "choices": ["(1/2)+(1/8)", "1/8", "(1/2)*(1/8)", "1/2"], "correctIndex": 2, "explanation": "Independent events joined by AND -> multiply the individual probabilities."}, {"question": "A coin is flipped and a 8-sided die is rolled. Which equation gives P(heads AND rolling a specific number)?", "choices": ["1/2", "(1/2)+(1/8)", "1/8", "(1/2)*(1/8)"], "correctIndex": 3, "explanation": "Independent events joined by AND -> multiply the individual probabilities."}, {"question": "A bag has 5 red and 5 blue marbles (10 total). Two are drawn WITHOUT replacement. Which equation gives P(both red)?", "choices": ["5/10", "(5/10)+((5-1)/(10-1))", "(5/10)*((5-1)/(10-1))", "(5/10)*(5/10)"], "correctIndex": 2, "explanation": "Without replacement: the pool shrinks. First draw 5/10, second draw (5-1)/(10-1) since one red is gone."}, {"question": "A bag has 3 red and 6 blue marbles (9 total). Two are drawn WITHOUT replacement. Which equation gives P(both red)?", "choices": ["(3/9)+((3-1)/(9-1))", "(3/9)*((3-1)/(9-1))", "(3/9)*(3/9)", "3/9"], "correctIndex": 1, "explanation": "Without replacement: the pool shrinks. First draw 3/9, second draw (3-1)/(9-1) since one red is gone."}, {"question": "A bag has 5 red and 4 blue marbles (9 total). Two are drawn WITHOUT replacement. Which equation gives P(both red)?", "choices": ["(5/9)+((5-1)/(9-1))", "(5/9)*(5/9)", "5/9", "(5/9)*((5-1)/(9-1))"], "correctIndex": 3, "explanation": "Without replacement: the pool shrinks. First draw 5/9, second draw (5-1)/(9-1) since one red is gone."}, {"question": "A bag has 4 red and 6 blue marbles (10 total). Two are drawn WITHOUT replacement. Which equation gives P(both red)?", "choices": ["(4/10)*(4/10)", "(4/10)*((4-1)/(10-1))", "(4/10)+((4-1)/(10-1))", "4/10"], "correctIndex": 1, "explanation": "Without replacement: the pool shrinks. First draw 4/10, second draw (4-1)/(10-1) since one red is gone."}, {"question": "A fair 6-sided die is rolled. Which equation gives P(rolling a 2 or a 5)?", "choices": ["(1/6)*(1/6)", "1/6+1/6+1/6", "1/6", "1/6+1/6"], "correctIndex": 3, "explanation": "Mutually exclusive outcomes joined by OR -> add the individual probabilities."}, {"question": "A fair 6-sided die is rolled. Which equation gives P(rolling a 2 or a 5)?", "choices": ["(1/6)*(1/6)", "1/6+1/6", "1/6+1/6+1/6", "1/6"], "correctIndex": 1, "explanation": "Mutually exclusive outcomes joined by OR -> add the individual probabilities."}, {"question": "A fair 6-sided die is rolled. Which equation gives P(rolling a 2 or a 5)?", "choices": ["1/6+1/6+1/6", "(1/6)*(1/6)", "1/6", "1/6+1/6"], "correctIndex": 3, "explanation": "Mutually exclusive outcomes joined by OR -> add the individual probabilities."}, {"question": "Slips numbered 1 to 36 are in a bag. Which equation gives P(multiple of 2 or multiple of 3)?", "choices": ["(18/36)*(12/36)", "6/36", "(18/36)+(12/36)-(6/36)", "(18/36)+(12/36)"], "correctIndex": 2, "explanation": "Overlapping categories -> inclusion-exclusion: add both, then subtract the double-counted multiples of 6."}, {"question": "Slips numbered 1 to 40 are in a bag. Which equation gives P(multiple of 2 or multiple of 3)?", "choices": ["(20/40)+(13/40)-(6/40)", "6/40", "(20/40)*(13/40)", "(20/40)+(13/40)"], "correctIndex": 0, "explanation": "Overlapping categories -> inclusion-exclusion: add both, then subtract the double-counted multiples of 6."}, {"question": "Slips numbered 1 to 40 are in a bag. Which equation gives P(multiple of 2 or multiple of 3)?", "choices": ["(20/40)*(13/40)", "(20/40)+(13/40)-(6/40)", "6/40", "(20/40)+(13/40)"], "correctIndex": 1, "explanation": "Overlapping categories -> inclusion-exclusion: add both, then subtract the double-counted multiples of 6."}, {"question": "Slips numbered 1 to 48 are in a bag. Which equation gives P(multiple of 2 or multiple of 3)?", "choices": ["(24/48)+(16/48)-(8/48)", "8/48", "(24/48)*(16/48)", "(24/48)+(16/48)"], "correctIndex": 0, "explanation": "Overlapping categories -> inclusion-exclusion: add both, then subtract the double-counted multiples of 6."}, {"question": "A group has 15 juniors and 53 seniors. Given the 1st pick is a junior, which equation gives P(2nd pick is senior)?", "choices": ["52/(68-1)", "53/68", "53/(68-1)", "15/(68-1)"], "correctIndex": 2, "explanation": "The 1st pick removes one junior, shrinking the total pool to 68-1. Seniors are unaffected: 53/(68-1)."}, {"question": "A group has 9 juniors and 71 seniors. Given the 1st pick is a junior, which equation gives P(2nd pick is senior)?", "choices": ["9/(80-1)", "70/(80-1)", "71/(80-1)", "71/80"], "correctIndex": 2, "explanation": "The 1st pick removes one junior, shrinking the total pool to 80-1. Seniors are unaffected: 71/(80-1)."}, {"question": "A group has 8 juniors and 57 seniors. Given the 1st pick is a junior, which equation gives P(2nd pick is senior)?", "choices": ["57/(65-1)", "8/(65-1)", "56/(65-1)", "57/65"], "correctIndex": 0, "explanation": "The 1st pick removes one junior, shrinking the total pool to 65-1. Seniors are unaffected: 57/(65-1)."}, {"question": "A group has 13 juniors and 79 seniors. Given the 1st pick is a junior, which equation gives P(2nd pick is senior)?", "choices": ["13/(92-1)", "79/92", "79/(92-1)", "78/(92-1)"], "correctIndex": 2, "explanation": "The 1st pick removes one junior, shrinking the total pool to 92-1. Seniors are unaffected: 79/(92-1)."}, {"question": "A game costs \\$3 to play. You have a 1 in 6 chance to win \\$10 (otherwise nothing). Which equation gives the expected NET result of playing?", "choices": ["(10)*(1/6)-3", "(10-3)*(1/6)", "(10)*(1/6)", "(10)*(1/6)+3"], "correctIndex": 0, "explanation": "Expected payout is (10)(1/6); subtract the \\$3 cost to play for the net result."}, {"question": "A game costs \\$3 to play. You have a 1 in 5 chance to win \\$30 (otherwise nothing). Which equation gives the expected NET result of playing?", "choices": ["(30)*(1/5)-3", "(30-3)*(1/5)", "(30)*(1/5)+3", "(30)*(1/5)"], "correctIndex": 0, "explanation": "Expected payout is (30)(1/5); subtract the \\$3 cost to play for the net result."}, {"question": "A game costs \\$3 to play. You have a 1 in 6 chance to win \\$20 (otherwise nothing). Which equation gives the expected NET result of playing?", "choices": ["(20)*(1/6)+3", "(20-3)*(1/6)", "(20)*(1/6)", "(20)*(1/6)-3"], "correctIndex": 3, "explanation": "Expected payout is (20)(1/6); subtract the \\$3 cost to play for the net result."}, {"question": "A game costs \\$3 to play. You have a 1 in 4 chance to win \\$20 (otherwise nothing). Which equation gives the expected NET result of playing?", "choices": ["(20)*(1/4)-3", "(20-3)*(1/4)", "(20)*(1/4)", "(20)*(1/4)+3"], "correctIndex": 0, "explanation": "Expected payout is (20)(1/4); subtract the \\$3 cost to play for the net result."}]}, "prob_mixed": {"name": "Probability: Mixed Practice", "lesson": "**Mixed practice -- everything at once**\n\nNo more sorting by category first. These questions are pulled from every\nprobability concept you've covered -- diagnose the type AND solve it, just\nlike the real test. If you get stuck, think back through the tree: is this\nCounting, Expected Value, or a True Probability question? If the latter,\nwhich of the four sub-types, and which technique within it?\n", "flashcards": [{"front": "When a mixed question doesn't obviously fit a category, what's the first move?", "back": "Run through the tree: Counting Methods, Expected Value, or True Probability? If the latter, which of the four sub-types?"}], "bank": [{"question": "How many different ways can 3 of 9 distinctly-named people finish in 1st through 3rd place?", "choices": ["72", "504", "84", "362880"], "correctIndex": 1, "explanation": "Order matters here (1st place differs from 2nd place), so use permutations: 9P3 = 9!/(9-3)! = 504."}, {"question": "Slips numbered 1 to 32 are in a bag. What is the probability of drawing a multiple of 4 or a multiple of 6?", "choices": ["1/16", "13/32", "1/4", "11/32"], "correctIndex": 3, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 4: 8. Multiples of 6: 5. Multiples of both (LCM 12): 2, double-counted. (8 + 5 - 2) / 32 = 11/32 = 11/32."}, {"question": "A survey recorded 965 vehicles by category and color. Of the 455 total trucks, 159 are white. What is the probability that a randomly selected truck is white?", "choices": ["159/965", "91/193", "159/455", "455/159"], "correctIndex": 2, "explanation": "\"A randomly selected truck\" restricts the denominator to trucks only (455), not the grand total. P(white | trucks) = 159/455 = 159/455."}, {"question": "A bag has 8 items, 5 of which are defective. You draw 2, with replacement (each item put back before the next draw). What is the probability of getting at least one defective item?", "choices": ["9/64", "5/8", "55/64", "1"], "correctIndex": 2, "explanation": "\"At least one\" signals Complement. P(none) = 9/64, so P(at least one) = 1 - 9/64 = 55/64."}, {"question": "Slips numbered 1 to 26 are in a bag. What is the probability of drawing a multiple of 2 or a multiple of 5?", "choices": ["9/13", "1/13", "8/13", "1/2"], "correctIndex": 2, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 2: 13. Multiples of 5: 5. Multiples of both (LCM 10): 2, double-counted. (13 + 5 - 2) / 26 = 16/26 = 8/13."}, {"question": "Coin C is weighted so that the probability of landing faceup is 3 times the probability of landing facedown. A player wins $2.00 for faceup and $3.00 for facedown. What is the expected value of each toss, to the nearest cent?", "choices": ["$2.00", "$2.50", "$2.25", "$2.75"], "correctIndex": 2, "explanation": "Let P(facedown) = p. Then P(faceup) = 3p, and 3p + p = 1 gives p = 1/4. So P(faceup) = 3/4, P(facedown) = 1/4. E(X) = (2)(3/4) + (3)(1/4) = $2.25."}, {"question": "A jar has 21 red and 5 blue marbles. What is the probability of drawing a red marble?", "choices": ["11/13", "21/25", "21/26", "5/26"], "correctIndex": 2, "explanation": "Direct approach: favorable (21) over total (26) = 21/26. No flipping needed -- just count and divide."}, {"question": "A deck has 20 cards, 4 of which are face cards. What is the probability of drawing a face card?", "choices": ["4/19", "1/5", "1/4", "4/5"], "correctIndex": 1, "explanation": "Direct approach: favorable (4) over total (20) = 1/5. No flipping needed -- just count and divide."}, {"question": "Of the 26 students in a class, 8 are in debate club, 10 are in chess club, and 4 are in both. How many students are in NEITHER club?", "choices": ["8", "16", "12", "14"], "correctIndex": 2, "explanation": "At least one club: 8 + 10 - 4 = 14. Neither: 26 - 14 = 12."}, {"question": "A group is composed of 16 freshmen and 73 seniors. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a senior, what is the probability that the 2nd member selected is a senior?", "choices": ["2/11", "73/89", "72/89", "9/11"], "correctIndex": 3, "explanation": "The 1st pick removes one senior from the pool, so the total shrinks from 89 to 88. Remaining senior: 72. P(2nd is senior | 1st is senior) = 72/88 = 9/11."}, {"question": "A group is composed of 17 juniors and 86 seniors. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a junior, what is the probability that the 2nd member selected is a senior?", "choices": ["8/51", "94/51", "43/51", "86/103"], "correctIndex": 2, "explanation": "The 1st pick removes one junior from the pool, so the total shrinks from 103 to 102. Remaining senior: 86. P(2nd is senior | 1st is junior) = 86/102 = 43/51."}, {"question": "A point is chosen randomly within a 12-by-10 rectangular region. A 10-by-7 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["5/12", "17/22", "7/12", "5/6"], "correctIndex": 2, "explanation": "Area-based: favorable area (10x7=70) over total area (12x10=120) = 7/12."}, {"question": "A dart is thrown randomly at a square target with a circle inscribed inside it, touching all four sides. What is the probability the dart lands inside the circle?", "choices": ["1/2", "pi/2", "pi/4", "4/pi"], "correctIndex": 2, "explanation": "If the square has side s, the inscribed circle has diameter s (radius s/2). Circle area = pi(s/2)^2 = pi*s^2/4. Square area = s^2. Ratio = pi/4 -- the side length s cancels completely."}, {"question": "A jar has 12 red and 4 blue marbles. What is the probability of drawing a red marble?", "choices": ["13/16", "3/4", "4/5", "1/4"], "correctIndex": 1, "explanation": "Direct approach: favorable (12) over total (16) = 3/4. No flipping needed -- just count and divide."}, {"question": "If the expected value of a raffle ticket is -$0.50, what does this mean?", "choices": ["The ticket costs $0.50 more than it's worth to print", "Every single ticket loses exactly $0.50", "Half of all tickets lose $0.50", "On average, over many tickets played, a player loses about $0.50 per ticket"], "correctIndex": 3, "explanation": "Expected value is a long-run average across many trials, not a guaranteed result on any one ticket. Individual tickets either win or lose their full amount -- the -$0.50 only shows up as an average over many plays."}, {"question": "A point is chosen randomly within a 7-by-6 rectangular region. A 2-by-4 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["4/21", "17/21", "6/13", "2/7"], "correctIndex": 0, "explanation": "Area-based: favorable area (2x4=8) over total area (7x6=42) = 4/21."}, {"question": "A bag has 14 items, 5 of which are defective. You draw 3, without replacement. What is the probability of getting at least one defective item?", "choices": ["10/13", "1", "5/14", "3/13"], "correctIndex": 0, "explanation": "\"At least one\" signals Complement. P(none) = 3/13, so P(at least one) = 1 - 3/13 = 10/13."}, {"question": "How many different 2-person committees can be formed from a group of 8 people?", "choices": ["28", "29", "56 he students in a class, 75% join student council. Of those who join student council, 45% also do community service. What is the probability that a student also do community service, given that they join student council?", "choices": ["75%", "45%", "34%", "55%"], "correctIndex": 1, "explanation": "\"Given that they join student council\" restricts you to just that group -- the 45% is already the conditional probability itself, directly stated. No further math needed."}, {"question": "A point is chosen randomly within a circular region. A square is inscribed in the circle (all four corners touch the circle). What is the probability the point lands inside the square?", "choices": ["pi/4", "pi/2", "1/4", "2/pi"], "correctIndex": 3, "explanation": "If the circle has radius r, the inscribed square's diagonal equals the circle's diameter (2r), so the square's side is r*sqrt(2) and its area is 2r^2. Circle area = pi*r^2. Ratio = 2r^2/(pi*r^2) = 2/pi."}, {"question": "A point is chosen randomly within a 8-by-4 rectangular region. A 7-by-2 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["7/8", "7/16", "3/4", "9/16"], "correctIndex": 1, "explanation": "Area-based: favorable area (7x2=14) over total area (8x4=32) = 7/16."}, {"question": "A spinner lands on 15 with probability 4/10, on 35 with probability 5/10, and on 20 with probability 1/10. What is the expected value of one spin?", "choices": ["27", "70/3", "51/2", "35"], "correctIndex": 2, "explanation": "E(X) = 15(4/10) + 35(5/10) + 20(1/10) = 60/10 + 175/10 + 20/10 = 51/2."}, {"question": "A game costs $3 to play. You have a 1 in 3 chance to win $12 (otherwise you win nothing). What is the expected net result of playing (accounting for the cost)?", "choices": ["$1", "$7", "$9", "$4"], "correctIndex": 0, "explanation": "Expected payout = (12)(1/3) = 4. Subtract the $3 cost to play: 4 - 3 = $1."}, {"question": "Coin C is weighted so that the probability of landing faceup is 4 times the probability of landing facedown. A player wins $2.00 for faceup and $1.00 for facedown. What is the expected value of each toss, to the nearest cent?", "choices": ["$1.20", "$1.80", "$1.50", "$2.00"], "correctIndex": 1, "explanation": "Let P(facedown) = p. Then P(faceup) = 4p, and 4p + p = 1 gives p = 1/5. So P(faceup) = 4/5, P(facedown) = 1/5. E(X) = (2)(4/5) + (1)(1/5) = $1.80."}, {"question": "A group is composed of 17 juniors and 77 managers. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a manager, what is the probability that the 2nd member selected is a junior?", "choices": ["17/93", "17/94", "110/93", "76/93"], "correctIndex": 0, "explanation": "The 1st pick removes one manager from the pool, so the total shrinks from 94 to 93. Remaining junior: 17. P(2nd is junior | 1st is manager) = 17/93 = 17/93."}]}};

let audioCtx = null;
let soundOn = true;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, startOffset, dur, type, vol) {
  if (!soundOn) return;
  try {
    const c = ctx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, c.currentTime + startOffset);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + startOffset + dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(c.currentTime + startOffset); osc.stop(c.currentTime + startOffset + dur);
  } catch (e) { /* ignore audio errors */ }
}
function sweep(freqStart, freqEnd, startOffset, dur, type, vol) {
  if (!soundOn) return;
  try {
    const c = ctx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, c.currentTime + startOffset);
    osc.frequency.linearRampToValueAtTime(freqEnd, c.currentTime + startOffset + dur);
    gain.gain.setValueAtTime(vol, c.currentTime + startOffset);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + startOffset + dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(c.currentTime + startOffset); osc.stop(c.currentTime + startOffset + dur);
  } catch (e) { /* ignore audio errors */ }
}

  document.body.style.background = theme.swatch;
  const decorEl = document.getElementById("bg-decor");
  if (!decorEl) return;

  if (theme.decor === "stars") {

      s.style.left = Math.random() * 100 + "vw";
      s.style.top = Math.random() * 100 + "vh";

      s.style.width = s.style.height = (1 + Math.random() * 1.6) + "px";

      d.style.left = Math.random() * 100 + "vw";

    const colors = ["rgba(111,231,183,0.35)", "rgba(95,199,214,0.30)", "rgba(201,166,232,0.25)"];
    for (let i = 0; i < 3; i++) {

      a.className = "bg-aurora";

      decorEl.appendChild(a);
    }
  }
}

            <path d="M ${cx1-4} ${cy-5} Q ${cx1} ${cy-8} ${cx1+4} ${cy-5}" stroke="#16302A" stroke-width="1.6" fill="none" />
            <path d="M ${cx2-4} ${cy-5} Q ${cx2} ${cy-8} ${cx2+4} ${cy-5}" stroke="#16302A" stroke-width="1.6" fill="none" />`;
  }
  if (mood === "celebrate") {
    return `<path d="M ${cx1-4} ${cy} L ${cx1} ${cy-4} L ${cx1+4} ${cy}" stroke="#16302A" stroke-width="2.4" fill="none" stroke-linecap="round" />
            <path d="M ${cx2-4} ${cy} L ${cx2} ${cy-4} L ${cx2+4} ${cy}" stroke="#16302A" stroke-width="2.4" fill="none" stroke-linecap="round" />`;

const AVATAR_RENDERERS = { fox: avatarSvgFox, owl: avatarSvgOwl, robot: avatarSvgRobot, dragon: avatarSvgDragon };

           avatar: "fox", avatarName: "", soundPack: "chalkboard", background: "chalkboard" };

  meta: null,

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function progressDocId(conceptId) { return state.user + "_" + conceptId; }
function metaDocId() { return state.user + "_meta"; }

async function loadProgress() {
  state.progress = {};
  state.meta = defaultMeta();
  let metaExisted = false;
  if (db) {
    for (const cid of CONCEPT_ORDER) {
      try {
        const snap = await db.collection(PROGRESS_COLLECTION).doc(progressDocId(cid)).get();
        if (snap.exists) state.progress[cid] = snap.data();
      } catch (e) { console.error("load progress failed", cid, e); }
    }
    try {
      const msnap = await db.collection(META_COLLECTION).doc(metaDocId()).get();
      if (msnap.exists) { state.meta = { ...defaultMeta(), ...msnap.data() }; metaExisted = true; }
    } catch (e) { console.error("load meta failed", e); }
  }
  state.isFirstTimeSetup = !metaExisted;
}

async function saveMeta() {
  if (db) {
    try { await db.collection(META_COLLECTION).doc(metaDocId()).set(state.meta, {merge: true}); }
    catch (e) { console.error("save meta failed", e); }
  }
}
async function savePassDate(conceptId) {
  const existing = state.progress[conceptId] || { passDates: [], attempts: 0 };
  const passDates = Array.from(new Set([...(existing.passDates || []), todayStr()]));
  const attempts = (existing.attempts || 0) + 1;
  const data = { user: state.user, conceptId, passDates, attempts, lastAttemptAt: Date.now() };
  state.progress[conceptId] = data;
  if (db) {
    try { await db.collection(PROGRESS_COLLECTION).doc(progressDocId(conceptId)).set(data, {merge: true}); }
    catch (e) { console.error("save failed", e); }
  }
}
async function saveAttemptOnly(conceptId) {
  const existing = state.progress[conceptId] || { passDates: [], attempts: 0 };
  const attempts = (existing.attempts || 0) + 1;
  const data = { ...existing, user: state.user, conceptId, attempts, lastAttemptAt: Date.now() };
  state.progress[conceptId] = data;
  if (db) {
    try { await db.collection(PROGRESS_COLLECTION).doc(progressDocId(conceptId)).set(data, {merge: true}); }
    catch (e) { console.error("save failed", e); }
  }
}
function recordQuizStreak(perfect) {
  if (perfect) {
    state.meta.currentStreak = (state.meta.currentStreak || 0) + 1;
    if (state.meta.currentStreak > (state.meta.bestStreak || 0)) state.meta.bestStreak = state.meta.currentStreak;
  } else {
    state.meta.currentStreak = 0;
  }
}
function isMastered(conceptId) {
  const p = state.progress[conceptId];
  return !!(p && p.passDates && p.passDates.length >= 2);
}
function hasOnePass(conceptId) {
  const p = state.progress[conceptId];
  return !!(p && p.passDates && p.passDates.length === 1);
}
function masteredCount() { return CONCEPT_ORDER.filter(isMastered).length; }
function bossUnlocked() { return masteredCount() >= BOSS_UNLOCK_COUNT; }
function companionName() {
  const d = AVATAR_DEFS[state.meta.avatar] || AVATAR_DEFS.fox;
  return (state.meta.avatarName && state.meta.avatarName.trim()) || d.defaultName;
}

function shuffledIndices(n) {
  const arr = Array.from({length: n}, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function buildQuizQueue(conceptId) {
  const bank = CONTENT[conceptId].bank;
  const idx = shuffledIndices(bank.length);
  const take = idx.slice(0, Math.min(10, bank.length));
  return take.map(i => bank[i]);
}
function buildBossQueue() {
  const masteredIds = CONCEPT_ORDER.filter(isMastered);
  let pool = [];
  masteredIds.forEach(cid => { pool = pool.concat(CONTENT[cid].bank); });
  const idx = shuffledIndices(pool.length);
  const take = idx.slice(0, Math.min(12, pool.length));
  return take.map(i => pool[i]);
}

      <div class="status-pill boss">${unlocked ? (state.meta.bossRoundPlays ? "Best: " + state.meta.bossRoundBestScore + "/12" : "Ready") : "Locked"}</div>
    </div>
  </div>`;
  app.innerHTML = header() +
    `<div class="stats-bar">
       <div class="stat-chip"><div class="num">${mCount} / ${total}</div><div class="lbl">Concepts mastered</div></div>
       <div class="stat-chip"><div class="num">${state.meta.bestStreak || 0}</div><div class="lbl">Longest perfect-quiz streak</div></div>
       <div class="stat-chip"><div class="num">${state.meta.currentStreak || 0}</div><div class="lbl">Current streak</div></div>
     </div>` +
    `<div class="map">${nodes}${bossNode}</div>`;
}

window.openConcept = function(cid) {
  state.activeConcept = cid;
  state.flashIdx = 0; state.flashFlipped = false;
  state.screen = "lesson";
  render();
};
window.openBossRound = function() {
  cancelPendingCelebration();
  state.activeConcept = "__boss__";
  state.quizQueue = buildBossQueue();
  state.quizIdx = 0; state.quizScore = 0; state.quizAnswered = false;
  state.screen = "quiz";
  setAvatar("neutral");
  render();
};

function stageTrack(active) {
  const stages = ["Lesson", "Flashcards", "Quiz", "Result"];
  const activeIdx = stages.indexOf(active);
  return `<div class="stage-track">${stages.map((s,i) => `
    <div class="seg ${i===activeIdx ? "active" : (i<activeIdx ? "done" : "")}">
      <div class="bar"></div><div class="label">${s}</div>
    </div>`).join("")}</div>`;
}

// ============================================================
// DIAGNOSIS TREE -- inline theme-aware SVG for the prob_diagnosis lesson.
// Same bottom-up layout algorithm used to build the reference PPTX version,
// ported to plain JS/SVG so it recolors automatically with the app's theme.
// ============================================================
const DIAGNOSIS_TREE_DATA = {
  label: ["Probability-related", "question"], leaf: false,
  children: [
    { label: ["Counting Methods"], sub: '"how many ways?"', leaf: false, children: [
      { label: ["Counting Principle"], sub: "multiply each step", leaf: true },
      { label: ["Permutations"], sub: "nPr, order matters", leaf: true },
      { label: ["Combinations"], sub: "nCr, order doesn't matter", leaf: true },
    ]},
    { label: ["True Probability"], sub: "wants a probability", leaf: false, children: [
      { label: ["Simple/", "Single-Event"], sub: "one draw", leaf: false, children: [
        { label: ["Direct"], sub: "favorable/total", leaf: true },
        { label: ["Complement"], sub: "1 - P(opp.)", leaf: true },
      ]},
      { label: ["Compound"], sub: "multiple events", leaf: false, children: [
        { label: ["Compound AND"], sub: "multiply", leaf: false, children: [
          { label: ["With", "Replacement"], sub: "pool resets", leaf: true },
          { label: ["Without", "Replacement"], sub: "pool shrinks", leaf: true },
        ]},
        { label: ["Compound OR"], sub: "add (- overlap)", leaf: true },
      ]},
      { label: ["Conditional"], sub: '"given that..."', leaf: false, children: [
        { label: ["Given Directly"], sub: "read the stated %", leaf: true },
        { label: ["Recompute", "the Pool"], sub: "adjust counts", leaf: true },
      ]},
      { label: ["Geometric"], sub: "area/length-based", leaf: false, children: [
        { label: ["Length-based", "(1-D)"], sub: "fav/total length", leaf: true },
        { label: ["Area-based", "(2-D)"], sub: "fav/total area", leaf: true },
      ]},
    ]},
    { label: ["Expected Value"], sub: '"expected value", avg', leaf: false, children: [
      { label: ["Two-Outcome", "Game"], sub: "E=(payout)(p)-cost", leaf: true },
      { label: ["Multiple", "Outcomes"], sub: "E=sum(v x p)", leaf: true },
    ]},
  ],
};
const TREE_LEAF_W = 130, TREE_H_GAP = 14, TREE_V_GAP = 34, TREE_BOX_H = 58, TREE_TOP_MARGIN = 14;

function treeComputeWidth(node) {
  if (!node.children || node.children.length === 0) {
    node.width = TREE_LEAF_W;
  } else {
    node.children.forEach(treeComputeWidth);
    node.width = node.children.reduce((s, c) => s + c.width, 0) + TREE_H_GAP * (node.children.length - 1);
  }
  return node.width;
}
function treeAssignPositions(node, xStart, depth) {
  node.x = xStart;
  node.centerX = xStart + node.width / 2;
  node.y = TREE_TOP_MARGIN + depth * (TREE_BOX_H + TREE_V_GAP);
  if (node.children) {
    let cx = xStart;
    node.children.forEach(child => {
      treeAssignPositions(child, cx, depth + 1);
      cx += child.width + TREE_H_GAP;
    });
  }
}

function buildDiagnosisTreeSVG() {
  treeComputeWidth(DIAGNOSIS_TREE_DATA);
  treeAssignPositions(DIAGNOSIS_TREE_DATA, 0, 0);
  const totalW = DIAGNOSIS_TREE_DATA.width;
  let maxY = 0;
  let svgParts = [];

  function drawNode(node) {
    const boxW = node.children ? Math.min(Math.max(node.width * 0.55, 110), 190) : TREE_LEAF_W;
    const x = node.centerX - boxW / 2;
    const y = node.y;
    maxY = Math.max(maxY, y + TREE_BOX_H);
    const fill = node.leaf ? "var(--accent)" : "var(--surface-hi)";
    const textColor = node.leaf ? "var(--bg-deep)" : "var(--chalk)";
    const strokeColor = node.leaf ? "var(--accent-dim)" : "var(--rule)";
    svgParts.push(`<rect x="${x}" y="${y}" width="${boxW}" height="${TREE_BOX_H}" rx="6" fill="${fill}" stroke="${strokeColor}" stroke-width="0.75" />`);
    const titleLines = node.label;
    const hasSub = !!node.sub;
    const titleBlockH = hasSub ? TREE_BOX_H * 0.58 : TREE_BOX_H;
    const lineH = 12;
    const titleStartY = y + (titleBlockH - (titleLines.length - 1) * lineH) / 2 + 2;
    titleLines.forEach((line, i) => {
      svgParts.push(`<text x="${node.centerX}" y="${titleStartY + i * lineH}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="${textColor}">${escapeHtml(line)}</text>`);
    });
    if (hasSub) {
      svgParts.push(`<text x="${node.centerX}" y="${y + TREE_BOX_H * 0.8}" text-anchor="middle" dominant-baseline="central" font-size="7.5" font-style="italic" fill="${textColor}">${escapeHtml(node.sub)}</text>`);
    }
    if (node.children) {
      const parentBottom = y + TREE_BOX_H;
      const busY = parentBottom + TREE_V_GAP / 2;
      svgParts.push(`<line x1="${node.centerX}" y1="${parentBottom}" x2="${node.centerX}" y2="${busY}" stroke="var(--chalk-dim)" stroke-width="1" />`);
      const firstX = node.children[0].centerX, lastX = node.children[node.children.length - 1].centerX;
      svgParts.push(`<line x1="${firstX}" y1="${busY}" x2="${lastX}" y2="${busY}" stroke="var(--chalk-dim)" stroke-width="1" />`);
      node.children.forEach(child => {
        svgParts.push(`<line x1="${child.centerX}" y1="${busY}" x2="${child.centerX}" y2="${child.y}" stroke="var(--chalk-dim)" stroke-width="1" marker-end="url(#tree-arrow)" />`);
        drawNode(child);
      });
    }
  }
  drawNode(DIAGNOSIS_TREE_DATA);

  const viewH = maxY + 16;
  return `<div class="diagnosis-tree-wrap">
    <svg width="${totalW}" height="${viewH}" viewBox="0 0 ${totalW} ${viewH}">
      <defs><marker id="tree-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="var(--chalk-dim)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
      ${svgParts.join("\n")}
    </svg>
  </div>
  <div class="tree-scroll-hint">Scroll sideways to see the whole tree \u2192</div>`;
}

function renderLesson() {
  const c = CONTENT[state.activeConcept];
  const isDiagnosis = state.activeConcept === "prob_diagnosis";
  app.innerHTML = header(c.name) +
    `<span class="back-link" onclick="backToMap()">&larr; Mastery map</span>` +
    stageTrack("Lesson") +
    `<div class="lesson-body">${formatText(c.lesson)}</div>` +
    (isDiagnosis ? buildDiagnosisTreeSVG() : "") +
    `<button class="next-btn" onclick="goFlash()">On to flashcards &rarr;</button>`;
}
window.backToMap = function() { cancelPendingCelebration(); state.screen = "map"; applyBackground(state.meta.background); render(); };
window.goFlash = function() { state.screen = "flash"; state.flashIdx = 0; state.flashFlipped = false; render(); };

function renderFlash() {
  const c = CONTENT[state.activeConcept];
  const card = c.flashcards[state.flashIdx];
  const isLast = state.flashIdx === c.flashcards.length - 1;
  app.innerHTML = header(c.name) +
    `<span class="back-link" onclick="backToMap()">&larr; Mastery map</span>` +
    stageTrack("Flashcards") +
    `<div class="flashcard" onclick="flipCard()">
       ${state.flashFlipped ? formatText(card.back) : formatText(card.front)}
       <span class="hint">${state.flashFlipped ? "" : "(tap to reveal)"}</span>
     </div>` +
    `<div class="flash-nav">
       <span class="count">${state.flashIdx+1} / ${c.flashcards.length}</span>
       <button class="next-btn ${isLast ? "" : "secondary"}" onclick="nextFlash()">${isLast ? "Start the quiz &rarr;" : "Next card &rarr;"}</button>
     </div>`;
}
window.flipCard = function() { state.flashFlipped = !state.flashFlipped; render(); };
window.nextFlash = function() {
  const c = CONTENT[state.activeConcept];
  if (state.flashIdx < c.flashcards.length - 1) {
    state.flashIdx++; state.flashFlipped = false; render();
  } else {
    startQuiz();
  }
};
function startQuiz() {
  cancelPendingCelebration();
  state.quizQueue = buildQuizQueue(state.activeConcept);
  state.quizIdx = 0; state.quizScore = 0; state.quizAnswered = false;
  state.screen = "quiz";
  setAvatar("neutral");
  render();
}
window.startQuiz = startQuiz;

function renderQuiz() {
  const isBoss = state.activeConcept === "__boss__";
  const c = isBoss ? {name: "Boss Round"} : CONTENT[state.activeConcept];
  const q = state.quizQueue[state.quizIdx];
  app.innerHTML = header(c.name) +
    (isBoss ? "" : stageTrack("Quiz")) +
    `<div class="quiz-progress">Question ${state.quizIdx+1} of ${state.quizQueue.length} &middot; ${state.quizScore} correct so far</div>` +
    `<div class="quiz-q">${formatText(q.question)}</div>` +
    `<div id="choices" class="${q.choices.length > 4 ? "choice-grid" : ""}">${q.choices.map((ch,i) => `<button class="choice" onclick="answer(${i})">${formatText(ch)}</button>`).join("")}</div>` +
    `<div id="explanation-slot"></div>`;
}

window.answer = function(i) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;
  const q = state.quizQueue[state.quizIdx];
  const buttons = document.querySelectorAll("#choices .choice");
  const correct = i === q.correctIndex;
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.correctIndex) b.classList.add("correct");
    else if (idx === i) b.classList.add("incorrect");
  });
  if (correct) { state.quizScore++; soundCorrect(); setAvatar("happy"); }
  else { soundIncorrect(); setAvatar("sad"); }
  document.getElementById("explanation-slot").innerHTML =
    `<div class="explanation">${formatText(q.explanation)}</div>
     <button class="next-btn" onclick="nextQuizQ()">${state.quizIdx === state.quizQueue.length - 1 ? "See results \u2192" : "Next question \u2192"}</button>`;
};

window.nextQuizQ = async function() {
  if (state.quizIdx < state.quizQueue.length - 1) {
    state.quizIdx++; state.quizAnswered = false; render();
    setAvatar("neutral");
  } else {
    const isBoss = state.activeConcept === "__boss__";
    const perfect = state.quizScore === state.quizQueue.length;
    if (isBoss) {
      state.meta.bossRoundPlays = (state.meta.bossRoundPlays || 0) + 1;
      if (state.quizScore > (state.meta.bossRoundBestScore || 0)) state.meta.bossRoundBestScore = state.quizScore;
      await saveMeta();
    } else {
      const wasMasteredBefore = isMastered(state.activeConcept);
      recordQuizStreak(perfect);
      await saveMeta();
      if (perfect) await savePassDate(state.activeConcept);
      else await saveAttemptOnly(state.activeConcept);
      state.justMastered = !wasMasteredBefore && isMastered(state.activeConcept);
    }
    state.winMsg = pick(WIN_MESSAGES);
    state.failMsg = pick(FAIL_MESSAGES);
    state.masteredMsg = pick(MASTERED_MESSAGES);
    state.screen = "result";
    render();
  }
};

function animateScoreCount(finalScore, total) {
  const el = document.getElementById("score-num");
  if (!el) return;
  if (finalScore === 0) { el.textContent = "0/" + total; return; }
  let current = 0;
  const timer = setInterval(() => {
    current++;
    el.textContent = current + "/" + total;
    if (current >= finalScore) clearInterval(timer);
  }, 90);
}

function renderResult() {
  const isBoss = state.activeConcept === "__boss__";
  const perfect = state.quizScore === state.quizQueue.length;

  if (isBoss) {
    const isNewBest = state.quizScore >= (state.meta.bossRoundBestScore || 0);
    app.innerHTML = header("Boss Round") +
      `<div class="result-box">
         <div class="result-score" id="score-num">0/${state.quizQueue.length}</div>
         <span class="result-msg boss">${isNewBest ? "New Boss Round best!" : "Nice run -- try to beat your best next time."} Mixed questions from everything you've mastered so far.</span>
         <div>
           <button class="next-btn" onclick="openBossRound()">Run it again</button>
           <button class="next-btn secondary" onclick="backToMap()">Back to the map</button>
         </div>
       </div>`;
    animateScoreCount(state.quizScore, state.quizQueue.length);
    setAvatar(isNewBest ? "celebrate" : "neutral");
    return;
  }

  const c = CONTENT[state.activeConcept];
  let msg;
  const allDone = state.justMastered && masteredCount() === CONCEPT_ORDER.length;
  if (allDone) { msg = `<span class="result-msg win">${state.masteredMsg} And that's every concept -- all seven, mastered.</span>`; }
  else if (perfect && state.justMastered) { msg = `<span class="result-msg win">${state.masteredMsg}</span>`; }
  else if (perfect) msg = `<span class="result-msg win">${state.winMsg}</span>`;
  else msg = `<span class="result-msg">${state.failMsg}</span>`;

  app.innerHTML = header(c.name) +
    stageTrack("Result") +
    `<div class="result-box">
       <div class="result-score" id="score-num">0/${state.quizQueue.length}</div>
       ${msg}
       <div>
         ${perfect ? "" : `<button class="next-btn" onclick="startQuiz()">Try 10 new questions</button>`}
         <button class="next-btn secondary" onclick="backToMap()">Back to the mastery map</button>
       </div>
     </div>`;
  animateScoreCount(state.quizScore, state.quizQueue.length);

  if (state.justMastered) {
    setAvatar("celebrate");
    soundMastered();
    burstConfetti();
    if (allDone) {
      setTimeout(() => burstConfetti(), 500); // extra burst for the grand finale
      scheduleCelebration("finalMastery", 1000);
    } else {
      scheduleCelebration("mastery", 900);
    }
  } else if (perfect) {
    setAvatar("happy");
    scheduleCelebration("tenStraight", 500);
  } else {
    setAvatar("sad");
    const missedCount = state.quizQueue.length - state.quizScore;
    scheduleCelebration(missedCount >= 2 ? "missedMultiple" : "fellShort", 500);
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
// Converts caret/underscore math shorthand into real superscript/subscript
// tags, e.g. "a_n = a_1 * r^(n-1)" -> a<sub>n</sub> = a<sub>1</sub> * r<sup>n-1</sup>
// and "7^20" -> 7<sup>20</sup>. The base character/number and its sup/sub are
// wrapped in a non-breaking span together -- otherwise a line wrap can land
// between "a" and its subscript, visually orphaning the number on its own
// line. Always escape HTML first, then call this.
function formatMath(escaped) {
  return escaped
    .replace(/([A-Za-z0-9]+)\^\(([^)]+)\)/g, '<span style="white-space:nowrap">$1<sup>$2</sup></span>')
    .replace(/([A-Za-z0-9]+)\^(-?[A-Za-z0-9]+)/g, '<span style="white-space:nowrap">$1<sup>$2</sup></span>')
    .replace(/([A-Za-z0-9]+)_\(([^)]+)\)/g, '<span style="white-space:nowrap">$1<sub>$2</sub></span>')
    .replace(/([A-Za-z0-9]+)_(-?[A-Za-z0-9]+)/g, '<span style="white-space:nowrap">$1<sub>$2</sub></span>');
}
// Full pipeline for user-facing math/lesson text: escape, then markdown bold,
// then sup/sub. Use this (not escapeHtml alone) for anything that may contain
// exponents, subscripts, or **bold** markup.
function formatText(s) {
  return formatMath(escapeHtml(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"));
}

applyBackground("chalkboard");
render();
window.__debug = { state, CONTENT, isMastered, hasOnePass, masteredCount, bossUnlocked, AVATAR_DEFS, SOUND_PACKS, THEMES, applyBackground, CELEBRATION_VIDEOS, showCelebrationVideo };
</script>
