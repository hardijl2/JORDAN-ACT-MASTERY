<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept by Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #16302A;
    --bg-deep: #102019;
    --surface: #1F4238;
    --surface-hi: #275248;
    --chalk: #F2EDDD;
    --chalk-dim: #B9C4B8;
    --accent: #D6A94C;
    --accent-dim: #8C7031;
    --good: #7FB78B;
    --bad: #DE8367;
    --boss: #B968C7;
    --speed: #D97742;
    --rule: rgba(242,237,221,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top left, var(--bg) 0%, var(--bg-deep) 100%);
    color: var(--chalk);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1, h2, h3, .serif { font-family: 'Fraunces', serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 100px; position: relative; }
  header.top {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid var(--rule); padding-bottom: 16px; margin-bottom: 22px; flex-wrap: wrap; gap: 10px;
  }
  header.top h1 { font-size: 1.6rem; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  header.top .tagline { color: var(--chalk-dim); font-size: 0.85rem; margin-top: 4px; }
  header.top .right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .user-badge, .link-btn { font-size: 0.85rem; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; background: none; border: none; font-family: inherit; padding: 0; }
  .sound-toggle { background: none; border: 1px solid var(--rule); border-radius: 20px; color: var(--chalk-dim); font-size: 0.8rem; padding: 4px 10px; cursor: pointer; font-family: inherit; }
  .sound-toggle:hover { color: var(--chalk); }

  .gate { max-width: 380px; margin: 15vh auto; text-align: center; }
  .gate h2 { font-size: 1.8rem; margin-bottom: 4px; }
  .gate p { color: var(--chalk-dim); margin-top: 0; }
  .gate-btns { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
  .gate-btns button {
    flex: 1; padding: 14px; font-family: 'Fraunces', serif; font-size: 1.05rem;
    background: var(--surface); color: var(--chalk); border: 1px solid var(--rule);
    border-radius: 6px; cursor: pointer;
  }
  .gate-btns button:hover { background: var(--surface-hi); }
  input.name-input {
    width: 100%; padding: 12px; font-size: 1rem; border-radius: 6px;
    border: 1px solid var(--rule); background: var(--surface); color: var(--chalk);
    margin-bottom: 10px; font-family: inherit;
  }

  .stats-bar { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-chip {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
    padding: 10px 16px; flex: 1; min-width: 140px;
  }
  .stat-chip .num { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .stat-chip .lbl { font-size: 0.72rem; color: var(--chalk-dim); }

  .map { position: relative; padding-left: 44px; }
  .map::before {
    content: ""; position: absolute; left: 19px; top: 22px; bottom: 22px; width: 2px;
    background: var(--rule);
  }
  .map-node { position: relative; margin-bottom: 16px; }
  .map-node .dot {
    position: absolute; left: -44px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--rule);
    background: var(--bg-deep); display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
  }
  .map-node.mastered .dot { background: var(--good); border-color: var(--good); color: var(--bg-deep); font-weight: 700; }
  .map-node.onepass .dot { background: var(--accent); border-color: var(--accent); color: var(--bg-deep); }
  .map-node.progress .dot { border-color: var(--accent-dim); }
  .map-node.boss .dot { background: var(--boss); border-color: var(--boss); }
  .map-node.speed .dot { background: var(--speed); border-color: var(--speed); }
  .map-node.locked .dot { opacity: 0.4; }
  .concept-tile {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
    padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between;
    align-items: center; gap: 14px; transition: background 0.15s, transform 0.1s;
  }
  .concept-tile:hover { background: var(--surface-hi); transform: translateX(2px); }
  .concept-tile.locked { cursor: default; opacity: 0.55; }
  .concept-tile.locked:hover { background: var(--surface); transform: none; }
  .concept-tile.boss-tile { border-color: var(--boss); }
  .concept-tile.speed-tile { border-color: var(--speed); }
  .concept-tile .name { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; }
  .concept-tile .sub { font-size: 0.75rem; color: var(--chalk-dim); margin-top: 2px; }
  .status-pill {
    font-size: 0.72rem; padding: 4px 10px; border-radius: 20px; white-space: nowrap;
    border: 1px solid var(--rule); color: var(--chalk-dim);
  }
  .status-pill.mastered { color: var(--bg-deep); background: var(--good); border-color: var(--good); font-weight: 600; }
  .status-pill.onepass { color: var(--bg-deep); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .status-pill.progress { color: var(--accent); border-color: var(--accent-dim); }
  .status-pill.boss { color: var(--bg-deep); background: var(--boss); border-color: var(--boss); font-weight: 600; }
  .status-pill.speed { color: var(--bg-deep); background: var(--speed); border-color: var(--speed); font-weight: 600; }

  .stage-track { display: flex; gap: 4px; margin-bottom: 26px; }
  .stage-track .seg { flex: 1; }
  .stage-track .seg .bar { height: 3px; background: var(--rule); border-radius: 2px; margin-bottom: 6px; }
  .stage-track .seg.active .bar, .stage-track .seg.done .bar { background: var(--accent); }
  .stage-track .seg .label { font-size: 0.7rem; color: var(--chalk-dim); }
  .stage-track .seg.active .label { color: var(--accent); font-weight: 600; }

  .back-link { color: var(--chalk-dim); font-size: 0.85rem; cursor: pointer; margin-bottom: 18px; display: inline-block; }
  .back-link:hover { color: var(--chalk); }

  .lesson-body { font-family: 'Fraunces', serif; font-size: 1.05rem; line-height: 1.7; white-space: pre-wrap; }
  .lesson-body strong { color: var(--accent); }
  sup, sub { font-size: 0.7em; }
  .diagnosis-tree-wrap {
    overflow-x: auto; margin: 20px 0 6px; border: 1px solid var(--rule); border-radius: 8px;
    padding: 10px; background: var(--surface);
  }
  .diagnosis-tree-wrap svg { display: block; }
  .tree-scroll-hint { font-size: 0.75rem; color: var(--chalk-dim); text-align: center; margin-bottom: 20px; }
  .next-btn {
    margin-top: 26px; padding: 12px 22px; background: var(--accent); color: var(--bg-deep);
    border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.95rem;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .next-btn:hover { filter: brightness(1.08); }
  .next-btn.secondary { background: transparent; color: var(--chalk); border: 1px solid var(--rule); }

  .flashcard {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    padding: 40px 24px; min-height: 140px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; font-family: 'Fraunces', serif; font-size: 1.15rem; cursor: pointer;
    margin-bottom: 14px; line-height: 1.5; white-space: pre-line;
  }
  .flashcard .hint { display: block; font-size: 0.75rem; color: var(--chalk-dim); margin-top: 14px; font-family: 'IBM Plex Sans', sans-serif; }
  .flash-nav { display: flex; justify-content: space-between; align-items: center; }
  .flash-nav .count { color: var(--chalk-dim); font-size: 0.85rem; }

  .quiz-q { font-family: 'Fraunces', serif; font-size: 1.15rem; margin-bottom: 18px; line-height: 1.5; white-space: pre-line; }
  .choice {
    display: block; width: 100%; text-align: left; padding: 14px 16px; margin-bottom: 10px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; color: var(--chalk);
    cursor: pointer; font-size: 0.98rem; font-family: 'IBM Plex Sans', sans-serif;
  }
  .choice:hover:not(:disabled) { background: var(--surface-hi); }
  .choice:disabled { cursor: default; }
  .choice.correct { background: rgba(127,183,139,0.25); border-color: var(--good); }
  .choice.incorrect { background: rgba(222,131,103,0.25); border-color: var(--bad); }
  /* Sort-mode concepts (e.g. Probability: Diagnose the Type) use a fixed
     2-column grid of category "bins" instead of a vertical answer list --
     same spatial position every question, like a real sorting board. */
  #choices.choice-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  #choices.choice-grid .choice { margin-bottom: 0; font-size: 0.88rem; text-align: center; }
  .explanation {
    margin-top: 16px; padding: 14px 16px; background: rgba(0,0,0,0.18); border-radius: 8px;
    font-size: 0.92rem; color: var(--chalk-dim); line-height: 1.6;
  }
  .quiz-progress { color: var(--chalk-dim); font-size: 0.85rem; margin-bottom: 10px; }

  .result-box { text-align: center; padding: 30px 10px; }
  .result-score { font-family: 'Fraunces', serif; font-size: 3.2rem; font-weight: 700; }
  .result-msg { font-size: 1.05rem; margin: 14px 0 24px; color: var(--chalk-dim); }
  .result-msg.win { color: var(--good); }
  .result-msg.boss { color: var(--boss); }

  /* --- Customize screen --- */
  .picker-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
  .picker-card {
    background: var(--surface); border: 2px solid var(--rule); border-radius: 10px;
    padding: 14px; text-align: center; cursor: pointer; transition: border-color 0.15s;
  }
  .picker-card:hover { border-color: var(--accent-dim); }
  .picker-card.selected { border-color: var(--accent); background: var(--surface-hi); }
  .picker-card .pcard-label { font-family: 'Fraunces', serif; font-weight: 600; margin-top: 6px; }
  .picker-card .pcard-sub { font-size: 0.7rem; color: var(--chalk-dim); margin-top: 2px; }
  .preview-panel {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    padding: 22px; text-align: center; margin-bottom: 22px;
  }
  .preview-mood-btns { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .mood-btn {
    background: var(--bg-deep); border: 1px solid var(--rule); color: var(--chalk-dim);
    border-radius: 20px; padding: 6px 14px; font-size: 0.78rem; cursor: pointer; font-family: inherit;
  }
  .mood-btn:hover { color: var(--chalk); border-color: var(--accent-dim); }
  .section-label { font-family: 'Fraunces', serif; font-size: 1.05rem; margin: 22px 0 10px; }

  /* --- Avatar (fixed corner during quiz/result) --- */
  #avatar-wrap {
    position: fixed; bottom: 18px; right: 18px; width: 72px; height: 72px; z-index: 50;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
    transition: transform 0.25s;
  }
  #avatar-wrap.bump { transform: scale(1.15) rotate(-4deg); }

  .confetti-piece {
    position: fixed; top: -10px; width: 8px; height: 14px; z-index: 100;
    opacity: 0.95; pointer-events: none;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    to { transform: translateY(105vh) rotate(540deg); opacity: 0.3; }
  }

  /* --- Background decor layer (stars / dapples) --- */
  #bg-decor { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .bg-star {
    position: absolute; background: #fff; border-radius: 50%;
    opacity: 0.7; animation: star-twinkle 3s ease-in-out infinite;
  }
  @keyframes star-twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
  .bg-dapple {
    position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(242,237,221,0.10) 0%, transparent 70%);
    filter: blur(2px);
  }
  .bg-aurora {
    position: absolute; width: 380px; height: 140px; border-radius: 50%;
    filter: blur(30px); animation: aurora-drift 12s ease-in-out infinite alternate;
  }
  @keyframes aurora-drift { from { transform: translateX(-24px) rotate(-6deg); } to { transform: translateX(24px) rotate(6deg); } }
  .bg-swatch { width: 100%; height: 36px; border-radius: 6px; margin-bottom: 8px; }

  /* --- Celebration video modal --- */
  #video-modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200;
    align-items: center; justify-content: center; padding: 16px;
  }
  #video-modal-backdrop.open { display: flex; }
  .video-modal-box {
    background: var(--surface); border-radius: 12px; padding: 16px;
    width: 95vw; max-width: 1200px; max-height: 92vh;
    display: flex; flex-direction: column;
  }
  .video-frame-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; }
  .video-frame-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .video-modal-box .next-btn { width: 100%; margin-top: 14px; flex-shrink: 0; }

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="avatar-wrap"></div>
<div id="bg-decor"></div>
<div id="video-modal-backdrop"><div class="video-modal-box" id="video-modal-box"></div></div>

<script>
const CONTENT = {"units_digit_powers": {"name": "Units Digit of High Powers", "lesson": "**Units digit of a number raised to a high power**\n\nYou never need to compute the actual (huge) number -- the units digit of a^n\ncycles in a short, predictable pattern based only on the units digit of a.\n\nCycle lengths by units digit of the base:\n- 0, 1, 5, 6 -> cycle length 1 (units digit never changes)\n- 4, 9 -> cycle length 2\n- 2, 3, 7, 8 -> cycle length 4 (this is the longest any cycle ever gets)\n\nHow to solve:\n1. Look only at the units digit of the base.\n2. Write out powers 1 through 4 of that digit to find the cycle.\n3. Divide the exponent by the cycle length. The remainder tells you which\n   position in the cycle to use.\n4. Gotcha: if the remainder is 0, use the LAST position in the cycle, not a\n   \"0th\" position. Example: 7^20 -> cycle is 7,9,3,1 (length 4).\n   20 / 4 = 5 remainder 0 -> use the 4th (last) position -> units digit 1.\n\nSanity check: if you haven't seen the pattern repeat by the 5th power, you've\nmade an arithmetic error -- 4 is the max possible cycle length.\n", "flashcards": [{"front": "Units digit cycle length for bases ending in 0, 1, 5, 6?", "back": "1 -- the units digit never changes."}, {"front": "Units digit cycle length for bases ending in 4 or 9?", "back": "2."}, {"front": "Units digit cycle length for bases ending in 2, 3, 7, or 8?", "back": "4 -- the longest possible cycle."}, {"front": "Cycle of units digits for a base ending in 3?", "back": "3, 9, 7, 1 -- then repeats."}, {"front": "Exponent divided by cycle length gives remainder 0. What position in the cycle do you use?", "back": "The LAST position in the cycle, not position 0."}, {"front": "What's the maximum possible units-digit cycle length, and what does it mean if you haven't seen a repeat by the 5th power?", "back": "Max is 4 -- if no repeat by then, you've made an error."}], "bank": [{"question": "What is the units digit of 2^8?", "choices": ["8", "2", "7", "6"], "correctIndex": 3, "explanation": "2 ends in 2, whose units-digit cycle is 2, 4, 8, 6 (length 4). 8 mod 4 = 0, so we use the last position in the cycle -> 6."}, {"question": "What is the units digit of 2^20?", "choices": ["7", "8", "6", "2"], "correctIndex": 2, "explanation": "2 ends in 2, whose units-digit cycle is 2, 4, 8, 6 (length 4). 20 mod 4 = 0, so we use the last position in the cycle -> 6."}, {"question": "What is the units digit of 3^15?", "choices": ["1", "3", "9", "7"], "correctIndex": 3, "explanation": "3 ends in 3, whose units-digit cycle is 3, 9, 7, 1 (length 4). 15 mod 4 = 3, so we use position 3 -> 7."}, {"question": "What is the units digit of 3^40?", "choices": ["3", "7", "1", "2"], "correctIndex": 2, "explanation": "3 ends in 3, whose units-digit cycle is 3, 9, 7, 1 (length 4). 40 mod 4 = 0, so we use the last position in the cycle -> 1."}, {"question": "What is the units digit of 7^23?", "choices": ["1", "9", "7", "3"], "correctIndex": 3, "explanation": "7 ends in 7, whose units-digit cycle is 7, 9, 3, 1 (length 4). 23 mod 4 = 3, so we use position 3 -> 3."}, {"question": "What is the units digit of 7^20?", "choices": ["7", "2", "3", "1"], "correctIndex": 3, "explanation": "7 ends in 7, whose units-digit cycle is 7, 9, 3, 1 (length 4). 20 mod 4 = 0, so we use the last position in the cycle -> 1."}, {"question": "What is the units digit of 8^27?", "choices": ["4", "6", "2", "8"], "correctIndex": 2, "explanation": "8 ends in 8, whose units-digit cycle is 8, 4, 2, 6 (length 4). 27 mod 4 = 3, so we use position 3 -> 2."}, {"question": "What is the units digit of 8^44?", "choices": ["8", "7", "6", "2"], "correctIndex": 2, "explanation": "8 ends in 8, whose units-digit cycle is 8, 4, 2, 6 (length 4). 44 mod 4 = 0, so we use the last position in the cycle -> 6."}, {"question": "What is the units digit of 4^17?", "choices": ["4", "5", "6", "2"], "correctIndex": 0, "explanation": "4 ends in 4, whose units-digit cycle is 4, 6 (length 2). 17 mod 2 = 1, so we use position 1 -> 4."}, {"question": "What is the units digit of 4^30?", "choices": ["7", "9", "6", "4"], "correctIndex": 2, "explanation": "4 ends in 4, whose units-digit cycle is 4, 6 (length 2). 30 mod 2 = 0, so we use the last position in the cycle -> 6."}, {"question": "What is the units digit of 9^13?", "choices": ["10", "1", "7", "9"], "correctIndex": 3, "explanation": "9 ends in 9, whose units-digit cycle is 9, 1 (length 2). 13 mod 2 = 1, so we use position 1 -> 9."}, {"question": "What is the units digit of 9^18?", "choices": ["-1", "2", "9", "1"], "correctIndex": 3, "explanation": "9 ends in 9, whose units-digit cycle is 9, 1 (length 2). 18 mod 2 = 0, so we use the last position in the cycle -> 1."}, {"question": "What is the units digit of 6^21?", "choices": ["9", "7", "6", "4"], "correctIndex": 2, "explanation": "6 ends in 6, whose units-digit cycle is 6 (length 1). 21 mod 1 = 0, so we use the last position in the cycle -> 6."}, {"question": "What is the units digit of 1^55?", "choices": ["-1", "4", "2", "1"], "correctIndex": 3, "explanation": "1 ends in 1, whose units-digit cycle is 1 (length 1). 55 mod 1 = 0, so we use the last position in the cycle -> 1."}, {"question": "What is the units digit of 5^91?", "choices": ["5", "6", "8", "3"], "correctIndex": 0, "explanation": "5 ends in 5, whose units-digit cycle is 5 (length 1). 91 mod 1 = 0, so we use the last position in the cycle -> 5."}, {"question": "What is the units digit of 0^12?", "choices": ["3", "0", "-2", "1"], "correctIndex": 1, "explanation": "0 ends in 0, whose units-digit cycle is 0 (length 1). 12 mod 1 = 0, so we use the last position in the cycle -> 0."}, {"question": "What is the units digit of 2^51?", "choices": ["6", "2", "4", "8"], "correctIndex": 3, "explanation": "2 ends in 2, whose units-digit cycle is 2, 4, 8, 6 (length 4). 51 mod 4 = 3, so we use position 3 -> 8."}, {"question": "What is the units digit of 3^100?", "choices": ["3", "2", "1", "7"], "correctIndex": 2, "explanation": "3 ends in 3, whose units-digit cycle is 3, 9, 7, 1 (length 4). 100 mod 4 = 0, so we use the last position in the cycle -> 1."}, {"question": "What is the units digit of 7^99?", "choices": ["7", "9", "1", "3"], "correctIndex": 3, "explanation": "7 ends in 7, whose units-digit cycle is 7, 9, 3, 1 (length 4). 99 mod 4 = 3, so we use position 3 -> 3."}, {"question": "What is the units digit of 8^63?", "choices": ["2", "6", "4", "8"], "correctIndex": 0, "explanation": "8 ends in 8, whose units-digit cycle is 8, 4, 2, 6 (length 4). 63 mod 4 = 3, so we use position 3 -> 2."}, {"question": "What is the units digit of 12^34?", "choices": ["4", "2", "5", "8"], "correctIndex": 0, "explanation": "12 ends in 2, whose units-digit cycle is 2, 4, 8, 6 (length 4). 34 mod 4 = 2, so we use position 2 -> 4."}, {"question": "What is the units digit of 13^27?", "choices": ["7", "3", "9", "1"], "correctIndex": 0, "explanation": "13 ends in 3, whose units-digit cycle is 3, 9, 7, 1 (length 4). 27 mod 4 = 3, so we use position 3 -> 7."}, {"question": "What is the units digit of 17^45?", "choices": ["9", "8", "1", "7"], "correctIndex": 3, "explanation": "17 ends in 7, whose units-digit cycle is 7, 9, 3, 1 (length 4). 45 mod 4 = 1, so we use position 1 -> 7."}, {"question": "What is the units digit of 24^19?", "choices": ["5", "2", "4", "6"], "correctIndex": 2, "explanation": "24 ends in 4, whose units-digit cycle is 4, 6 (length 2). 19 mod 2 = 1, so we use position 1 -> 4."}]}, "gcf_lcm": {"name": "GCF & LCM Tricks (and Telling Them Apart)", "lesson": "**GCF trick, LCM trick, and telling them apart**\n\nGCF trick: for unequal integers a and b, GCF(a,b) must divide |a-b|. Find\n|a-b| first, list ITS factors, then test from largest to smallest against\nboth original numbers.\n\nLCM trick: just list multiples of the larger number and check them against\nthe smaller number -- for ACT-sized numbers this is usually faster than the\n\"multiply then divide by GCF\" formula.\n\nThe distinction that trips people up:\n- GCF (Greatest Common FACTOR) divides INTO both numbers -- always <= the\n  smaller number. It should feel SMALL.\n- LCM (Least Common Multiple) is divided INTO BY both numbers -- always >=\n  the larger number. It should feel BIG.\n\nGut check on test day: if your GCF answer is bigger than the smaller number,\nor your LCM answer is smaller than the larger number, you mixed them up.\n", "flashcards": [{"front": "GCF trick: what must the GCF of a and b divide?", "back": "|a - b| -- the absolute value of their difference."}, {"front": "Fastest way to find LCM of two ACT-sized numbers?", "back": "List multiples of the larger number and check against the smaller one."}, {"front": "Should a GCF answer feel big or small?", "back": "Small -- it can never exceed the smaller of the two numbers."}, {"front": "Should an LCM answer feel big or small?", "back": "Big -- it can never be less than the larger of the two numbers."}, {"front": "Gut-check rule to catch a GCF/LCM mix-up", "back": "GCF <= smaller number; LCM >= larger number. If it doesn't fit, you swapped them."}], "bank": [{"question": "What is the LCM of 85 and 68?", "choices": ["17", "340", "85", "5780"], "correctIndex": 1, "explanation": "Listing multiples of 85 until one is also a multiple of 68 gives 340. (Note 17 is the GCF, a common mix-up.)"}, {"question": "What is the LCM of 24 and 36?", "choices": ["12", "864", "36", "72"], "correctIndex": 3, "explanation": "Listing multiples of 36 until one is also a multiple of 24 gives 72. (Note 12 is the GCF, a common mix-up.)"}, {"question": "What is the LCM of 18 and 30?", "choices": ["540", "90", "6", "30"], "correctIndex": 1, "explanation": "Listing multiples of 30 until one is also a multiple of 18 gives 90. (Note 6 is the GCF, a common mix-up.)"}, {"question": "What is the GCF of 45 and 27?", "choices": ["27", "135", "9", "18"], "correctIndex": 2, "explanation": "|45-27| = 18. Testing its factors against both numbers, the largest one that divides both 45 and 27 is 9. (Note 135 is the LCM, a common mix-up.)"}, {"question": "What is the LCM of 56 and 42?", "choices": ["2352", "14", "168", "56"], "correctIndex": 2, "explanation": "Listing multiples of 56 until one is also a multiple of 42 gives 168. (Note 14 is the GCF, a common mix-up.)"}, {"question": "What is the GCF of 63 and 84?", "choices": ["21", "22", "63", "252"], "correctIndex": 0, "explanation": "|63-84| = 21. Testing its factors against both numbers, the largest one that divides both 63 and 84 is 21. (Note 252 is the LCM, a common mix-up.)"}, {"question": "What is the LCM of 13 and 91?", "choices": ["1183", "91", "13", "92"], "correctIndex": 1, "explanation": "Listing multiples of 91 until one is also a multiple of 13 gives 91. (Note 13 is the GCF, a common mix-up.)"}, {"question": "What is the GCF of 48 and 60?", "choices": ["240", "48", "12", "13"], "correctIndex": 2, "explanation": "|48-60| = 12. Testing its factors against both numbers, the largest one that divides both 48 and 60 is 12. (Note 240 is the LCM, a common mix-up.)"}, {"question": "What is the GCF of 72 and 90?", "choices": ["19", "18", "72", "360"], "correctIndex": 1, "explanation": "|72-90| = 18. Testing its factors against both numbers, the largest one that divides both 72 and 90 is 18. (Note 360 is the LCM, a common mix-up.)"}, {"question": "What is the LCM of 33 and 55?", "choices": ["55", "1815", "11", "165"], "correctIndex": 3, "explanation": "Listing multiples of 55 until one is also a multiple of 33 gives 165. (Note 11 is the GCF, a common mix-up.)"}, {"question": "What is the LCM of 14 and 35?", "choices": ["7", "70", "35", "490"], "correctIndex": 1, "explanation": "Listing multiples of 35 until one is also a multiple of 14 gives 70. (Note 7 is the GCF, a common mix-up.)"}, {"question": "What is the GCF of 28 and 42?", "choices": ["14", "84", "15", "28"], "correctIndex": 0, "explanation": "|28-42| = 14. Testing its factors against both numbers, the largest one that divides both 28 and 42 is 14. (Note 84 is the LCM, a common mix-up.)"}, {"question": "What is the GCF of 17 and 51?", "choices": ["18", "17", "51", "34"], "correctIndex": 1, "explanation": "|17-51| = 34. Testing its factors against both numbers, the largest one that divides both 17 and 51 is 17. (Note 51 is the LCM, a common mix-up.)"}, {"question": "What is the LCM of 39 and 65?", "choices": ["65", "13", "2535", "195"], "correctIndex": 3, "explanation": "Listing multiples of 65 until one is also a multiple of 39 gives 195. (Note 13 is the GCF, a common mix-up.)"}, {"question": "What is the GCF of 22 and 55?", "choices": ["22", "110", "33", "11"], "correctIndex": 3, "explanation": "|22-55| = 33. Testing its factors against both numbers, the largest one that divides both 22 and 55 is 11. (Note 110 is the LCM, a common mix-up.)"}, {"question": "What is the GCF of 26 and 65?", "choices": ["39", "13", "26", "130"], "correctIndex": 1, "explanation": "|26-65| = 39. Testing its factors against both numbers, the largest one that divides both 26 and 65 is 13. (Note 130 is the LCM, a common mix-up.)"}, {"question": "What is the GCF of 36 and 60?", "choices": ["36", "12", "180", "24"], "correctIndex": 1, "explanation": "|36-60| = 24. Testing its factors against both numbers, the largest one that divides both 36 and 60 is 12. (Note 180 is the LCM, a common mix-up.)"}, {"question": "What is the GCF of 54 and 90?", "choices": ["54", "18", "270", "36"], "correctIndex": 1, "explanation": "|54-90| = 36. Testing its factors against both numbers, the largest one that divides both 54 and 90 is 18. (Note 270 is the LCM, a common mix-up.)"}, {"question": "What is the GCF of 21 and 49?", "choices": ["21", "7", "28", "147"], "correctIndex": 1, "explanation": "|21-49| = 28. Testing its factors against both numbers, the largest one that divides both 21 and 49 is 7. (Note 147 is the LCM, a common mix-up.)"}, {"question": "What is the GCF of 44 and 66?", "choices": ["132", "44", "22", "23"], "correctIndex": 2, "explanation": "|44-66| = 22. Testing its factors against both numbers, the largest one that divides both 44 and 66 is 22. (Note 132 is the LCM, a common mix-up.)"}, {"question": "Which statement is always true for two different positive integers a and b?", "choices": ["GCF(a,b) is less than or equal to the smaller of a and b", "GCF(a,b) and LCM(a,b) are always equal", "GCF(a,b) is always greater than LCM(a,b)", "LCM(a,b) is less than or equal to the smaller of a and b"], "correctIndex": 0, "explanation": "GCF can never exceed the smaller number; LCM can never be smaller than the larger number."}, {"question": "Which statement is always true for two different positive integers a and b?", "choices": ["LCM(a,b) is greater than or equal to the larger of a and b", "GCF(a,b) is greater than or equal to the larger of a and b", "LCM(a,b) equals a - b", "LCM(a,b) is less than a and b"], "correctIndex": 0, "explanation": "LCM must be a multiple of both numbers, so it can never be smaller than the larger one."}, {"question": "A student says the GCF of 18 and 24 is 72. What went wrong?", "choices": ["They forgot to divide by 2", "They calculated the LCM instead of the GCF", "72 is actually correct", "They calculated a - b instead"], "correctIndex": 1, "explanation": "72 is the LCM of 18 and 24 (the GCF is 6). This is the classic GCF/LCM swap."}]}, "arith_geo_sequences": {"name": "Arithmetic vs. Geometric Sequences", "lesson": "**Arithmetic vs. geometric sequences**\n\nArithmetic sequence: constant DIFFERENCE between consecutive terms (add/\nsubtract the same number each time). a_n = a_1 + (n-1)d\n\nGeometric sequence: constant RATIO between consecutive terms (multiply by\nthe same number each time). a_n = a_1 * r^(n-1)\n\nQuick test: is the GAP between terms constant (arithmetic), or is the RATIO\nbetween terms constant (geometric)? Check both before assuming.\n", "flashcards": [{"front": "What stays constant in an arithmetic sequence?", "back": "The difference between consecutive terms."}, {"front": "What stays constant in a geometric sequence?", "back": "The ratio between consecutive terms.\n(a constant multiplier or a constant divider)"}, {"front": "Formula for the nth term of an arithmetic sequence?", "back": "a_n = a_1 + (n-1)d\n\nIn plain language: nth term = the first term + (n - 1) x the common difference."}, {"front": "Formula for the nth term of a geometric sequence?", "back": "a_n = a_1 * r^(n-1)\n\nIn plain language: nth term = the first term x the common ratio, raised to the (n - 1) power."}, {"front": "Fastest way to tell which type a sequence is?", "back": "Check if consecutive terms have a constant gap (arithmetic) or constant ratio (geometric)."}, {"front": "Formula for the sum of the first n terms of an arithmetic sequence?", "back": "S_n = n/2 * (2a_1 + (n-1)d), or equivalently n times the average of the first and last term."}, {"front": "Formula for the sum of the first n terms of a geometric sequence (r != 1)?", "back": "For a small number of terms, it's usually fastest and safest to just list them out and add. The formula (S_n = a_1 * (r^n - 1) / (r - 1)) is there as a backup for large n, but listing terms avoids sign-error mistakes with negative ratios."}, {"front": "You know a_3 and a_7 of an arithmetic sequence but not a_1. How do you find the common difference?", "back": "d = (a_7 - a_3) / (7 - 3) -- divide the difference in terms by the difference in their positions."}], "bank": [{"question": "What is the next term in this geometric sequence: 7, -14, 28, -56, ...?", "choices": ["112", "113", "-77", "-56"], "correctIndex": 0, "explanation": "Common ratio is -2 (each term = previous * -2). Next term = -56 * -2 = 112."}, {"question": "What is the next term in this arithmetic sequence: 4, 7, 10, 13, ...?", "choices": ["19", "10", "22.75", "16"], "correctIndex": 3, "explanation": "Common difference is 3 (each term = previous + 3). Next term = 13 + 3 = 16."}, {"question": "What is the next term in this arithmetic sequence: 4, 6, 8, 10, ...?", "choices": ["15", "8", "14", "12"], "correctIndex": 3, "explanation": "Common difference is 2 (each term = previous + 2). Next term = 10 + 2 = 12."}, {"question": "What is the next term in this arithmetic sequence: 2, 4, 6, 8, ...?", "choices": ["16", "6", "10", "12"], "correctIndex": 2, "explanation": "Common difference is 2 (each term = previous + 2). Next term = 8 + 2 = 10."}, {"question": "What is the next term in this geometric sequence: 8, 16, 32, 64, ...?", "choices": ["128", "129", "64", "72"], "correctIndex": 0, "explanation": "Common ratio is 2 (each term = previous * 2). Next term = 64 * 2 = 128."}, {"question": "What is the next term in this arithmetic sequence: 8, 13, 18, 23, ...?", "choices": ["18", "33", "28", "37.38"], "correctIndex": 2, "explanation": "Common difference is 5 (each term = previous + 5). Next term = 23 + 5 = 28."}, {"question": "What is the next term in this geometric sequence: 6, 18, 54, 162, ...?", "choices": ["162", "486", "174", "487"], "correctIndex": 1, "explanation": "Common ratio is 3 (each term = previous * 3). Next term = 162 * 3 = 486."}, {"question": "What is the next term in this arithmetic sequence: 1, 6, 11, 16, ...?", "choices": ["96", "11", "21", "26"], "correctIndex": 2, "explanation": "Common difference is 5 (each term = previous + 5). Next term = 16 + 5 = 21."}, {"question": "What is the next term in this arithmetic sequence: 4, 2, 0, -2, ...?", "choices": ["-6", "-1", "-4", "0"], "correctIndex": 2, "explanation": "Common difference is -2 (each term = previous + -2). Next term = -2 + -2 = -4."}, {"question": "What is the next term in this arithmetic sequence: 5, 10, 15, 20, ...?", "choices": ["30", "15", "25", "40"], "correctIndex": 2, "explanation": "Common difference is 5 (each term = previous + 5). Next term = 20 + 5 = 25."}, {"question": "What is the next term in this arithmetic sequence: 1, -2, -5, -8, ...?", "choices": ["16", "-14", "-5", "-11"], "correctIndex": 3, "explanation": "Common difference is -3 (each term = previous + -3). Next term = -8 + -3 = -11."}, {"question": "What is the next term in this arithmetic sequence: 7, 12, 17, 22, ...?", "choices": ["32", "37.71", "27", "17"], "correctIndex": 2, "explanation": "Common difference is 5 (each term = previous + 5). Next term = 22 + 5 = 27."}, {"question": "What is the next term in this arithmetic sequence: 3, 8, 13, 18, ...?", "choices": ["13", "28", "48", "23"], "correctIndex": 3, "explanation": "Common difference is 5 (each term = previous + 5). Next term = 18 + 5 = 23."}, {"question": "What is the next term in this geometric sequence: 5, 15, 45, 135, ...?", "choices": ["145", "135", "405", "406"], "correctIndex": 2, "explanation": "Common ratio is 3 (each term = previous * 3). Next term = 135 * 3 = 405."}, {"question": "What is the next term in this geometric sequence: 4, 8, 16, 32, ...?", "choices": ["65", "36", "32", "64"], "correctIndex": 3, "explanation": "Common ratio is 2 (each term = previous * 2). Next term = 32 * 2 = 64."}, {"question": "What is the next term in this arithmetic sequence: 1, -1, -3, -5, ...?", "choices": ["5", "-7", "-9", "-3"], "correctIndex": 1, "explanation": "Common difference is -2 (each term = previous + -2). Next term = -5 + -2 = -7."}, {"question": "What is the next term in this arithmetic sequence: 9, 11, 13, 15, ...?", "choices": ["13", "19", "17", "18.33"], "correctIndex": 2, "explanation": "Common difference is 2 (each term = previous + 2). Next term = 15 + 2 = 17."}, {"question": "What is the next term in this arithmetic sequence: 7, 9, 11, 13, ...?", "choices": ["11", "15", "17", "16.71"], "correctIndex": 1, "explanation": "Common difference is 2 (each term = previous + 2). Next term = 13 + 2 = 15."}, {"question": "What is the next term in this arithmetic sequence: 7, 4, 1, -2, ...?", "choices": ["1", "-5", "-1.14", "-8"], "correctIndex": 1, "explanation": "Common difference is -3 (each term = previous + -3). Next term = -2 + -3 = -5."}, {"question": "What is the next term in this geometric sequence: 4, 12, 36, 108, ...?", "choices": ["108", "116", "324", "325"], "correctIndex": 2, "explanation": "Common ratio is 3 (each term = previous * 3). Next term = 108 * 3 = 324."}, {"question": "Is this sequence arithmetic or geometric: 5, 8, 11, 14, ...?", "choices": ["neither", "arithmetic", "geometric", "both"], "correctIndex": 1, "explanation": "Checking gaps vs. ratios between consecutive terms identifies it as arithmetic."}, {"question": "Is this sequence arithmetic or geometric: 2, 6, 18, 54, ...?", "choices": ["neither", "both", "arithmetic", "geometric"], "correctIndex": 3, "explanation": "Checking gaps vs. ratios between consecutive terms identifies it as geometric."}, {"question": "Is this sequence arithmetic or geometric: 100, 90, 80, 70, ...?", "choices": ["geometric", "both", "neither", "arithmetic"], "correctIndex": 3, "explanation": "Checking gaps vs. ratios between consecutive terms identifies it as arithmetic."}, {"question": "Is this sequence arithmetic or geometric: 3, -6, 12, -24, ...?", "choices": ["both", "arithmetic", "geometric", "neither"], "correctIndex": 2, "explanation": "Checking gaps vs. ratios between consecutive terms identifies it as geometric."}, {"question": "An arithmetic sequence has first term a_1 = 4 and common difference -3. What is a_11?", "choices": ["34", "-23", "-26", "-29"], "correctIndex": 2, "explanation": "a_n = a_1 + (n-1)d. a_11 = 4 + (11-1)(-3) = 4 + -30 = -26. A common mistake is using n instead of (n-1) as the multiplier."}, {"question": "An arithmetic sequence has first term a_1 = -4 and common difference 3. What is a_12?", "choices": ["32", "29", "26", "-37"], "correctIndex": 1, "explanation": "a_n = a_1 + (n-1)d. a_12 = -4 + (12-1)(3) = -4 + 33 = 29. A common mistake is using n instead of (n-1) as the multiplier."}, {"question": "An arithmetic sequence has first term a_1 = 7 and common difference 5. What is a_14?", "choices": ["72", "67", "-58", "77"], "correctIndex": 0, "explanation": "a_n = a_1 + (n-1)d. a_14 = 7 + (14-1)(5) = 7 + 65 = 72. A common mistake is using n instead of (n-1) as the multiplier."}, {"question": "An arithmetic sequence has first term a_1 = -2 and common difference 4. What is a_15?", "choices": ["54", "-58", "50", "58"], "correctIndex": 0, "explanation": "a_n = a_1 + (n-1)d. a_15 = -2 + (15-1)(4) = -2 + 56 = 54. A common mistake is using n instead of (n-1) as the multiplier."}, {"question": "An arithmetic sequence has first term a_1 = -6 and common difference 3. What is a_15?", "choices": ["-48", "36", "39", "33"], "correctIndex": 1, "explanation": "a_n = a_1 + (n-1)d. a_15 = -6 + (15-1)(3) = -6 + 42 = 36. A common mistake is using n instead of (n-1) as the multiplier."}, {"question": "An arithmetic sequence has first term a_1 = 0 and common difference 2. What is a_14?", "choices": ["24", "26", "-26", "28"], "correctIndex": 1, "explanation": "a_n = a_1 + (n-1)d. a_14 = 0 + (14-1)(2) = 0 + 26 = 26. A common mistake is using n instead of (n-1) as the multiplier."}, {"question": "A geometric sequence has first term a_1 = 3 and common ratio -3. What is a_5?", "choices": ["-729", "-81", "243", "-9"], "correctIndex": 2, "explanation": "a_n = a_1 * r^(n-1). a_5 = 3 * (-3)^4 = 243."}, {"question": "A geometric sequence has first term a_1 = -2 and common ratio 3. What is a_7?", "choices": ["-1458", "16", "-4374", "-486"], "correctIndex": 0, "explanation": "a_n = a_1 * r^(n-1). a_7 = -2 * (3)^6 = -1458."}, {"question": "A geometric sequence has first term a_1 = 32 and common ratio 1/2. What is a_7?", "choices": ["35", "1/4", "1/2", "1"], "correctIndex": 2, "explanation": "a_n = a_1 * r^(n-1). a_7 = 32 * (1/2)^6 = 1/2."}, {"question": "A geometric sequence has first term a_1 = -3 and common ratio 2. What is a_6?", "choices": ["-192", "-48", "-96", "7"], "correctIndex": 2, "explanation": "a_n = a_1 * r^(n-1). a_6 = -3 * (2)^5 = -96."}, {"question": "A geometric sequence has first term a_1 = 24 and common ratio 1/3. What is a_5?", "choices": ["8/9", "8/27", "76/3", "8/81"], "correctIndex": 1, "explanation": "a_n = a_1 * r^(n-1). a_5 = 24 * (1/3)^4 = 8/27."}, {"question": "A geometric sequence has first term a_1 = 2 and common ratio -3. What is a_5?", "choices": ["-54", "-486", "162", "-10"], "correctIndex": 2, "explanation": "a_n = a_1 * r^(n-1). a_5 = 2 * (-3)^4 = 162."}, {"question": "In an arithmetic sequence, a_4 = 13 and a_9 = 33. What is a_11?", "choices": ["41", "43", "53", "34"], "correctIndex": 0, "explanation": "Find d from the two known terms: d = (a_9 - a_4) / (9-4) = (33 - 13) / 5 = 4. Then a_11 = a_9 + (11-9) * d = 33 + 8 = 41."}, {"question": "In an arithmetic sequence, a_4 = 11 and a_7 = 26. What is a_12?", "choices": ["56", "43", "51", "66"], "correctIndex": 2, "explanation": "Find d from the two known terms: d = (a_7 - a_4) / (7-4) = (26 - 11) / 3 = 5. Then a_12 = a_7 + (12-7) * d = 26 + 25 = 51."}, {"question": "In an arithmetic sequence, a_2 = 0 and a_5 = 12. What is a_9?", "choices": ["21", "29", "28", "32"], "correctIndex": 2, "explanation": "Find d from the two known terms: d = (a_5 - a_2) / (5-2) = (12 - 0) / 3 = 4. Then a_9 = a_5 + (9-5) * d = 12 + 16 = 28."}, {"question": "In a geometric sequence, a_1 = 3 and a_4 = 24. What is a_5?", "choices": ["-48", "45", "24", "48"], "correctIndex": 3, "explanation": "Dividing shows the ratio: r^3 = a_4/a_1 = 24/3, so r = 2. Then a_5 = a_4 * r^1 = 24 * 2^1 = 48."}, {"question": "In an arithmetic sequence, a_3 = 7 and a_6 = 13. What is a_10?", "choices": ["21", "14", "25", "22"], "correctIndex": 0, "explanation": "Find d from the two known terms: d = (a_6 - a_3) / (6-3) = (13 - 7) / 3 = 2. Then a_10 = a_6 + (10-6) * d = 13 + 8 = 21."}, {"question": "In a geometric sequence, a_1 = 3 and a_3 = 27. What is a_4?", "choices": ["81", "51", "-81", "27"], "correctIndex": 0, "explanation": "Dividing shows the ratio: r^2 = a_3/a_1 = 27/3, so r = 3. Then a_4 = a_3 * r^1 = 27 * 3^1 = 81."}, {"question": "What is the sum of the first 7 terms of an arithmetic sequence with a_1 = 7 and common difference -2?", "choices": ["14", "7", "12", "-35"], "correctIndex": 1, "explanation": "S_n = n/2 * (2a_1 + (n-1)d) = 7/2 * (2*7 + 6*-2) = 7/2 * 2 = 7. (Equivalently, sum = n * average of first and last term: average of 7 and -5 times 7.)"}, {"question": "What is the sum of the first 6 terms of an arithmetic sequence with a_1 = 5 and common difference 4?", "choices": ["180", "65", "90", "150"], "correctIndex": 2, "explanation": "S_n = n/2 * (2a_1 + (n-1)d) = 6/2 * (2*5 + 5*4) = 6/2 * 30 = 90. (Equivalently, sum = n * average of first and last term: average of 5 and 25 times 6.)"}, {"question": "What is the sum of the first 9 terms of an arithmetic sequence with a_1 = 1 and common difference 4?", "choices": ["120", "297", "306", "153"], "correctIndex": 3, "explanation": "S_n = n/2 * (2a_1 + (n-1)d) = 9/2 * (2*1 + 8*4) = 9/2 * 34 = 153. (Equivalently, sum = n * average of first and last term: average of 1 and 33 times 9.)"}, {"question": "What is the sum of the first 10 terms of an arithmetic sequence with a_1 = -1 and common difference 2?", "choices": ["80", "160", "63", "170"], "correctIndex": 0, "explanation": "S_n = n/2 * (2a_1 + (n-1)d) = 10/2 * (2*-1 + 9*2) = 10/2 * 16 = 80. (Equivalently, sum = n * average of first and last term: average of -1 and 17 times 10.)"}, {"question": "What is the sum of the first 10 terms of an arithmetic sequence with a_1 = 7 and common difference -2?", "choices": ["-20", "-110", "-9", "-40"], "correctIndex": 0, "explanation": "S_n = n/2 * (2a_1 + (n-1)d) = 10/2 * (2*7 + 9*-2) = 10/2 * -4 = -20. (Equivalently, sum = n * average of first and last term: average of 7 and -11 times 10.)"}, {"question": "What is the sum of the first 6 terms of a geometric sequence with a_1 = -1 and common ratio 3?", "choices": ["-364", "-121", "-363", "-243"], "correctIndex": 0, "explanation": "S_n = a_1 * (r^n - 1) / (r - 1) = -1 * ((3)^6 - 1) / (3 - 1) = -1 * (729 - 1) / 2 = -364."}, {"question": "What is the sum of the first 6 terms of a geometric sequence with a_1 = 4 and common ratio -2?", "choices": ["44", "-126", "-84", "-128"], "correctIndex": 2, "explanation": "S_n = a_1 * (r^n - 1) / (r - 1) = 4 * ((-2)^6 - 1) / (-2 - 1) = 4 * (64 - 1) / -3 = -84."}, {"question": "What is the sum of the first 5 terms of a geometric sequence with a_1 = 2 and common ratio 3?", "choices": ["162", "161", "80", "242"], "correctIndex": 3, "explanation": "S_n = a_1 * (r^n - 1) / (r - 1) = 2 * ((3)^5 - 1) / (3 - 1) = 2 * (243 - 1) / 2 = 242."}, {"question": "What is the sum of the first 4 terms of a geometric sequence with a_1 = 3 and common ratio -2?", "choices": ["-15", "-24", "9", "-23"], "correctIndex": 0, "explanation": "S_n = a_1 * (r^n - 1) / (r - 1) = 3 * ((-2)^4 - 1) / (-2 - 1) = 3 * (16 - 1) / -3 = -15."}, {"question": "What is the sum of the first 6 terms of a geometric sequence with a_1 = -1 and common ratio -2?", "choices": ["21", "-11", "32", "31"], "correctIndex": 0, "explanation": "S_n = a_1 * (r^n - 1) / (r - 1) = -1 * ((-2)^6 - 1) / (-2 - 1) = -1 * (64 - 1) / -3 = 21."}]}, "abs_value_inequalities": {"name": "Absolute Value Inequalities", "lesson": "**Absolute value inequalities -- the long method**\n\n|x - b| <= c means \"the distance between x and b is at most c.\"\n\nLong method: drop the bars and write a compound inequality:\n    -c <= x - b <= c\nThen solve for x by doing the SAME operation to all three parts.\n\nWhen do you flip the inequality sign? ONLY when you multiply or divide all\nparts by a NEGATIVE number. It has nothing to do with absolute value itself\n-- it's just the normal inequality rule. Example: |-2x + 3| <= 7 becomes\n-7 <= -2x + 3 <= 7, then -10 <= -2x <= 4, and dividing by -2 flips BOTH\nsigns: 5 >= x >= -2, i.e. -2 <= x <= 5.\n\nCounting integer solutions: once you have a <= x <= b, count is b - a + 1\n(inclusive). If the inequality is strict (< instead of <=), the endpoints\nare excluded.\n", "flashcards": [{"front": "What does |x - b| <= c mean in words?", "back": "The distance between x and b is at most c."}, {"front": "When do you flip an inequality sign?", "back": "Only when multiplying or dividing all parts by a negative number."}, {"front": "How many integers satisfy -2 <= x <= 10?", "back": "13 (10 - (-2) + 1 = 13)."}, {"front": "If the inequality is strict (< instead of <=), what happens to the endpoints?", "back": "They're excluded from the solution set."}, {"front": "First step to solve |x - b| <= c?", "back": "Drop the bars and write the compound inequality: -c <= x - b <= c."}], "bank": [{"question": "How many integers satisfy |x - -6| <= 5?", "choices": ["12", "10", "11", "5"], "correctIndex": 2, "explanation": "Rewrite as -5 <= x - -6 <= 5, then add -6 to all parts: -11 <= x <= -1. Endpoints included. Count = 11."}, {"question": "How many integers satisfy |x - 1| < 11?", "choices": ["22", "21", "19", "11"], "correctIndex": 1, "explanation": "Rewrite as -11 < x - 1 < 11, then add 1 to all parts: -10 < x < 12. Endpoints excluded since strict. Count = 21."}, {"question": "How many integers satisfy |x - -4| < 6?", "choices": ["12", "9", "6", "11"], "correctIndex": 3, "explanation": "Rewrite as -6 < x - -4 < 6, then add -4 to all parts: -10 < x < 2. Endpoints excluded since strict. Count = 11."}, {"question": "How many integers satisfy |x - 0| < 6?", "choices": ["9", "12", "11", "6"], "correctIndex": 2, "explanation": "Rewrite as -6 < x - 0 < 6, then add 0 to all parts: -6 < x < 6. Endpoints excluded since strict. Count = 11."}, {"question": "How many integers satisfy |x - 8| <= 9?", "choices": ["9", "18", "20", "19"], "correctIndex": 3, "explanation": "Rewrite as -9 <= x - 8 <= 9, then add 8 to all parts: -1 <= x <= 17. Endpoints included. Count = 19."}, {"question": "How many integers satisfy |x - 0| < 2?", "choices": ["1", "4", "3", "2"], "correctIndex": 2, "explanation": "Rewrite as -2 < x - 0 < 2, then add 0 to all parts: -2 < x < 2. Endpoints excluded since strict. Count = 3."}, {"question": "How many integers satisfy |x - -3| <= 9?", "choices": ["18", "9", "20", "19"], "correctIndex": 3, "explanation": "Rewrite as -9 <= x - -3 <= 9, then add -3 to all parts: -12 <= x <= 6. Endpoints included. Count = 19."}, {"question": "How many integers satisfy |x - -4| < 10?", "choices": ["20", "19", "17", "10"], "correctIndex": 1, "explanation": "Rewrite as -10 < x - -4 < 10, then add -4 to all parts: -14 < x < 6. Endpoints excluded since strict. Count = 19."}, {"question": "How many integers satisfy |x - 5| < 4?", "choices": ["5", "7", "8", "4"], "correctIndex": 1, "explanation": "Rewrite as -4 < x - 5 < 4, then add 5 to all parts: 1 < x < 9. Endpoints excluded since strict. Count = 7."}, {"question": "How many integers satisfy |x - 3| < 5?", "choices": ["7", "5", "10", "9"], "correctIndex": 3, "explanation": "Rewrite as -5 < x - 3 < 5, then add 3 to all parts: -2 < x < 8. Endpoints excluded since strict. Count = 9."}, {"question": "How many integers satisfy |x - -4| < 5?", "choices": ["5", "9", "7", "10"], "correctIndex": 1, "explanation": "Rewrite as -5 < x - -4 < 5, then add -4 to all parts: -9 < x < 1. Endpoints excluded since strict. Count = 9."}, {"question": "How many integers satisfy |x - -3| <= 7?", "choices": ["7", "15", "16", "14"], "correctIndex": 1, "explanation": "Rewrite as -7 <= x - -3 <= 7, then add -3 to all parts: -10 <= x <= 4. Endpoints included. Count = 15."}, {"question": "How many integers satisfy |x - -5| < 8?", "choices": ["16", "8", "15", "13"], "correctIndex": 2, "explanation": "Rewrite as -8 < x - -5 < 8, then add -5 to all parts: -13 < x < 3. Endpoints excluded since strict. Count = 15."}, {"question": "How many integers satisfy |x - 6| <= 7?", "choices": ["16", "7", "15", "14"], "correctIndex": 2, "explanation": "Rewrite as -7 <= x - 6 <= 7, then add 6 to all parts: -1 <= x <= 13. Endpoints included. Count = 15."}, {"question": "How many integers satisfy |x - -2| <= 8?", "choices": ["18", "16", "17", "8"], "correctIndex": 2, "explanation": "Rewrite as -8 <= x - -2 <= 8, then add -2 to all parts: -10 <= x <= 6. Endpoints included. Count = 17."}, {"question": "How many integers satisfy |x - 3| <= 12?", "choices": ["24", "26", "25", "12"], "correctIndex": 2, "explanation": "Rewrite as -12 <= x - 3 <= 12, then add 3 to all parts: -9 <= x <= 15. Endpoints included. Count = 25."}, {"question": "Solve for x: |2x + -2| <= 5", "choices": ["-3/2 >= x >= 7/2", "-3 <= x <= 7", "x <= 7/2", "-3/2 <= x <= 7/2"], "correctIndex": 3, "explanation": "-5 <= 2x + -2 <= 5, so -3 <= 2x <= 7. Dividing by 2 (positive, no flip needed): -3/2 <= x <= 7/2."}, {"question": "Solve for x: |3x + -1| <= 8", "choices": ["-7/3 >= x >= 3", "x <= 3", "-7 <= x <= 9", "-7/3 <= x <= 3"], "correctIndex": 3, "explanation": "-8 <= 3x + -1 <= 8, so -7 <= 3x <= 9. Dividing by 3 (positive, no flip needed): -7/3 <= x <= 3."}, {"question": "Solve for x: |3x + -2| <= 3", "choices": ["-1 <= x <= 5", "x <= 5/3", "-1/3 >= x >= 5/3", "-1/3 <= x <= 5/3"], "correctIndex": 3, "explanation": "-3 <= 3x + -2 <= 3, so -1 <= 3x <= 5. Dividing by 3 (positive, no flip needed): -1/3 <= x <= 5/3."}, {"question": "Solve for x: |-2x + -1| <= 9", "choices": ["-5 <= x <= 4", "-8 <= x <= 10", "x <= 4", "-5 >= x >= 4"], "correctIndex": 0, "explanation": "-9 <= -2x + -1 <= 9, so -8 <= -2x <= 10. Dividing by -2 flips both inequality signs since it is negative: -5 <= x <= 4."}, {"question": "Solve for x: |2x + 4| <= 4", "choices": ["-4 <= x <= 0", "-8 <= x <= 0", "x <= 0", "-4 >= x >= 0"], "correctIndex": 0, "explanation": "-4 <= 2x + 4 <= 4, so -8 <= 2x <= 0. Dividing by 2 (positive, no flip needed): -4 <= x <= 0."}, {"question": "Solve for x: |2x + -1| <= 9", "choices": ["-4 >= x >= 5", "x <= 5", "-4 <= x <= 5", "-8 <= x <= 10"], "correctIndex": 2, "explanation": "-9 <= 2x + -1 <= 9, so -8 <= 2x <= 10. Dividing by 2 (positive, no flip needed): -4 <= x <= 5."}]}, "prob_single_event": {"name": "Single-Event Probability", "lesson": "**Single-event probability: Direct vs. Complement**\n\nEvery single-event probability question can be solved one of two ways:\n\n**Direct** -- just count favorable outcomes over total outcomes. This is\nthe default approach whenever nothing suggests flipping to the opposite.\nP(event) = favorable outcomes / total outcomes\n\n**Complement** -- used when the OPPOSITE event is easier to count than the\nevent itself. Especially powerful for \"at least one\" problems: directly\ncounting \"at least one success\" means adding several cases (exactly 1,\nexactly 2, exactly 3...), but counting the single case of \"zero successes\"\nis much faster.\nP(event) = 1 - P(opposite event)\n\nThe tell for when to reach for Complement over Direct: if the direct count\nof favorable outcomes would require adding up multiple separate cases, but\nthe count of the OPPOSITE outcome is a single clean case -- that's your\nsignal to flip it. Trigger words: \"not,\" \"at least one,\" \"no more than.\"\n\n\n**Advanced: odds vs. probability**\n\nOdds and probability are NOT the same number, even though they're often\nconfused. Probability compares favorable outcomes to ALL outcomes. Odds\nIN FAVOR compare favorable outcomes to UNFAVORABLE outcomes only.\n\nIf P(event) = a/b, then P(not event) = (b-a)/b, and:\nodds in favor = a to (b-a)  [equivalently, the fraction a/(b-a)]\n\nExample: P(event) = 1/9. Then P(not event) = 8/9, so the odds in favor\nare 1 to 8 -- NOT \"1 to 9.\" Don't just flip the denominator; find the\ncomplement first, then compare favorable to unfavorable.\n", "flashcards": [{"front": "Single-event probability splits into which two approaches?", "back": "Direct (favorable/total) and Complement (1 - P(opposite))."}, {"front": "Formula for Direct probability?", "back": "P(event) = favorable outcomes / total outcomes."}, {"front": "Formula for Complement probability?", "back": "P(event) = 1 - P(opposite event)."}, {"front": "What should \"at least one\" trigger in your head?", "back": "Complement: compute 1 - P(none), rather than adding up P(exactly 1) + P(exactly 2) + ..."}, {"front": "The tell for choosing Complement over Direct?", "back": "If counting the favorable outcomes directly means adding several cases, but counting the OPPOSITE outcome is one clean case."}, {"front": "How do odds in favor differ from probability?", "back": "Probability compares favorable to ALL outcomes. Odds compare favorable to UNFAVORABLE only. If P = a/b, odds in favor = a to (b-a), not a to b."}], "bank": [{"question": "A box contains 25 tickets numbered 1 through 25. What is the probability of drawing a ticket with a number less than or equal to 7?", "choices": ["18/25", "7/24", "8/25", "7/25"], "correctIndex": 3, "explanation": "Direct approach: favorable (7) over total (25) = 7/25. No flipping needed -- just count and divide."}, {"question": "A jar has 21 red and 5 blue marbles. What is the probability of drawing a red marble?", "choices": ["11/13", "21/25", "21/26", "5/26"], "correctIndex": 2, "explanation": "Direct approach: favorable (21) over total (26) = 21/26. No flipping needed -- just count and divide."}, {"question": "A jar has 16 red and 12 blue marbles. What is the probability of drawing a red marble?", "choices": ["16/27", "17/28", "4/7", "3/7"], "correctIndex": 2, "explanation": "Direct approach: favorable (16) over total (28) = 4/7. No flipping needed -- just count and divide."}, {"question": "A jar has 12 red and 4 blue marbles. What is the probability of drawing a red marble?", "choices": ["13/16", "3/4", "4/5", "1/4"], "correctIndex": 1, "explanation": "Direct approach: favorable (12) over total (16) = 3/4. No flipping needed -- just count and divide."}, {"question": "A jar has 4 red and 23 blue marbles. What is the probability of drawing a red marble?", "choices": ["23/27", "5/27", "2/13", "4/27"], "correctIndex": 3, "explanation": "Direct approach: favorable (4) over total (27) = 4/27. No flipping needed -- just count and divide."}, {"question": "A jar has 16 red and 8 blue marbles. What is the probability of drawing a red marble?", "choices": ["17/24", "1/3", "16/23", "2/3"], "correctIndex": 3, "explanation": "Direct approach: favorable (16) over total (24) = 2/3. No flipping needed -- just count and divide."}, {"question": "A deck has 20 cards, 4 of which are face cards. What is the probability of drawing a face card?", "choices": ["4/19", "1/5", "1/4", "4/5"], "correctIndex": 1, "explanation": "Direct approach: favorable (4) over total (20) = 1/5. No flipping needed -- just count and divide."}, {"question": "A jar has 12 red and 5 blue marbles. What is the probability of drawing a red marble?", "choices": ["12/17", "3/4", "13/17", "5/17"], "correctIndex": 0, "explanation": "Direct approach: favorable (12) over total (17) = 12/17. No flipping needed -- just count and divide."}, {"question": "A deck has 25 cards, 17 of which are face cards. What is the probability of drawing a face card?", "choices": ["17/25", "17/24", "8/25", "18/25"], "correctIndex": 0, "explanation": "Direct approach: favorable (17) over total (25) = 17/25. No flipping needed -- just count and divide."}, {"question": "A deck has 22 cards, 8 of which are face cards. What is the probability of drawing a face card?", "choices": ["8/21", "9/22", "4/11", "7/11"], "correctIndex": 2, "explanation": "Direct approach: favorable (8) over total (22) = 4/11. No flipping needed -- just count and divide."}, {"question": "A bag has 15 items, 4 of which are defective. You draw 3, with replacement (each item put back before the next draw). What is the probability of getting at least one defective item?", "choices": ["4/5", "1331/3375", "4/15", "2044/3375"], "correctIndex": 3, "explanation": "\"At least one\" signals Complement. P(none) = 1331/3375, so P(at least one) = 1 - 1331/3375 = 2044/3375."}, {"question": "A bag has 10 items, 4 of which are defective. You draw 2, with replacement (each item put back before the next draw). What is the e) = 1 - 5/14 = 9/14."}, {"question": "A bag has 13 items, 2 of which are defective. You draw 2, without replacement. What is the probability of getting at least one defective item?", "choices": ["2/13", "23/78", "4/13", "55/78"], "correctIndex": 1, "explanation": "\"At least one\" signals Complement. P(none) = 55/78, so P(at least one) = 1 - 55/78 = 23/78."}, {"question": "A bag has 13 items, 2 of which are defective. You draw 2, without replacement. What is the probability of getting at least one defective item?", "choices": ["4/13", "55/78", "23/78", "2/13"], "correctIndex": 2, "explanation": "\"At least one\" signals Complement. P(none) = 55/78, so P(at least one) = 1 - 55/78 = 23/78."}, {"question": "The probability of an event occurring is 1/9. What are the odds in favor of the event occurring?", "choices": ["1/9", "8 to 1", "1 to 9", "1 to 8"], "correctIndex": 3, "explanation": "P(event) = 1/9, so P(not event) = 8/9. Odds in favor compare favorable to UNFAVORABLE: 1 to 8. (A common mistake is writing \"1 to 9\" -- that's just restating the probability's numerator and denominator, not the odds.)"}, {"question": "The probability of an event occurring is 2/7. What are the odds in favor of the event occurring?", "choices": ["5 to 2", "2 to 7", "2/7", "2 to 5"], "correctIndex": 3, "explanation": "P(event) = 2/7, so P(not event) = 5/7. Odds in favor compare favorable to UNFAVORABLE: 2 to 5. (A common mistake is writing \"2 to 7\" -- that's just restating the probability's numerator and denominator, not the odds.)"}, {"question": "The probability of an event occurring is 3/8. What are the odds in favor of the event occurring?", "choices": ["5 to 3", "3 to 8", "3 to 5", "3/8"], "correctIndex": 2, "explanation": "P(event) = 3/8, so P(not event) = 5/8. Odds in favor compare favorable to UNFAVORABLE: 3 to 5. (A common mistake is writing \"3 to 8\" -- that's just restating the probability's numerator and denominator, not the odds.)"}, {"question": "The probability of an  double-counted overlap:\nP(A or B) = P(A) + P(B) - P(A and B).\n\nThe tell for AND vs. OR: AND problems shrink the probability (it's harder\nfor everything to happen). OR problems grow it (it's easier for at least\none named thing to happen). If an OR answer comes out smaller than either\nindividual probability, something's wrong.\n", "flashcards": [{"front": "Compound AND: what operation, and when do you use it?", "back": "Multiply. Use it when all named events must happen (\"and,\" \"both,\" \"all\")."}, {"front": "Compound OR: what operation, and when do you use it?", "back": "Add. Use it when any named event happening counts (\"or,\" \"either\")."}, {"front": "With replacement: does the denominator change between draws?", "back": "No -- it stays the same every draw."}, {"front": "Without replacement: what happens to the denominator each draw?", "back": "It shrinks by 1 each draw (and the numerator shrinks too if a success was removed)."}, {"front": "When do you need to subtract an overlap in an OR problem?", "back": "When the two events aren't mutually exclusive -- something counted in both groups got double-counted."}, {"front": "Quick sanity check for AND vs OR answers?", "back": "AND shrinks the probability (harder for everything to happen); OR grows it (easier for at least one to happen)."}], "bank": [{"question": "A bag has 4 red and 6 blue marbles (10 total). You draw two marbles, with replacement (the first marble IS put back before the second draw). What is the probability both are red?", "choices": ["2/15", "4/5", "4/25", "2/5"], "correctIndex": 2, "explanation": "AND -> multiply. First draw: P(red) = 2/5. Second draw: P(red) = 2/5 (pool resets since the marble was replaced). 2/5 x 2/5 = 4/25."}, {"question": "A bag has 5 red and 5 blue marbles (10 total). You draw two marbles, with replacement (the first marble IS put back before the second draw). What is the probability both are red?", "choices": ["1", "1/4", "2/9", "1/2"], "correctIndex": 1, "explan h overlapping categories -> inclusion-exclusion. Multiples of 2: 23. Multiples of 5: 9. Multiples of both (LCM 10): 4, double-counted. (23 + 9 - 4) / 46 = 28/46 = 14/23."}, {"question": "Slips numbered 1 to 35 are in a bag. What is the probability of drawing a multiple of 5 or a multiple of 2?", "choices": ["3/5", "3/35", "1/5", "24/35"], "correctIndex": 0, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 5: 7. Multiples of 2: 17. Multiples of both (LCM 10): 3, double-counted. (7 + 17 - 3) / 35 = 21/35 = 3/5."}, {"question": "Slips numbered 1 to 27 are in a bag. What is the probability of drawing a multiple of 3 or a multiple of 5?", "choices": ["1/3", "13/27", "1/27", "14/27"], "correctIndex": 1, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 3: 9. Multiples of 5: 5. Multiples of both (LCM 15): 1, double-counted. (9 + 5 - 1) / 27 = 13/27 = 13/27."}, {"question": "Slips numbered 1 to 49 are in a bag. What is the probability of drawing a multiple of 3 or a multiple of 2?", "choices": ["16/49", "32/49", "40/49", "8/49"], "correctIndex": 1, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 3: 16. Multiples of 2: 24. Multiples of both (LCM 6): 8, double-counted. (16 + 24 - 8) / 49 = 32/49 = 32/49."}, {"question": "Slips numbered 1 to 34 are in a bag. What is the probability of drawing a multiple of 3 or a multiple of 7?", "choices": ["7/17", "11/34", "15/34", "1/34"], "correctIndex": 0, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 3: 11. Multiples of 7: 4. Multiples of both (LCM 21): 1, double-counted. (11 + 4 - 1) / 34 = 14/34 = 7/17."}, {"question": "Slips numbered 1 to 32 are in a bag. What is the probability of drawing a multiple of 4 or a multiple of 6?", "choices": ["1/16", "13/32", "1/4", "11/32"], "correctIndex": 3, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 4: 8. Multiples of 6: 5. Multiples of both (LCM 12): 2, double-counted. (8 + 5 - 2) / 32 = 11/32 = 11/32."}, {"question": "Slips numbered 1 to 21 are in a bag. What is the probability of drawing a multiple of 4 or a multiple of 7?", "choices": ["5/21", "8/21", "0", "29/21"], "correctIndex": 1, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 4: 5. Multiples of 7: 3. Multiples of both (LCM 28): 0, double-counted. (5 + 3 - 0) / 21 = 8/21 = 8/21."}, {"question": "Slips numbered 1 to 44 are in a bag. What is the probability of drawing a multiple of 4 or a multiple of 6?", "choices": ["9/22", "1/4", "3/44", "15/44"], "correctIndex": 3, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 4: 11. Multiples of 6: 7. Multiples of both (LCM 12): 3, double-counted. (11 + 7 - 3) / 44 = 15/44 = 15/44."}, {"question": "Slips numbered 1 to 26 are in a bag. What is the probability of drawing a multiple of 2 or a multiple of 5?", "choices": ["9/13", "1/13", "8/13", "1/2"], "correctIndex": 2, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 2: 13. Multiples of 5: 5. Multiples of both (LCM 10): 2, double-counted. (13 + 5 - 2) / 26 = 16/26 = 8/13."}, {"question": "Slips numbered 1 to 37 are in a bag. What is the probability of drawing a multiple of 3 or a multiple of 7?", "choices": ["1/37", "16/37", "17/37", "12/37"], "correctIndex": 1, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 3: 12. Multiples of 7: 5. Multiples of both (LCM 21): 1, double-counted. (12 + 5 - 1) / 37 = 16/37 = 16/37."}, {"question": "Slips numbered 1 to 54 are in a bag. What is the probability of drawing a multiple of 5 or a multiple of 4?", "choices": ["5/27", "1/27", "23/54", "7/18"], "correctIndex": 3, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 5: 10. Multiples of 4: 13. Multiples of both (LCM 20): 2, double-counted. (10 + 13 - 2) / 54 = 21/54 = 7/18."}, {"question": "Slips numbered 1 to 31 are in a bag. What is the probability of drawing a multiple of 5 or a multiple of 2?", "choices": ["21/31", "3/31", "18/31", "6/31"], "correctIndex": 2, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 5: 6. Multiples of 2: 15. Multiples of both (LCM 10): 3, double-counted. (6 + 15 - 3) / 31 = 18/31 = 18/31."}, {"question": "During an experiment, events A and B are mutually exclusive. Which probability must be 0?", "choices": ["P(A)", "P(A or B)", "P(A and B)", "P(B)"], "correctIndex": 2, "explanation": "Mutually exclusive events can never happen together, so P(A and B) is always 0 -- that's exactly the definition of mutually exclusive."}]}, "exponent_rules": {"name": "Exponent Rules", "lesson": "**Exponent rules**\n\nProduct rule: x^a * x^b = x^(a+b)  (same base, multiplying -> add exponents)\nQuotient rule: x^a / x^b = x^(a-b)  (same base, dividing -> subtract exponents)\nPower of a power: (x^a)^b = x^(a*b)  (raising a power to a power -> multiply exponents)\nPower of a product: (xy)^a = x^a * y^a\n\nZero exponent: x^0 = 1, for any nonzero x. This trips people up because it feels\nlike it should be 0 -- it isn't. Anything (except 0) to the zero power is 1.\n\nNegative exponent: x^(-a) = 1/x^a. A negative exponent means \"take the\nreciprocal,\" not \"make the answer negative.\" x^(-2) is 1/x^2, a positive\nnumber, not -x^2.\n\nFractional (rational) exponent: x^(1/n) means the nth root of x.\nx^(m/n) means the nth root of x, raised to the m power (or equivalently,\nthe nth root of x^m -- both give the same answer).\nExample: 8^(2/3) = (cube root of 8)^2 = 2^2 = 4.\n\n\n**Advanced: equations with the variable in the exponent**\n\nWhen two sides of an equation have different bases, first rewrite both\nsides using a common base, THEN set the exponents equal to each other.\nExample: 4^(x+1) = 8^(x-2). Since 4 = 2^2 and 8 = 2^3, rewrite as\n2^(2(x+1)) = 2^(3(x-2)), so 2(x+1) = 3(x-2). Solve that normal linear\nequation for x.\n\n**Advanced: rational exponent equations**\n\nx^(m/n) = k solves the same way as any exponent equation -- raise both\nsides to the reciprocal power (n/m): x = k^(n/m).\n\n\n**Advanced: adding fractional exponents with different denominators**\n\nx^a * x^b = x^(a+b) still applies when a and b are fractions -- just add\nthem using regular fraction addition (find a common denominator first).\n\n\n**Advanced: common-base equations that resolve to a quadratic**\n\nThe same \"match the base, then set exponents equal\" technique sometimes\nproduces a QUADRATIC equation instead of a linear one (when one side has\nan n^2 term) -- solve the resulting quadratic normally afterward.\n", "flashcards": [{"front": "Product rule: x^a * x^b = ?", "back": "x^(a+b) -- same base, multiplying means add the exponents."}, {"front": "Quotient rule: x^a / x^b = ?", "back": "x^(a-b) -- same base, dividing means subtract the exponents."}, {"front": "Power of a power: (x^a)^b = ?", "back": "x^(a*b) -- multiply the exponents."}, {"front": "What is x^0 (for x != 0)?", "back": "1. Any nonzero base to the zero power is 1 -- not 0."}, {"front": "What does a negative exponent mean? x^(-a) = ?", "back": "1/x^a -- take the reciprocal. It does NOT make the result negative."}, {"front": "What does a fractional exponent mean? x^(1/n) = ?", "back": "The nth root of x. And x^(m/n) = (nth root of x) raised to the m power."}, {"front": "Evaluate 8^(2/3) step by step.", "back": "Take the cube root of 8 first (=2), then square it: 2^2 = 4."}, {"front": "Two sides of an exponent equation have different bases -- what's the first move?", "back": "Rewrite both sides using a shared common base, THEN set the exponents equal."}, {"front": "How do you solve x^(m/n) = k for x?", "back": "Raise both sides to the reciprocal power: x = k^(n/m)."}, {"front": "How do you simplify x^(1/4) * x^(1/6)?", "back": "Add the exponents using fraction addition: 1/4 + 1/6 = 3/12 + 2/12 = 5/12. Result: x^(5/12)."}, {"front": "What do you do if matching bases in an exponent equation leaves an n^2 term?", "back": "You get a quadratic equation -- solve it normally (factor or use the quadratic formula) after matching the bases."}], "bank": [{"question": "Simplify: (x^3)^7", "choices": ["x^12", "x^10", "x^24", "x^21"], "correctIndex": 3, "explanation": "Power of a power -> multiply exponents: 3 * 7 = 21. Result: x^21."}, {"question": "Simplify: x^9 * x^9", "choices": ["x^81", "x^19", "x^0", "x^18"], "correctIndex": 3, "explanation": "Same base, multiplying -> add exponents: 9 + 9 = 18. Result: x^18."}, {"question": "Simplify: x^3 * x^6", "choices": ["x^3", "x^18", "x^9", "x^10"], "correctIndex": 2, "explanation": "Same base, multiplying -> add exponents: 3 + 6 = 9. Result: x^9."}, {"question": "Simplify: x^10 / x^5", "choices": ["x^5", "x^6", "x^50", "x^15"], "correctIndex": 0, "explanation": "Same base, dividing -> subtract exponents: 10 - 5 = 5. Result: x^5."}, {"question": "Simplify: (x^8)^3", "choices": ["x^32", "x^11", "x^24", "x^13"], "correctIndex": 2, "explanation": "Power of a power -> multiply exponents: 8 * 3 = 24. Result: x^24."}, {"question": "Simplify: x^6 * x^9", "choices": ["x^16", "x^54", "x^15", "x^3"], "correctIndex": 2, "explanation": "Same base, multiplying -> add exponents: 6 + 9 = 15. Result: x^15."}, {"question": "What is 48^0?", "choices": ["0", "1", "48", "-1"], "correctIndex": 1, "explanation": "Any nonzero number to the zero power is 1 -- this is true regardless of what 48 is."}, {"question": "What is 53^0?", "choices": ["0", "53", "1", "-1"], "correctIndex": 2, "explanation": "Any nonzero number to the zero power is 1 -- this is true regardless of what 53 is."}, {"question": "What is 66^0?", "choices": ["1", "0", "66", "-1"], "correctIndex": 0, "explanation": "Any nonzero number to the zero power is 1 -- this is true regardless of what 66 is."}, {"question": "What is 5^(-4)?", "choices": ["-625", "1/625", "625", "1/125"], "correctIndex": 1, "explanation": "A negative exponent means reciprocal, not negative: 5^(-4) = 1/5^4 = 1/625 = 1/625."}, {"question": "What is 10^(-2)?", "choices": ["1/10", "100", "1/100", "-100"], "correctIndex": 2, "explanation": "A negative exponent means reciprocal, not negative: 10^(-2) = 1/10^2 = 1/100 = 1/100."}, {"question": "What is 10^(-3)?", "choices": ["1000", "-1000", "1/1000", "1/100"], "correctIndex": 2, "explanation": "A negative exponent means reciprocal, not negative: 10^(-3) = 1/10^3 = 1/1000 = 1/1000."}, {"question": "What is 3^(-2)?", "choices": ["1/9", "-9", "9", "1/3"], "correctIndex": 0, "explanation": "A negative exponent means reciprocal, not negative: 3^(-2) = 1/3^2 = 1/9 = 1/9."}, {"question": "What is 10^(-3)?", "choices": ["1/1000", "-1000", "1000", "1/100"], "correctIndex": 0, "explanation": "A negative exponent means reciprocal, not negative: 10^(-3) = 1/10^3 = 1/1000 = 1/1000."}, {"question": "What is 10^(-4)?", "choices": ["1/10000", "10000", "-10000", "1/1000"], "correctIndex": 0, "explanation": "A negative exponent means reciprocal, not negative: 10^(-4) = 1/10^4 = 1/10000 = 1/10000."}, {"question": "What is 4^(1/2)?", "choices": ["0", "2", "4", "3"], "correctIndex": 1, "explanation": "4^(1/2) means the 2-th root of 4, which is 2."}, {"question": "What is 8^(1/3)?", "choices": ["2", "3", "4", "8"], "correctIndex": 0, "explanation": "8^(1/3) means the 3-th root of 8, which is 2."}, {"question": "What is 9^(2/2)?", "choices": ["4", "18", "9", "3"], "correctIndex": 2, "explanation": "9^(1/2) means the 2-th root of 9, which is 3. Then raise that to the 2 power: 3^2 = 9."}, {"question": "What is 16^(2/2)?", "choices": ["16", "32", "4", "8"], "correctIndex": 0, "explanation": "16^(1/2) means the 2-th root of 16, which is 4. Then raise that to the 2 power: 4^2 = 16."}, {"question": "What is 16^(2/4)?", "choices": ["5", "2", "32", "4"], "correctIndex": 3, "explanation": "16^(1/4) means the 4-th root of 16, which is 2. Then raise that to the 2 power: 2^2 = 4."}, {"question": "What is 25^(2/2)?", "choices": ["12", "5", "50", "25"], "correctIndex": 3, "explanation": "25^(1/2) means the 2-th root of 25, which is 5. Then raise that to the 2 power: 5^2 = 25."}, {"question": "What is 27^(2/3)?", "choices": ["9", "3", "10", "54"], "correctIndex": 0, "explanation": "27^(1/3) means the 3-th root of 27, which is 3. Then raise that to the 2 power: 3^2 = 9."}, {"question": "What is 32^(1/5)?", "choices": ["2", "6", "32", "4"], "correctIndex": 0, "explanation": "32^(1/5) means the 5-th root of 32, which is 2."}, {"question": "Solve for x: 4^(x + 2) = 8^(x - 2)", "choices": ["11", "-10", "-4", "10"], "correctIndex": 3, "explanation": "Rewrite both sides with base 2: 4 = 2^2, 8 = 2^3. So 2(x + 2) = 3(x - 2). Solving that linear equation gives x = 10."}, {"question": "Solve for x: 9^(x + 2) = 27^(x + 1)", "choices": ["2", "-4", "1", "-1"], "correctIndex": 2, "explanation": "Rewrite both sides with base 3: 9 = 3^2, 27 = 3^3. So 2(x + 2) = 3(x + 1). Solving that linear equation gives x = 1."}, {"question": "Solve for x: 25^(x - 4) = 125^(x + 3)", "choices": ["7", "17", "-17", "18"], "correctIndex": 2, "explanation": "Rewrite both sides with base 5: 25 = 5^2, 125 = 5^3. So 2(x - 4) = 3(x + 3). Solving that linear equation gives x = -17."}, {"question": "Solve for x: 16^(x - 3) = 64^(x - 4)", "choices": ["-6", "6", "-1", "1"], "correctIndex": 1, "explanation": "Rewrite both sides with base 2: 16 = 2^4, 64 = 2^6. So 4(x - 3) = 6(x - 4). Solving that linear equation gives x = 6."}, {"question": "Solve for x: 8^(x - 2) = 32^(x + 1)", "choices": ["13/2", "3", "11/2", "-11/2"], "correctIndex": 3, "explanation": "Rewrite both sides with base 2: 8 = 2^3, 32 = 2^5. So 3(x - 2) = 5(x + 1). Solving that linear equation gives x = -11/2."}, {"question": "Solve for x: 9^(x - 1) = 81^(x + 3)", "choices": ["7", "4", "5", "-7"], "correctIndex": 3, "explanation": "Rewrite both sides with base 3: 9 = 3^2, 81 = 3^4. So 2(x - 1) = 4(x + 3). Solving that linear equation gives x = -7."}, {"question": "Solve for x: 27^(x - 4) = 81^(x + 1)", "choices": ["-16", "16", "5", "19"], "correctIndex": 0, "explanation": "Rewrite both sides with base 3: 27 = 3^3, 81 = 3^4. So 3(x - 4) = 4(x + 1). Solving that linear equation gives x = -16."}, {"question": "Solve for x: x^(3/2) = 8", "choices": ["6", "8", "9", "4"], "correctIndex": 3, "explanation": "Raise both sides to the reciprocal power, 2/3: x = 8^(2/3) = 4."}, {"question": "Solve for x: x^(2/3) = 25", "choices": ["25", "128", "125", "26"], "correctIndex": 2, "explanation": "Raise both sides to the reciprocal power, 3/2: x = 25^(3/2) = 125."}, {"question": "Solve for x: x^(2/4) = 4", "choices": ["16", "20", "2", "8"], "correctIndex": 0, "explanation": "Raise both sides to the reciprocal power, 4/2: x = 4^(4/2) = 16."}, {"question": "Solve for x: x^(3/2) = 125", "choices": ["126", "125", "27", "25"], "correctIndex": 3, "explanation": "Raise both sides to the reciprocal power, 2/3: x = 125^(2/3) = 25."}, {"question": "Solve for x: x^(3/2) = 64", "choices": ["16", "512", "65", "18"], "correctIndex": 0, "explanation": "Raise both sides to the reciprocal power, 2/3: x = 64^(2/3) = 16."}, {"question": "Solve for x: x^(3/2) = 27", "choices": ["18", "27", "9", "11"], "correctIndex": 2, "explanation": "Raise both sides to the reciprocal power, 2/3: x = 27^(2/3) = 9."}, {"question": "Simplify: (x^-3 * x^-5) / x^3", "choices": ["x^-11", "x^-1", "x^-5", "x^-8"], "correctIndex": 0, "explanation": "Combine the numerator first (add exponents): -3 + -5 = -8. Then subtract the denominator's exponent: -8 - (3) = -11. Result: x^-11."}, {"question": "Simplify: (x^-3 * x^-3) / x^-1", "choices": ["x^-5", "x^-6", "x^1", "x^-7"], "correctIndex": 0, "explanation": "Combine the numerator first (add exponents): -3 + -3 = -6. Then subtract the denominator's exponent: -6 - (-1) = -5. Result: x^-5."}, {"question": "Simplify: (x^-5 * x^-2) / x^6", "choices": ["x^-1", "x^-7", "x^-9", "x^-13"], "correctIndex": 3, "explanation": "Combine the numerator first (add exponents): -5 + -2 = -7. Then subtract the denominator's exponent: -7 - (6) = -13. Result: x^-13."}, {"question": "Simplify: (x^5 * x^-6) / x^5", "choices": ["x^4", "x^-6", "x^6", "x^-1"], "correctIndex": 1, "explanation": "Combine the numerator first (add exponents): 5 + -6 = -1. Then subtract the denominator's exponent: -1 - (5) = -6. Result: x^-6."}, {"question": "Simplify: (x^6 * x^-2) / x^5", "choices": ["x^3", "x^-1", "x^9", "x^4"], "correctIndex": 1, "explanation": "Combine the numerator first (add exponents): 6 + -2 = 4. Then subtract the denominator's exponent: 4 - (5) = -1. Result: x^-1."}, {"question": "Simplify: (x^0 * x^-1) / x^-3", "choices": ["x^4", "x^2", "x^-1", "x^-4"], "correctIndex": 1, "explanation": "Combine the numerator first (add exponents): 0 + -1 = -1. Then subtract the denominator's exponent: -1 - (-3) = 2. Result: x^2."}, {"question": "For all positive integers x, which expression is equivalent to x^(1/4) * x^(1/6)?", "choices": ["x^(5/12)", "x^(2/10)", "x^(1/24)", "x^(1/12)"], "correctIndex": 0, "explanation": "Multiplying same-base powers means adding exponents: 1/4 + 1/6 = 5/12. Result: x^(5/12)."}, {"question": "For all positive integers x, which expression is equivalent to x^(1/3) * x^(1/5)?", "choices": ["x^(8/15)", "x^(2/15)", "x^(1/15)", "x^(2/8)"], "correctIndex": 0, "explanation": "Multiplying same-base powers means adding exponents: 1/3 + 1/5 = 8/15. Result: x^(8/15)."}, {"question": "For all positive integers x, which expression is equivalent to x^(2/3) * x^(1/4)?", "choices": ["x^(11/12)", "x^(5/12)", "x^(1/6)", "x^(3/7)"], "correctIndex": 0, "explanation": "Multiplying same-base powers means adding exponents: 2/3 + 1/4 = 11/12. Result: x^(11/12)."}, {"question": "For all positive integers x, which expression is equivalent to x^(1/2) * x^(1/5)?", "choices": ["x^(2/7)", "x^(3/10)", "x^(7/10)", "x^(1/10)"], "correctIndex": 2, "explanation": "Multiplying same-base powers means
