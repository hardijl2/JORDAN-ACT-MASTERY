hoices": ["NO CHANGE", "a leather-bound volume filled with decades of weather notes", "this being a leather-bound volume filled with decades of weather notes", "which was a leather-bound volume filled with decades of weather notes"], "correctIndex": 1, "explanation": "A bare noun phrase attaches correctly with just a comma. NO CHANGE and \"this being...\" both sneak in a hidden verb/clause, creating a comma splice. \"Which was\" turns it into an unnecessary relative clause."}, {"question": "The abandoned mill, __it stood as the town's tallest structure for nearly a century__, was finally demolished last spring.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "the town's tallest structure for nearly a century", "and it stood as the town's tallest structure for nearly a century", "standing as the town's tallest structure for nearly a century, it was"], "correctIndex": 1, "explanation": "A bare noun phrase appositive attaches with one comma. NO CHANGE sneaks in \"it stood,\" creating a splice. \"And it stood\" still has two full clauses. The last option is needlessly wordy and restructures awkwardly."}, {"question": "Her grandmother's recipe box, __it contains handwritten cards passed down through four generations__, remains her most treasured possession.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "handwritten cards passed down through four generations", "and it contains handwritten cards passed down through four generations", "there are handwritten cards passed down through four generations inside it"], "correctIndex": 1, "explanation": "The bare noun phrase attaches correctly. NO CHANGE and both distractors keep a hidden verb (\"it contains,\" \"there are\"), each creating a comma splice."}, {"question": "The observatory's main instrument, __it is a century-old refracting telescope still used for public viewings__, draws visitors from across the region.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "a century-old refracting telescope still used for public viewings", "this is a century-old refracting telescope still used for public viewings", "being a century-old refracting telescope still used for public viewings, it"], "correctIndex": 1, "explanation": "A bare noun phrase is the only option without a hidden verb creating a splice."}, {"question": "The city's oldest bridge, __it was originally built to carry horse-drawn carriages__, now supports only pedestrian traffic.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "originally built to carry horse-drawn carriages", "and it was originally built to carry horse-drawn carriages", "originally, it was built to carry horse-drawn carriages"], "correctIndex": 1, "explanation": "The participial phrase \"originally built to carry horse-drawn carriages\" attaches correctly with one comma, no hidden verb. The others all keep a full second clause."}, {"question": "The manuscript's final chapter, __it remained unfinished at the time of the author's death__, was later completed by her daughter.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "unfinished at the time of the author's death", "and it remained unfinished at the time of the author's death", "remaining unfinished, it was at the time of the author's death"], "correctIndex": 1, "explanation": "The bare adjective phrase attaches correctly. The others all retain a second verb, creating a splice."}, {"question": "The volcano's last major eruption, __it occurred more than four hundred years before written records began__, reshaped the entire coastline.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "more than four hundred years before written records began", "and it occurred more than four hundred years before written records began", "occurring, it was more than four hundred years before written records began"], "correctIndex": 1, "explanation": "The bare phrase attaches with one comma. Every other option keeps a hidden verb, creating a splice."}, {"question": "The festival's headline act, __this is a band that formed over a decade ago__, has sold out every show on the tour.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "a band that formed over a decade ago", "which is a band that formed over a decade ago", "it's a band that formed over a decade ago"], "correctIndex": 1, "explanation": "The bare noun phrase is both grammatically correct (no splice) and least redundant. NO CHANGE, \"which is,\" and \"it's\" all add unnecessary words while also creating a splice or an awkward relative clause."}, {"question": "The company's flagship product, __it is a compact device that fits in any pocket__, revolutionized the industry within two years.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "a compact device that fits in any pocket", "which happens to be a compact device that fits in any pocket", "being a compact device, it fits in any pocket"], "correctIndex": 1, "explanation": "The bare phrase is the most concise and grammatically clean option -- no splice, no filler words."}, {"question": "Her debut novel, __it turned out to be a sprawling family saga spanning three continents__, took nearly a decade to write.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "a sprawling family saga spanning three continents", "which turned out to be a sprawling family saga spanning three continents", "turning out to be, it was a sprawling family saga spanning three continents"], "correctIndex": 1, "explanation": "The bare noun phrase is both grammatically correct and the least redundant -- \"it turned out to be\" and \"which turned out to be\" add unnecessary words on top of creating structural problems."}, {"question": "The city's new transit line, __this is a fully electric system connecting six neighborhoods__, opens to the public next month.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "a fully electric system connecting six neighborhoods", "which is a fully electric system connecting six neighborhoods", "it is a fully electric system connecting six neighborhoods"], "correctIndex": 1, "explanation": "The bare phrase avoids both the comma splice and the redundant \"this is\"/\"it is\"/\"which is\" filler."}, {"question": "The chef's signature dish, __it happens to be a slow-braised stew passed down from her grandmother__, appears on every seasonal menu.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "a slow-braised stew passed down from her grandmother", "which happens to be a slow-braised stew passed down from her grandmother", "happening to be a slow-braised stew, it was passed down from her grandmother"], "correctIndex": 1, "explanation": "The bare phrase is both grammatically clean and free of redundant filler like \"happens to be.\""}, {"question": "The museum's newest wing, __it is essentially a glass atrium designed to flood the galleries with natural light__, opened to critical acclaim.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "a glass atrium designed to flood the galleries with natural light", "which is essentially a glass atrium designed to flood the galleries with natural light", "essentially, it is a glass atrium designed to flood the galleries with natural light"], "correctIndex": 1, "explanation": "The bare phrase is the most concise, correct option -- the others add redundant hedging words on top of structural issues."}, {"question": "The chef's tasting menu features seven courses__,__ soup, fish, poultry, beef, salad, cheese, and dessert--each paired with a different wine.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "--", ";", "OMIT the underlined portion"], "correctIndex": 1, "explanation": "The aside lists seven items separated by commas, so it must be set off by dashes (not commas) to avoid confusion, matching the dash that already closes it. NO CHANGE's comma creates a mismatched pair."}, {"question": "The observatory's dome--a rotating structure weighing nearly forty tons__,__ shields the telescope from wind and rain.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "--", ";", "OMIT the underlined portion"], "correctIndex": 1, "explanation": "The aside opened with a dash after \"dome,\" so it must close with a dash too. NO CHANGE's comma doesn't match the opening punctuation."}, {"question": "The archive holds three types of documents__,__ letters, ledgers, and photographs--each cataloged by decade rather than by subject.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "--", ";", "OMIT the underlined portion"], "correctIndex": 1, "explanation": "The internal list (letters, ledgers, photographs) already uses commas, so the aside itself needs dashes to avoid ambiguity, matching the closing dash."}, {"question": "The garden's centerpiece--a two-hundred-year-old oak tree__,__ shades nearly a third of the property.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "--", ";", "OMIT the underlined portion"], "correctIndex": 1, "explanation": "The aside opened with a dash, so the closing punctuation must also be a dash, not a comma."}, {"question": "The bakery's specialty breads__,__ sourdough, rye, and pumpernickel--sell out within an hour of opening.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["
