 {"question": "A dart is thrown randomly at a square target with a circle inscribed inside it, touching all four sides. What is the probability the dart lands inside the circle?", "choices": ["1/2", "pi/2", "pi/4", "4/pi"], "correctIndex": 2, "explanation": "If the square has side s, the inscribed circle has diameter s (radius s/2). Circle area = pi(s/2)^2 = pi*s^2/4. Square area = s^2. Ratio = pi/4 -- the side length s cancels completely."}, {"question": "A point is chosen randomly within a circular region. A square is inscribed in the circle (all four corners touch the circle). What is the probability the point lands inside the square?", "choices": ["pi/4", "pi/2", "1/4", "2/pi"], "correctIndex": 3, "explanation": "If the circle has radius r, the inscribed square's diagonal equals the circle's diameter (2r), so the square's side is r*sqrt(2) and its area is 2r^2. Circle area = pi*r^2. Ratio = 2r^2/(pi*r^2) = 2/pi."}, {"question": "A point is chosen randomly within a circular region. A square is inscribed in the circle (all four corners touch the circle). What is the probability the point lands inside the square?", "choices": ["1/4", "2/pi", "pi/4", "pi/2"], "correctIndex": 1, "explanation": "If the circle has radius r, the inscribed square's diagonal equals the circle's diameter (2r), so the square's side is r*sqrt(2) and its area is 2r^2. Circle area = pi*r^2. Ratio = 2r^2/(pi*r^2) = 2/pi."}, {"question": "A point is chosen randomly within a circular region. A square is inscribed in the circle (all four corners touch the circle). What is the probability the point lands inside the square?", "choices": ["1/4", "pi/4", "2/pi", "pi/2"], "correctIndex": 2, "explanation": "If the circle has radius r, the inscribed square's diagonal equals the circle's diameter (2r), so the square's side is r*sqrt(2) and its area is 2r^2. Circle area = pi*r^2. Ratio = 2r^2/(pi*r^2) = 2/pi."}, {"question": "A point is chosen randomly within a 7-by-6 rectangular region. A 2-by-4 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["4/21", "17/21", "6/13", "2/7"], "correctIndex": 0, "explanation": "Area-based: favorable area (2x4=8) over total area (7x6=42) = 4/21."}, {"question": "A point is chosen randomly within a 8-by-10 rectangular region. A 2-by-6 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["1/4", "4/9", "3/20", "17/20"], "correctIndex": 2, "explanation": "Area-based: favorable area (2x6=12) over total area (8x10=80) = 3/20."}, {"question": "A point is chosen randomly within a 12-by-4 rectangular region. A 11-by-2 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["11/24", "13/16", "11/12", "13/24"], "correctIndex": 0, "explanation": "Area-based: favorable area (11x2=22) over total area (12x4=48) = 11/24."}, {"question": "A point is chosen randomly within a 12-by-10 rectangular region. A 10-by-7 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["5/12", "17/22", "7/12", "5/6"], "correctIndex": 2, "explanation": "Area-based: favorable area (10x7=70) over total area (12x10=120) = 7/12."}, {"question": "A point is chosen randomly within a 8-by-4 rectangular region. A 7-by-2 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["7/8", "7/16", "3/4", "9/16"], "correctIndex": 1, "explanation": "Area-based: favorable area (7x2=14) over total area (8x4=32) = 7/16."}, {"question": "A point is chosen randomly within a 10-by-9 rectangular region. A 5-by-7 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["7/18", "12/19", "1/2", "11/18"], "correctIndex": 0, "explanation": "Area-based: favorable area (5x7=35) over total area (10x9=90) = 7/18."}, {"question": "A dart lands randomly within a circular target of radius 15. A smaller circle of radius 5 sits at the center. What is the probability the dart lands inside the smaller circle?", "choices": ["1/3", "2/3", "8/9", "1/9"], "correctIndex": 3, "explanation": "Area ratio of two circles: (r_inner/r_outer)^2 = (5/15)^2 = 1/9. The pi cancels out entirely since both areas use it."}, {"question": "A dart lands randomly within a circular target of radius 15. A smaller circle of radius 5 sits at the center. What is the probability the dart lands inside the smaller circle?", "choices": ["1/3", "8/9", "1/9", "2/3"], "correctIndex": 2, "explanation": "Area ratio of two circles: (r_inner/r_outer)^2 = (5/15)^2 = 1/9. The pi cancels out entirely since both areas use it."}, {"question": "A dart lands randomly within a circular target of radius 15. A smaller circle of radius 5 sits at the center. What is the probability the dart lands inside the smaller circle?", "choices": ["8/9", "2/3", "1/9", "1/3"], "correctIndex": 2, "explanation": "Area ratio of two circles: (r_inner/r_outer)^2 = (5/15)^2 = 1/9. The pi cancels out entirely since both areas use it."}, {"question": "A dart lands randomly within a circular target of radius 12. A smaller circle of radius 4 sits at the center. What is the probability the dart lands inside the smaller circle?", "choices": ["8/9", "2/3", "1/9", "1/3"], "correctIndex": 2, "explanation": "Area ratio of two circles: (r_inner/r_outer)^2 = (4/12)^2 = 1/9. The pi cancels out entirely since both areas use it."}]}, "prob_equation_diagnosis": {"name": "Probability: Choose the Equation", "lesson": "**Choosing the right equation**\n\nThis is the same diagnostic skill as before, one level more concrete: instead\nof naming the category, you pick the actual SETUP that solves it. You don't\neven need to compute the final answer -- just recognize which expression\ncorrectly represents the problem.\n\nThis matters because on the real test, picking the right setup is 90% of\nthe battle -- the arithmetic afterward is usually simple. Common wrong\nchoices swap addition for multiplication, forget to flip for a complement,\nforget to subtract an overlap, or use the wrong (unshrunk) denominator for a\nwithout-replacement second draw.\n", "flashcards": [{"front": "Why practice choosing the equation instead of just solving?", "back": "Picking the right setup is the hard part on the real test -- the arithmetic afterward is usually simple."}, {"front": "Most common wrong-equation trap for Complement problems?", "back": "Forgetting the \"1 -\" and just answering with P(the thing you were computing to flip)."}, {"front": "Most common wrong-equation trap for without-replacement AND problems?", "back": "Using the same (unshrunk) denominator for the second draw as the first."}, {"front": "Most common wrong-equation trap for overlapping OR problems?", "back": "Forgetting to subtract the overlap term entirely."}], "bank": [{"question": "A jar has 5 red and 3 blue marbles. Which equation gives the probability of drawing red?", "choices": ["5/8", "8/5", "3/8", "5/3"], "correctIndex": 0, "explanation": "Direct: favorable (5) over total (8)."}, {"question": "A jar has 3 red and 8 blue marbles. Which equation gives the probability of drawing red?", "choices": ["8/11", "3/11", "11/3", "3/8"], "correctIndex": 1, "explanation": "Direct: favorable (3) over total (11)."}, {"question": "A jar has 6 red and 4 blue marbles. Which equation gives the probability of drawing red?", "choices": ["10/6", "4/10", "6/10", "6/4"], "correctIndex": 2, "explanation": "Direct: favorable (6) over total (10)."}, {"question": "A jar has 8 red and 4 blue marbles. Which equation gives the probability of drawing red?", "choices": ["4/12", "8/12", "8/4", "12/8"], "correctIndex": 1, "explanation": "Direct: favorable (8) over total (12)."}, {"question": "A bag has 11 items, 2 defective. You draw 2 with replacement. Which equation gives P(at least one defective)?", "choices": ["2/11", "1-((11-2)/11)*((11-2)/11)", "((11-2)/11)*((11-2)/11)", "(2/11)*(2/11)"], "correctIndex": 1, "explanation": "\"At least one\" -> complement: 1 - P(none). P(none) = ((11-2)/11)*((11-2)/11)."}, {"question": "A bag has 10 items, 2 defective. You draw 2 with replacement. Which equation gives P(at least one defective)?", "choices": ["(2/10)*(2/10)", "1-((10-2)/10)*((10-2)/10)", "((10-2)/10)*((10-2)/10)", "2/10"], "correctIndex": 1, "explanation": "\"At least one\" -> complement: 1 - P(none). P(none) = ((10-2)/10)*((10-2)/10)."}, {"question": "A bag has 13 items, 2 defective. You draw 2 with replacement. Which equation gives P(at least one defective)?", "choices": ["2/13", "1-((13-2)/13)*((13-2)/13)", "(2/13)*(2/13)", "((13-2)/13)*((13-2)/13)"], "correctIndex": 1, "explanation": "\"At least one\" -> complement: 1 - P(none). P(none) = ((13-2)/13)*((13-2)/13)."}, {"question": "A bag has 15 items, 3 defective. You draw 2 with replacement. Which equation gives P(at least one defective)?", "choices": ["3/15", "(3/15)*(3/15)", "((15-3)/15)*((15-3)/15)", "1-((15-3)/15)*((15-3)/15)"], "correctIndex": 3, "explanation": "\"At least one\" -> complement: 1 - P(none). P(none) = ((15-3)/15)*((15-3)/15)."}, {"question": "A coin is flipped and a 4-sided die is rolled. Which equation gives P(heads AND rolling a specific number)?", "choices": ["1/2", "(1/2)*(1/4)", "(1/2)+(1/4)", "1/4"], "correctIndex": 1, "explanation": "Independent events joined by AND -> multiply the individual probabilities."}, {"question": "A coin is flipped and a 8-sided die is rolled. Which equation gives P(heads AND rolling a specific number)?", "choices": ["(1/2)+(1/8)", "1/8", "(1/2)*(1/8)", "1/2"], "correctIndex": 2, "explanation": "Independent events joined by AND -> multiply the individual probabilities."}, {"question": "A coin is flipped and a 8-sided die is rolled. Which equation gives P(heads AND rolling a specific number)?", "choices": ["1/2", "(1/2)+(1/8)", "1/8", "(1/2)*(1/8)"], "correctIndex": 3, "explanation": "Independent events joined by AND -> multiply the individual probabilities."}, {"question": "A bag has 5 red and 5 blue marbles (10 total). Two are drawn WITHOUT replacement. Which equation gives P(both red)?", "choices": ["5/10", "(5/10)+((5-1)/(10-1))", "(5/10)*((5-1)/(10-1))", "(5/10)*(5/10)"], "correctIndex": 2, "explanation": "Without replacement: the pool shrinks. First draw 5/10, second draw (5-1)/(10-1) since one red is gone."}, {"question": "A bag has 3 red and 6 blue marbles (9 total). Two are drawn WITHOUT replacement. Which equation gives P(both red)?", "choices": ["(3/9)+((3-1)/(9-1))", "(3/9)*((3-1)/(9-1))", "(3/9)*(3/9)", "3/9"], "correctIndex": 1, "explanation": "Without replacement: the pool shrinks. First draw 3/9, second draw (3-1)/(9-1) since one red is gone."}, {"question": "A bag has 5 red and 4 blue marbles (9 total). Two are drawn WITHOUT replacement. Which equation gives P(both red)?", "choices": ["(5/9)+((5-1)/(9-1))", "(5/9)*(5/9)", "5/9", "(5/9)*((5-1)/(9-1))"], "correctIndex": 3, "explanation": "Without replacement: the pool shrinks. First draw 5/9, second draw (5-1)/(9-1) since one red is gone."}, {"question": "A bag has 4 red and 6 blue marbles (10 total). Two are drawn WITHOUT replacement. Which equation gives P(both red)?", "choices": ["(4/10)*(4/10)", "(4/10)*((4-1)/(10-1))", "(4/10)+((4-1)/(10-1))", "4/10"], "correctIndex": 1, "explanation": "Without replacement: the pool shrinks. First draw 4/10, second draw (4-1)/(10-1) since one red is gone."}, {"question": "A fair 6-sided die is rolled. Which equation gives P(rolling a 2 or a 5)?", "choices": ["(1/6)*(1/6)", "1/6+1/6+1/6", "1/6", "1/6+1/6"], "correctIndex": 3, "explanation": "Mutually exclusive outcomes joined by OR -> add the individual probabilities."}, {"question": "A fair 6-sided die is rolled. Which equation gives P(rolling a 2 or a 5)?", "choices": ["(1/6)*(1/6)", "1/6+1/6", "1/6+1/6+1/6", "1/6"], "correctIndex": 1, "explanation": "Mutually exclusive outcomes joined by OR -> add the individual probabilities."}, {"question": "A fair 6-sided die is rolled. Which equation gives P(rolling a 2 or a 5)?", "choices": ["1/6+1/6+1/6", "(1/6)*(1/6)", "1/6", "1/6+1/6"], "correctIndex": 3, "explanation": "Mutually exclusive outcomes joined by OR -> add the individual probabilities."}, {"question": "Slips numbered 1 to 36 are in a bag. Which equation gives P(multiple of 2 or multiple of 3)?", "choices": ["(18/36)*(12/36)", "6/36", "(18/36)+(12/36)-(6/36)", "(18/36)+(12/36)"], "correctIndex": 2, "explanation": "Overlapping categories -> inclusion-exclusion: add both, then subtract the double-counted multiples of 6."}, {"question": "Slips numbered 1 to 40 are in a bag. Which equation gives P(multiple of 2 or multiple of 3)?", "choices": ["(20/40)+(13/40)-(6/40)", "6/40", "(20/40)*(13/40)", "(20/40)+(13/40)"], "correctIndex": 0, "explanation": "Overlapping categories -> inclusion-exclusion: add both, then subtract the double-counted multiples of 6."}, {"question": "Slips numbered 1 to 40 are in a bag. Which equation gives P(multiple of 2 or multiple of 3)?", "choices": ["(20/40)*(13/40)", "(20/40)+(13/40)-(6/40)", "6/40", "(20/40)+(13/40)"], "correctIndex": 1, "explanation": "Overlapping categories -> inclusion-exclusion: add both, then subtract the double-counted multiples of 6."}, {"question": "Slips numbered 1 to 48 are in a bag. Which equation gives P(multiple of 2 or multiple of 3)?", "choices": ["(24/48)+(16/48)-(8/48)", "8/48", "(24/48)*(16/48)", "(24/48)+(16/48)"], "correctIndex": 0, "explanation": "Overlapping categories -> inclusion-exclusion: add both, then subtract the double-counted multiples of 6."}, {"question": "A group has 15 juniors and 53 seniors. Given the 1st pick is a junior, which equation gives P(2nd pick is senior)?", "choices": ["52/(68-1)", "53/68", "53/(68-1)", "15/(68-1)"], "correctIndex": 2, "explanation": "The 1st pick removes one junior, shrinking the total pool to 68-1. Seniors are unaffected: 53/(68-1)."}, {"question": "A group has 9 juniors and 71 seniors. Given the 1st pick is a junior, which equation gives P(2nd pick is senior)?", "choices": ["9/(80-1)", "70/(80-1)", "71/(80-1)", "71/80"], "correctIndex": 2, "explanation": "The 1st pick removes one junior, shrinking the total pool to 80-1. Seniors are unaffected: 71/(80-1)."}, {"question": "A group has 8 juniors and 57 seniors. Given the 1st pick is a junior, which equation gives P(2nd pick is senior)?", "choices": ["57/(65-1)", "8/(65-1)", "56/(65-1)", "57/65"], "correctIndex": 0, "explanation": "The 1st pick removes one junior, shrinking the total pool to 65-1. Seniors are unaffected: 57/(65-1)."}, {"question": "A group has 13 juniors and 79 seniors. Given the 1st pick is a junior, which equation gives P(2nd pick is senior)?", "choices": ["13/(92-1)", "79/92", "79/(92-1)", "78/(92-1)"], "correctIndex": 2, "explanation": "The 1st pick removes one junior, shrinking the total pool to 92-1. Seniors are unaffected: 79/(92-1)."}, {"question": "A game costs \\$3 to play. You have a 1 in 6 chance to win \\$10 (otherwise nothing). Which equation gives the expected NET result of playing?", "choices": ["(10)*(1/6)-3", "(10-3)*(1/6)", "(10)*(1/6)", "(10)*(1/6)+3"], "correctIndex": 0, "explanation": "Expected payout is (10)(1/6); subtract the \\$3 cost to play for the net result."}, {"question": "A game costs \\$3 to play. You have a 1 in 5 chance to win \\$30 (otherwise nothing). Which equation gives the expected NET result of playing?", "choices": ["(30)*(1/5)-3", "(30-3)*(1/5)", "(30)*(1/5)+3", "(30)*(1/5)"], "correctIndex": 0, "explanation": "Expected payout is (30)(1/5); subtract the \\$3 cost to play for the net result."}, {"question": "A game costs \\$3 to play. You have a 1 in 6 chance to win \\$20 (otherwise nothing). Which equation gives the expected NET result of playing?", "choices": ["(20)*(1/6)+3", "(20-3)*(1/6)", "(20)*(1/6)", "(20)*(1/6)-3"], "correctIndex": 3, "explanation": "Expected payout is (20)(1/6); subtract the \\$3 cost to play for the net result."}, {"question": "A game costs \\$3 to play. You have a 1 in 4 chance to win \\$20 (otherwise nothing). Which equation gives the expected NET result of playing?", "choices": ["(20)*(1/4)-3", "(20-3)*(1/4)", "(20)*(1/4)", "(20)*(1/4)+3"], "correctIndex": 0, "explanation": "Expected payout is (20)(1/4); subtract the \\$3 cost to play for the net result."}]}, "prob_mixed": {"name": "Probability: Mixed Practice", "lesson": "**Mixed practice -- everything at once**\n\nNo more sorting by category first. These questions are pulled from every\nprobability concept you've covered -- diagnose the type AND solve it, just\nlike the real test. If you get stuck, think back through the tree: is this\nCounting, Expected Value, or a True Probability question? If the latter,\nwhich of the four sub-types, and which technique within it?\n", "flashcards": [{"front": "When a mixed question doesn't obviously fit a category, what's the first move?", "back": "Run through the tree: Counting Methods, Expected Value, or True Probability? If the latter, which of the four sub-types?"}], "bank": [{"question": "How many different ways can 3 of 9 distinctly-named people finish in 1st through 3rd place?", "choices": ["72", "504", "84", "362880"], "correctIndex": 1, "explanation": "Order matters here (1st place differs from 2nd place), so use permutations: 9P3 = 9!/(9-3)! = 504."}, {"question": "Slips numbered 1 to 32 are in a bag. What is the probability of drawing a multiple of 4 or a multiple of 6?", "choices": ["1/16", "13/32", "1/4", "11/32"], "correctIndex": 3, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 4: 8. Multiples of 6: 5. Multiples of both (LCM 12): 2, double-counted. (8 + 5 - 2) / 32 = 11/32 = 11/32."}, {"question": "A survey recorded 965 vehicles by category and color. Of the 455 total trucks, 159 are white. What is the probability that a randomly selected truck is white?", "choices": ["159/965", "91/193", "159/455", "455/159"], "correctIndex": 2, "explanation": "\"A randomly selected truck\" restricts the denominator to trucks only (455), not the grand total. P(white | trucks) = 159/455 = 159/455."}, {"question": "A bag has 8 items, 5 of which are defective. You draw 2, with replacement (each item put back before the next draw). What is the probability of getting at least one defective item?", "choices": ["9/64", "5/8", "55/64", "1"], "correctIndex": 2, "explanation": "\"At least one\" signals Complement. P(none) = 9/64, so P(at least one) = 1 - 9/64 = 55/64."}, {"question": "Slips numbered 1 to 26 are in a bag. What is the probability of drawing a multiple of 2 or a multiple of 5?", "choices": ["9/13", "1/13", "8/13", "1/2"], "correctIndex": 2, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 2: 13. Multiples of 5: 5. Multiples of both (LCM 10): 2, double-counted. (13 + 5 - 2) / 26 = 16/26 = 8/13."}, {"question": "Coin C is weighted so that the probability of landing faceup is 3 times the probability of landing facedown. A player wins $2.00 for faceup and $3.00 for facedown. What is the expected value of each toss, to the nearest cent?", "choices": ["$2.00", "$2.50", "$2.25", "$2.75"], "correctIndex": 2, "explanation": "Let P(facedown) = p. Then P(faceup) = 3p, and 3p + p = 1 gives p = 1/4. So P(faceup) = 3/4, P(facedown) = 1/4. E(X) = (2)(3/4) + (3)(1/4) = $2.25."}, {"question": "A jar has 21 red and 5 blue marbles. What is the probability of drawing a red marble?", "choices": ["11/13", "21/25", "21/26", "5/26"], "correctIndex": 2, "explanation": "Direct approach: favorable (21) over total (26) = 21/26. No flipping needed -- just count and divide."}, {"question": "A deck has 20 cards, 4 of which are face cards. What is the probability of drawing a face card?", "choices": ["4/19", "1/5", "1/4", "4/5"], "correctIndex": 1, "explanation": "Direct approach: favorable (4) over total (20) = 1/5. No flipping needed -- just count and divide."}, {"question": "Of the 26 students in a class, 8 are in debate club, 10 are in chess club, and 4 are in both. How many students are in NEITHER club?", "choices": ["8", "16", "12", "14"], "correctIndex": 2, "explanation": "At least one club: 8 + 10 - 4 = 14. Neither: 26 - 14 = 12."}, {"question": "A group is composed of 16 freshmen and 73 seniors. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a senior, what is the probability that the 2nd member selected is a senior?", "choices": ["2/11", "73/89", "72/89", "9/11"], "correctIndex": 3, "explanation": "The 1st pick removes one senior from the pool, so the total shrinks from 89 to 88. Remaining senior: 72. P(2nd is senior | 1st is senior) = 72/88 = 9/11."}, {"question": "A group is composed of 17 juniors and 86 seniors. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a junior, what is the probability that the 2nd member selected is a senior?", "choices": ["8/51", "94/51", "43/51", "86/103"], "correctIndex": 2, "explanation": "The 1st pick removes one junior from the pool, so the total shrinks from 103 to 102. Remaining senior: 86. P(2nd is senior | 1st is junior) = 86/102 = 43/51."}, {"question": "A point is chosen randomly within a 12-by-10 rectangular region. A 10-by-7 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["5/12", "17/22", "7/12", "5/6"], "correctIndex": 2, "explanation": "Area-based: favorable area (10x7=70) over total area (12x10=120) = 7/12."}, {"question": "A dart is thrown randomly at a square target with a circle inscribed inside it, touching all four sides. What is the probability the dart lands inside the circle?", "choices": ["1/2", "pi/2", "pi/4", "4/pi"], "correctIndex": 2, "explanation": "If the square has side s, the inscribed circle has diameter s (radius s/2). Circle area = pi(s/2)^2 = pi*s^2/4. Square area = s^2. Ratio = pi/4 -- the side length s cancels completely."}, {"question": "A jar has 12 red and 4 blue marbles. What is the probability of drawing a red marble?", "choices": ["13/16", "3/4", "4/5", "1/4"], "correctIndex": 1, "explanation": "Direct approach: favorable (12) over total (16) = 3/4. No flipping needed -- just count and divide."}, {"question": "If the expected value of a raffle ticket is -$0.50, what does this mean?", "choices": ["The ticket costs $0.50 more than it's worth to print", "Every single ticket loses exactly $0.50", "Half of all tickets lose $0.50", "On average, over many tickets played, a player loses about $0.50 per ticket"], "correctIndex": 3, "explanation": "Expected value is a long-run average across many trials, not a guaranteed result on any one ticket. Individual tickets either win or lose their full amount -- the -$0.50 only shows up as an average over many plays."}, {"question": "A point is chosen randomly within a 7-by-6 rectangular region. A 2-by-4 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["4/21", "17/21", "6/13", "2/7"], "correctIndex": 0, "explanation": "Area-based: favorable area (2x4=8) over total area (7x6=42) = 4/21."}, {"question": "A bag has 14 items, 5 of which are defective. You draw 3, without replacement. What is the probability of getting at least one defective item?", "choices": ["10/13", "1", "5/14", "3/13"], "correctIndex": 0, "explanation": "\"At least one\" signals Complement. P(none) = 3/13, so P(at least one) = 1 - 3/13 = 10/13."}, {"question": "How many different 2-person committees can be formed from a group of 8 people?", "choices": ["28", "29", "56", "8"], "correctIndex": 0, "explanation": "Order doesn't matter for a committee (it's the same group regardless of selection order), so use combinations: 8C2 = 8!/(2!(8-2)!) = 28."}, {"question": "A fair 6-sided die is rolled. What is the probability of rolling a 2 or a 1?", "choices": ["1/36", "1/2", "1/3", "1/6"], "correctIndex": 2, "explanation": "Mutually exclusive outcomes joined by OR -> add: 1/6 + 1/6 = 1/3. No overlap to subtract since a roll can't be both."}, {"question": "Slips numbered 1 to 27 are in a bag. What is the probability of drawing a multiple of 3 or a multiple of 5?", "choices": ["1/3", "13/27", "1/27", "14/27"], "correctIndex": 1, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 3: 9. Multiples of 5: 5. Multiples of both (LCM 15): 1, double-counted. (9 + 5 - 1) / 27 = 13/27 = 13/27."}, {"question": "A code has 3 letter(s) followed by 1 digit(s), with no repeated letters and no repeated digits allowed. How many different codes are possible?", "choices": ["156000", "78000", "175760", "15610"], "correctIndex": 0, "explanation": "Letters (no repeats): 26x25x24 = 15600. Digits (no repeats): 10 = 10. Multiply: 15600 x 10 = 156000."}, {"question": "Evaluate 4!", "choices": ["10", "6", "16", "24"], "correctIndex": 3, "explanation": "4! = 4 x 3 x 2 x 1 = 24."}, {"question": "A jar has 16 red and 8 blue marbles. What is the probability of drawing a red marble?", "choices": ["17/24", "1/3", "16/23", "2/3"], "correctIndex": 3, "explanation": "Direct approach: favorable (16) over total (24) = 2/3. No flipping needed -- just count and divide."}, {"question": "A game costs $4 to play. You have a 1 in 6 chance to win $30 (otherwise you win nothing). What is the expected net result of playing (accounting for the cost)?", "choices": ["$5", "$9", "$1", "$26"], "correctIndex": 2, "explanation": "Expected payout = (30)(1/6) = 5. Subtract the $4 cost to play: 5 - 4 = $1."}, {"question": "A dart is thrown randomly at a square dartboard with a circle inscribed inside it, touching all four sides. What is the probability the dart lands inside the circle?", "choices": ["1/2", "pi/4", "pi/2", "4/pi"], "correctIndex": 1, "explanation": "If the square has side s, the inscribed circle has diameter s (radius s/2). Circle area = pi(s/2)^2 = pi*s^2/4. Square area = s^2. Ratio = pi/4 -- the side length s cancels completely."}, {"question": "Slips numbered 1 to 52 are in a bag. What is the probability of drawing a multiple of 5 or a multiple of 7?", "choices": ["5/26", "17/52", "1/52", "4/13"], "correctIndex": 3, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 5: 10. Multiples of 7: 7. Multiples of both (LCM 35): 1, double-counted. (10 + 7 - 1) / 52 = 16/52 = 4/13."}, {"question": "How many different 4-person committees can be formed from a group of 8 people?", "choices": ["1680", "140", "70", "56"], "correctIndex": 2, "explanation": "Order doesn't matter for a committee (it's the same group regardless of selection order), so use combinations: 8C4 = 8!/(4!(8-4)!) = 70."}, {"question": "A group is composed of 11 juniors and 64 sophomores. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a sophomore, what is the probability that the 2nd member selected is a junior?", "choices": ["85/74", "63/74", "11/75", "11/74"], "correctIndex": 3, "explanation": "The 1st pick removes one sophomore from the pool, so the total shrinks from 75 to 74. Remaining junior: 11. P(2nd is junior | 1st is sophomore) = 11/74 = 11/74."}, {"question": "Slips numbered 1 to 37 are in a bag. What is the probability of drawing a multiple of 3 or a multiple of 7?", "choices": ["1/37", "16/37", "17/37", "12/37"], "correctIndex": 1, "explanation": "OR with overlapping categories -> inclusion-exclusion. Multiples of 3: 12. Multiples of 7: 5. Multiples of both (LCM 21): 1, double-counted. (12 + 5 - 1) / 37 = 16/37 = 16/37."}, {"question": "Of the students in a class, 75% join student council. Of those who join student council, 45% also do community service. What is the probability that a student also do community service, given that they join student council?", "choices": ["75%", "45%", "34%", "55%"], "correctIndex": 1, "explanation": "\"Given that they join student council\" restricts you to just that group -- the 45% is already the conditional probability itself, directly stated. No further math needed."}, {"question": "A point is chosen randomly within a circular region. A square is inscribed in the circle (all four corners touch the circle). What is the probability the point lands inside the square?", "choices": ["pi/4", "pi/2", "1/4", "2/pi"], "correctIndex": 3, "explanation": "If the circle has radius r, the inscribed square's diagonal equals the circle's diameter (2r), so the square's side is r*sqrt(2) and its area is 2r^2. Circle area = pi*r^2. Ratio = 2r^2/(pi*r^2) = 2/pi."}, {"question": "A point is chosen randomly within a 8-by-4 rectangular region. A 7-by-2 rectangular sub-region sits entirely inside it. What is the probability the point lands inside the sub-region?", "choices": ["7/8", "7/16", "3/4", "9/16"], "correctIndex": 1, "explanation": "Area-based: favorable area (7x2=14) over total area (8x4=32) = 7/16."}, {"question": "A spinner lands on 15 with probability 4/10, on 35 with probability 5/10, and on 20 with probability 1/10. What is the expected value of one spin?", "choices": ["27", "70/3", "51/2", "35"], "correctIndex": 2, "explanation": "E(X) = 15(4/10) + 35(5/10) + 20(1/10) = 60/10 + 175/10 + 20/10 = 51/2."}, {"question": "A game costs $3 to play. You have a 1 in 3 chance to win $12 (otherwise you win nothing). What is the expected net result of playing (accounting for the cost)?", "choices": ["$1", "$7", "$9", "$4"], "correctIndex": 0, "explanation": "Expected payout = (12)(1/3) = 4. Subtract the $3 cost to play: 4 - 3 = $1."}, {"question": "Coin C is weighted so that the probability of landing faceup is 4 times the probability of landing facedown. A player wins $2.00 for faceup and $1.00 for facedown. What is the expected value of each toss, to the nearest cent?", "choices": ["$1.20", "$1.80", "$1.50", "$2.00"], "correctIndex": 1, "explanation": "Let P(facedown) = p. Then P(faceup) = 4p, and 4p + p = 1 gives p = 1/5. So P(faceup) = 4/5, P(facedown) = 1/5. E(X) = (2)(4/5) + (1)(1/5) = $1.80."}, {"question": "A group is composed of 17 juniors and 77 managers. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a manager, what is the probability that the 2nd member selected is a junior?", "choices": ["17/93", "17/94", "110/93", "76/93"], "correctIndex": 0, "explanation": "The 1st pick removes one manager from the pool, so the total shrinks from 94 to 93. Remaining junior: 17. P(2nd is junior | 1st is manager) = 17/93 = 17/93."}]}, "sva_interrupter": {"name": "Subject-Verb Agreement (Interrupters)", "lesson": "**Subject-Verb Agreement Across an Interrupter**\n\nThe verb must agree with the TRUE subject, never whatever noun happens to\nsit closest to it. Whenever something comes between the subject and the\nverb, cross it out mentally -- it doesn't count for agreement.\n\nThis shows up in five disguises:\n\n1. **Prepositional phrase**: \"The bouquet *of flowers* is wilting.\" (cross\n   out \"of flowers\" -- \"bouquet\" is the subject, singular)\n2. **Gerund/participial phrase AS the subject**: \"Playing complex pieces\n   from memory requires...\" (a whole activity is always singular)\n3. **Appositive/nonessential clause**: \"The committee, *along with its\n   members*, meets monthly.\" (cross out the comma-set-off phrase)\n4. **Compound subject**: \"and\" -> plural. \"or\"/\"nor\" -> matches whichever\n   noun is closer to the verb.\n5. **Nested clause (doubled check)**: a relative clause (\"whose,\" \"that,\"\n   \"which\") often has its OWN separate subject-verb pair to verify, on top\n   of the main one.\n\n\n**Advanced: recognizing when it's already correct**\n\nNot every question needs a fix. On the real test, some underlined verbs are\nalready right -- the skill is confirming the true subject and verb DO\nagree, not assuming every question has an error to find.\n", "flashcards": [{"front": "What's the core rule for subject-verb agreement with an interrupter?", "back": "Cross out whatever sits between subject and verb -- match to the TRUE subject.\nExample: The basket of apples is on the table. (cross out \"of apples\")"}, {"front": "Is a gerund phrase (\"Playing...\", \"Running...\") as a subject singular or plural?", "back": "Always singular -- a whole activity is one thing.\nExample: Solving these equations requires patience. (not \"require\")"}, {"front": "Compound subject joined by \"and\" -- singular or plural verb?", "back": "Plural.\nExample: The teacher and her students are preparing for the fair."}, {"front": "Compound subject joined by \"or\"/\"nor\" -- which noun does the verb match?", "back": "Whichever noun is closer to the verb.\nExample: Neither the manager nor the employees were aware of the change. (matches \"employees\")"}, {"front": "What's tricky about a nested relative clause (\"whose,\" \"that,\" \"which\")?", "back": "It has its own separate subject-verb pair to check, on top of the main one.\nExample: The organizations whose funding depends on donations are under pressure. (main subject \"organizations\" is plural; \"funding depends\" is a separate, already-correct check)"}], "bank": [{"question": "The basket of apples ___ on the table.", "choices": ["is", "are", "were", "have been"], "correctIndex": 0, "explanation": "Cross out \"of apples\" -- the subject is \"basket,\" singular."}, {"question": "The results of the experiment ___ surprising.", "choices": ["is", "are", "was", "has been"], "correctIndex": 1, "explanation": "Cross out \"of the experiment\" -- the subject is \"results,\" plural."}, {"question": "A collection of rare coins ___ displayed at the museum.", "choices": ["is", "are", "were", "have been"], "correctIndex": 0, "explanation": "Cross out \"of rare coins\" -- the subject is \"collection,\" singular."}, {"question": "The reasons behind her decision ___ still unclear.", "choices": ["is", "are", "was", "has been"], "correctIndex": 1, "explanation": "Cross out \"behind her decision\" -- the subject is \"reasons,\" plural."}, {"question": "Solving these equations ___ patience and practice.", "choices": ["require", "requires", "are requiring", "have required"], "correctIndex": 1, "explanation": "The gerund phrase \"Solving these equations\" is the whole subject and is always singular."}, {"question": "Waiting in long lines ___ one of her biggest frustrations.", "choices": ["is", "are", "were", "have been"], "correctIndex": 0, "explanation": "A gerund-phrase subject (\"Waiting in long lines\") is always singular."}, {"question": "Collecting vintage stamps ___ become her favorite hobby.", "choices": ["has", "have", "were", "are"], "correctIndex": 0, "explanation": "A gerund-phrase subject is always singular, so it takes \"has,\" not \"have.\""}, {"question": "Managing multiple deadlines ___ a lot of organization.", "choices": ["takes", "take", "were taking", "have taken"], "correctIndex": 0, "explanation": "The gerund phrase \"Managing multiple deadlines\" is singular."}, {"question": "The committee, along with its senior members, ___ monthly.", "choices": ["meets", "meet", "were meeting", "have met"], "correctIndex": 0, "explanation": "Cross out \"along with its senior members\" -- the subject is \"committee,\" singular."}, {"question": "The novel, despite its many flaws, ___ widely praised.", "choices": ["was", "were", "have been", "are"], "correctIndex": 0, "explanation": "Cross out \"despite its many flaws\" -- the subject is \"novel,\" singular."}, {"question": "My grandmother, along with her three sisters, ___ a beautiful singer.", "choices": ["is", "are", "were", "have been"], "correctIndex": 0, "explanation": "Cross out \"along with her three sisters\" -- the subject is \"grandmother,\" singular."}, {"question": "The report, including all of its appendices, ___ due Friday.", "choices": ["is", "are", "were", "have been"], "correctIndex": 0, "explanation": "Cross out \"including all of its appendices\" -- the subject is \"report,\" singular."}, {"question": "The teacher and her students ___ preparing for the science fair.", "choices": ["is", "are", "was", "has been"], "correctIndex": 1, "explanation": "\"And\" joins the subjects into a plural: \"teacher and students.\""}, {"question": "Neither the manager nor the employees ___ aware of the change.", "choices": ["was", "were", "is", "has been"], "correctIndex": 1, "explanation": "With \"nor,\" the verb matches the closer noun: \"employees,\" plural."}, {"question": "Either the twins or their mother ___ picking up the package.", "choices": ["is", "are", "were", "have been"], "correctIndex": 0, "explanation": "With \"or,\" the verb matches the closer noun: \"mother,\" singular."}, {"question": "The coach and the referee ___ discussing the call.", "choices": ["is", "are", "was", "has been"], "correctIndex": 1, "explanation": "\"And\" joins the subjects into a plural."}, {"question": "The organizations whose funding depends on donations ___ under pressure.", "choices": ["is", "are", "was", "has been"], "correctIndex": 1, "explanation": "The main subject is \"organizations,\" plural. (The embedded clause \"whose funding depends\" is its own already-correct check.)"}, {"question": "The students who complete the extra assignment ___ bonus points.", "choices": ["earns", "earn", "were earning", "has earned"], "correctIndex": 1, "explanation": "The main subject is \"students,\" plural."}, {"question": "The house that overlooks the vineyards ___ for sale.", "choices": ["is", "are", "were", "have been"], "correctIndex": 0, "explanation": "The main subject is \"house,\" singular -- \"that overlooks the vineyards\" is a nested, separately-correct clause."}, {"question": "The scientists whose research supports the theory ___ recognized annually.", "choices": ["is", "are", "was", "has been"], "correctIndex": 1, "explanation": "The main subject is \"scientists,\" plural."}, {"question": "The network of sensors that monitor soil moisture across the valley __send__ real-time alerts to farmers whenever levels drop below a critical threshold.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "sends", "are sending", "have sent"], "correctIndex": 1, "explanation": "Cross out \"of sensors that monitor soil moisture across the valley\" -- the true subject is \"network,\" singular, needing \"sends.\" NO CHANGE keeps the plural \"send.\""}, {"question": "The committees whose budgets depend heavily on annual grants __is__ required to submit detailed spending reports every quarter.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "are", "was", "has been"], "correctIndex": 1, "explanation": "The main subject is \"committees,\" plural, needing \"are.\" The embedded clause \"whose budgets depend\" is a separate, already-correct check on \"budgets.\" NO CHANGE wrongly uses the singular \"is.\""}, {"question": "Networks of researchers whose findings challenge conventional theories __continues__ to reshape scientific discourse worldwide.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "continue", "was continuing", "has continued"], "correctIndex": 1, "explanation": "The main subject is \"Networks,\" plural, needing \"continue.\" NO CHANGE wrongly uses the singular \"continues.\""}, {"question": "Coordinating logistics for volunteers across multiple time zones __require__ constant communication and a flexible schedule.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "requires", "were requiring", "have required"], "correctIndex": 1, "explanation": "The gerund phrase \"Coordinating logistics...\" is the whole subject and is always singular, needing \"requires.\" NO CHANGE wrongly uses the plural \"require.\""}, {"question": "The senator, along with several key advisors who had reviewed the proposal overnight, __were__ prepared to address reporters at dawn.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "was", "are", "have been"], "correctIndex": 1, "explanation": "Cross out \"along with several key advisors who had reviewed the proposal overnight\" -- the true subject is \"senator,\" singular, needing \"was.\" NO CHANGE wrongly uses the plural \"were.\""}, {"question": "The archives that preserve the region's earliest recorded histories __remain__ open to researchers by appointment only.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "remains", "was remaining", "has remained"], "correctIndex": 0, "explanation": "The main subject is \"archives,\" plural, correctly paired with \"remain.\" NO CHANGE is correct as printed -- no error here."}, {"question": "The scientists who lead the expedition __report__ directly to the agency overseeing polar research.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "reports", "was reporting", "has reported"], "correctIndex": 0, "explanation": "The main subject is \"scientists,\" plural, correctly paired with \"report.\" NO CHANGE is correct as printed."}, {"question": "Neither the district's aging bridges nor its overburdened water system __was__ addressed in the mayor's initial budget proposal.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "were", "are", "have been"], "correctIndex": 0, "explanation": "With \"nor,\" the verb matches the closer noun, \"system,\" singular -- \"was\" is correct as printed. NO CHANGE is correct."}]}, "essential_nonessential_punctuation": {"name": "Essential vs. Nonessential Punctuation", "lesson": "**Essential vs. Nonessential Punctuation**\n\nTwo separate diagnostic questions, not one:\n\n**Branch A -- Essential vs. Nonessential info**: does removing the phrase\nlose identifying meaning?\n- Yes -> **essential** -> no commas (\"The novelist Toni Morrison...\")\n- No -> **nonessential** -> comma pair, dash pair, or parentheses (\"My\n  brother, a doctor, moved to Denver.\")\nA handy signal: clauses starting with \"that\" are almost always essential\n(no commas); clauses starting with \"which\" are almost always nonessential\n(commas required).\n\n**Branch B -- Introducing an explanation or list**: what comes right\nbefore the colon?\n- A grammatically complete sentence -> **colon**\n- A fragment (like \"...include,\" \"...such as,\" \"...was\") -> **no colon**\nThe single most common trap: never put a colon right after \"include\" or\n\"such as\" -- those phrases are never a complete sentence on their own.\n\n\n**Advanced: dash pairs**\n\nDashes work exactly like comma pairs for nonessential info -- with one\nextra rule: if the aside itself contains a comma-separated list, use\ndashes (not commas) to mark its boundaries, so the list's commas don't get\nconfused with the boundary punctuation. Whichever mark opens the aside must\nmatch the one that closes it.\n", "flashcards": [{"front": "Branch A diagnostic: essential vs. nonessential?", "back": "Does removing the phrase lose identifying meaning?\nEssential (no commas): The car that has a dent is mine.\nNonessential (commas): Shakespeare, the famous playwright, wrote sonnets."}, {"front": "Quick signal for essential vs. nonessential clauses?", "back": "\"That\" -> essential, no commas. \"Which\" -> nonessential, commas required.\nExample: The report that you sent arrived late. vs. The report, which you sent yesterday, arrived late."}, {"front": "Branch B: colon or no colon?", "back": "What comes right before it -- complete sentence (colon) or fragment (no colon)?\nColon: She had one goal: to finish the marathon.\nNo colon: Her hobbies include hiking, painting, and reading."}, {"front": "The single most common colon trap?", "back": "Never put a colon right after \"include\" or \"such as.\"\nWrong: Her hobbies include: hiking and painting.\nRight: Her hobbies include hiking and painting."}], "bank": [{"question": "Which sentence is correctly punctuated?", "choices": ["The novel that she recommended became a bestseller.", "The novel, that she recommended, became a bestseller.", "The novel that she recommended, became a bestseller.", "The novel, that she recommended became a bestseller."], "correctIndex": 0, "explanation": "\"That she recommended\" is essential -- it identifies which novel. Essential clauses take no commas."}, {"question": "Which sentence is correctly punctuated?", "choices": ["The employee who finishes first will get a bonus.", "The employee, who finishes first, will get a bonus.", "The employee who finishes first, will get a bonus.", "The employee, who finishes first will get a bonus."], "correctIndex": 0, "explanation": "\"Who finishes first\" is essential -- it identifies which employee. No commas needed."}, {"question": "Which sentence is correctly punctuated?", "choices": ["The recipe that uses fresh basil tastes best.", "The recipe, that uses fresh basil, tastes best.", "The recipe that uses fresh basil, tastes best.", "The recipe, that uses fresh basil tastes best."], "correctIndex": 0, "explanation": "\"That uses fresh basil\" is essential -- it identifies which recipe. No commas."}, {"question": "Which sentence is correctly punctuated?", "choices": ["The bridge that connects the two islands was built in 1990.", "The bridge, that connects the two islands, was built in 1990.", "The bridge that connects the two islands, was built in 1990.", "The bridge, that connects the two islands was built in 1990."], "correctIndex": 0, "explanation": "\"That connects the two islands\" is essential -- no commas."}, {"question": "Which sentence is correctly punctuated?", "choices": ["The app that tracks expenses helped her save money.", "The app, that tracks expenses, helped her save money.", "The app that tracks expenses, helped her save money.", "The app, that tracks expenses helped her save money."], "correctIndex": 0, "explanation": "\"That tracks expenses\" is essential -- it identifies which app. No commas."}, {"question": "Which sentence is correctly punctuated?", "choices": ["Shakespeare, the famous playwright, wrote many sonnets.", "Shakespeare the famous playwright wrote many sonnets.", "Shakespeare, the famous playwright wrote many sonnets.", "Shakespeare the famous playwright, wrote many sonnets."], "correctIndex": 0, "explanation": "\"The famous playwright\" is nonessential (Shakespeare is already fully identified by name) -- it needs a comma pair."}, {"question": "Which sentence is correctly punctuated?", "choices": ["Paris, the capital of France, attracts millions of tourists.", "Paris the capital of France attracts millions of tourists.", "Paris, the capital of France attracts millions of tourists.", "Paris the capital of France, attracts millions of tourists."], "correctIndex": 0, "explanation": "\"The capital of France\" is nonessential extra information about Paris -- comma pair required."}, {"question": "Which sentence is correctly punctuated?", "choices": ["My cousin, a professional chef, catered the wedding.", "My cousin a professional chef catered the wedding.", "My cousin, a professional chef catered the wedding.", "My cousin a professional chef, catered the wedding."], "correctIndex": 0, "explanation": "\"A professional chef\" is nonessential extra detail -- comma pair required."}, {"question": "Which sentence is correctly punctuated?", "choices": ["Mount Everest, the tallest mountain on Earth, draws climbers worldwide.", "Mount Everest the tallest mountain on Earth draws climbers worldwide.", "Mount Everest, the tallest mountain on Earth draws climbers worldwide.", "Mount Everest the tallest mountain on Earth, draws climbers worldwide."], "correctIndex": 0, "explanation": "\"The tallest mountain on Earth\" is nonessential -- Mount Everest is already uniquely identified by name."}, {"question": "Which sentence is correctly punctuated?", "choices": ["Yellowstone, the first national park, spans three states.", "Yellowstone the first national park spans three states.", "Yellowstone, the first national park spans three states.", "Yellowstone the first national park, spans three states."], "correctIndex": 0, "explanation": "\"The first national park\" is nonessential extra information -- comma pair required."}, {"question": "Which sentence is correctly punctuated?", "choices": ["She had one goal: to finish the marathon.", "She had one goal, to finish the marathon.", "She had one goal to finish: the marathon.", "She had one, goal: to finish the marathon."], "correctIndex": 0, "explanation": "\"She had one goal\" is a complete sentence, so a colon correctly introduces the explanation."}, {"question": "Which sentence is correctly punctuated?", "choices": ["The recipe requires three ingredients: flour, sugar, and butter.", "The recipe requires three ingredients, flour, sugar, and butter.", "The recipe requires: three ingredients, flour, sugar, and butter.", "The recipe requires three, ingredients: flour, sugar, and butter."], "correctIndex": 0, "explanation": "\"The recipe requires three ingredients\" is a complete sentence, so a colon correctly introduces the list."}, {"question": "Which sentence is correctly punctuated?", "choices": ["There is only one rule: always tell the truth.", "There is only one rule, always tell the truth.", "There is only, one rule: always tell the truth.", "There is only one rule always tell: the truth."], "correctIndex": 0, "explanation": "\"There is only one rule\" is complete, so the colon correctly introduces what the rule is."}, {"question": "Which sentence is correctly punctuated?", "choices": ["The committee is composed of three groups: students, faculty, and staff.", "The committee is composed of: three groups, students, faculty, and staff.", "The committee is composed of three groups, students, faculty, and staff.", "The committee is composed of three groups: students faculty, and staff."], "correctIndex": 0, "explanation": "\"The committee is composed of three groups\" is complete, so the colon correctly introduces the list."}, {"question": "Which sentence is correctly punctuated?", "choices": ["His answer was simple: he refused to apologize.", "His answer was simple, he refused to apologize.", "His answer, was simple: he refused to apologize.", "His answer was simple he refused: to apologize."], "correctIndex": 0, "explanation": "\"His answer was simple\" is complete, so the colon correctly introduces the explanation."}, {"question": "Which sentence is correctly punctuated?", "choices": ["Her hobbies include hiking, painting, and reading.", "Her hobbies include: hiking, painting, and reading.", "Her hobbies, include hiking, painting, and reading.", "Her hobbies include hiking, painting: and reading."], "correctIndex": 0, "explanation": "\"Her hobbies include\" is not a complete sentence on its own -- never put a colon right after \"include.\""}, {"question": "Which sentence is correctly punctuated?", "choices": ["The store sells items such as notebooks, pens, and folders.", "The store sells items such as: notebooks, pens, and folders.", "The store sells: items such as notebooks, pens, and folders.", "The store, sells items such as notebooks, pens, and folders."], "correctIndex": 0, "explanation": "\"Such as\" is never followed by a colon -- the phrase before it isn't a complete thought on its own."}, {"question": "Which sentence is correctly punctuated?", "choices": ["The museum's collection includes paintings, sculptures, and photographs.", "The museum's collection includes: paintings, sculptures, and photographs.", "The museum's, collection includes paintings, sculptures, and photographs.", "The museum's collection, includes paintings, sculptures, and photographs."], "correctIndex": 0, "explanation": "\"Includes\" is never followed by a colon -- same trap as \"include.\""}, {"question": "Which sentence is correctly punctuated?", "choices": ["We packed everything we needed: tents, sleeping bags, and food.", "We packed everything we needed, tents, sleeping bags, and food.", "We packed: everything we needed, tents, sleeping bags, and food.", "We packed everything we needed tents: sleeping bags, and food."], "correctIndex": 0, "explanation": "\"We packed everything we needed\" is a complete sentence, so the colon correctly introduces the list."}, {"question": "Which sentence is correctly punctuated?", "choices": ["The bakery is known for its specialty: sourdough bread.", "The bakery is known for its specialty, sourdough bread.", "The bakery is known for: its specialty, sourdough bread.", "The bakery is known for its specialty sourdough: bread."], "correctIndex": 0, "explanation": "\"The bakery is known for its specialty\" is complete, so the colon correctly introduces what it is."}, {"question": "The recipe calls for three spices__--__cumin, paprika, and turmeric--that give the dish its distinctive flavor.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ",", ";", "OMIT the underlined portion"], "correctIndex": 0, "explanation": "The aside itself contains a comma-separated list (cumin, paprika, turmeric), so setting it off with commas too would be confusing. Dashes clearly mark the boundary, matching the closing dash already in the sentence. NO CHANGE is correct."}, {"question": "The museum's collection--paintings, sculptures, and rare manuscripts__,__ draws visitors from around the world.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "--", ";", "OMIT the underlined portion"], "correctIndex": 1, "explanation": "The aside opened with a dash, so it must close with a dash too, especially since the aside itself contains internal commas. NO CHANGE's plain comma creates a mismatched, confusing pair."}, {"question": "The keynote speaker was Maria Alvarez__,__ a renowned marine biologist.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ";", ":", "OMIT the underlined portion"], "correctIndex": 0, "explanation": "\"A renowned marine biologist\" is nonessential extra information -- Maria Alvarez is already fully identified by name. A comma correctly sets it off. NO CHANGE is correct."}, {"question": "Students__,__ who complete all four years of the program receive a certificate of distinction.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ";", ":", "OMIT the underlined portion"], "correctIndex": 3, "explanation": "\"Who complete all four years of the program\" is essential -- it specifies which students. No comma is needed at all. OMIT is correct; NO CHANGE wrongly inserts one."}, {"question": "Despite years of careful planning, the expedition ultimately failed for a reason no one had anticipated__,__ a sudden equipment malfunction stranded the team for nearly a week.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "--", "however,", ":"], "correctIndex": 3, "explanation": "The first part is a complete sentence, and what follows explains exactly what the unanticipated reason was -- a colon correctly introduces it. NO CHANGE's comma alone creates a comma splice. \"However,\" is also a comma splice, since a conjunctive adverb needs a semicolon or period before it, not just a comma."}, {"question": "The exhibit features artifacts from three distinct eras__,__ ancient Rome, medieval Europe, and the Renaissance--each displayed in its own gallery.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", "--", ";", "OMIT the underlined portion"], "correctIndex": 1, "explanation": "The aside lists three items separated by commas, so using a comma to also open the aside would be confusing and doesn't match the dash already closing it. NO CHANGE's comma is inconsistent with the closing dash."}, {"question": "Any package__,__ delivered after 5 p.m. will be held at the front desk overnight.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ";", ":", "OMIT the underlined portion"], "correctIndex": 3, "explanation": "\"Delivered after 5 p.m.\" is essential -- it specifies which packages are held overnight, not just adding extra detail. No punctuation is needed at all. NO CHANGE wrongly inserts a comma."}, {"question": "The final decision rested with Judge Elena Marsh__,__ a widely respected figure in the state's legal community.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "choices": ["NO CHANGE", ";", ":", "OMIT the underlined portion"], "correctIndex": 0, "explanation": "\"A widely respected figure...\" is nonessential extra detail about Judge Elena Marsh, who's already fully identified by name -- a comma correctly sets it off. NO CHANGE is correct as printed."}]}, "modifier_placement": {"name": "Misplaced & Dangling Modifiers", "lesson": "**Misplaced vs. Dangling Modifiers**\n\nOne diagnostic question: does the noun the modifier describes actually\nappear somewhere in the sentence, right after it?\n\n- **Yes, but it's the WRONG noun** -> **Misplaced modifier** -> fix by\n  moving the phrase next to the correct noun.\n- **No logical noun appears anywhere** -> **Dangling modifier** -> fix by\n  rewriting the sentence so the right subject actually shows up.\n\nBoth create the same kind of unintentionally funny sentence (\"Covered in\nchocolate, we ate the strawberries\" -- were WE covered in chocolate?), but\nthe fix is different: misplaced modifiers just need to move; dangling\nmodifiers need the sentence rebuilt so a logical subject exists at all.\n", "flashcards": [{"front": "Diagnostic question for misplaced vs. dangling?", "back": "Does the noun the modifier describes appear right after it, anywhere in the sentence?"}, {"front": "Misplaced modifier -- what's wrong, how do you fix it?", "back": "The right noun exists, just in the wrong spot. Fix: move the modifier next to it.\nWrong: Covered in mud, the door had boots sitting by it.\nRight: Covered in mud, the boots sat by the door."}, {"front": "Dangling modifier -- what's wrong, how do you fix it?", "back": "No logical noun exists anywhere. Fix: rewrite so the right subject appears.\nWrong: After finishing the marathon, a deep sense of pride filled her.\nRight: After finishing the marathon, she felt a deep sense of pride."}], "bank": [{"question": "Which sentence correctly places the modifier?", "choices": ["Hanging on the wall, the painting caught everyone's attention.", "Hanging on the wall, everyone's attention was caught by the painting.", "The painting caught everyone's attention hanging on the wall.", "Everyone's attention, hanging on the wall, was caught by the painting."], "correctIndex": 0, "explanation": "\"Hanging on the wall\" describes the painting, so it must sit right next to \"the painting.\""}, {"question": "Which sentence correctly places the modifier?", "choices": ["Covered in mud, the boots sat by the door.", "Covered in mud, the door had boots sitting by it.", "The boots sat by the door covered in mud.", "Sitting by the door, the boots were covered, in mud."], "correctIndex": 0, "explanation": "\"Covered in mud\" describes the boots, not the door -- it must sit next to \"the boots.\""}, {"question": "Which sentence correctly places the modifier?", "choices": ["Written in 1851, the novel remains a classic.", "Written in 1851, readers still love the novel.", "The novel remains a classic written in 1851, still.", "Remaining a classic, the novel was written, in 1851."], "correctIndex": 0, "explanation": "\"Written in 1851\" describes the novel, not the readers -- it must sit next to \"the novel.\""}, {"question": "Which sentence correctly places the modifier?", "choices": ["Tired from the long hike, the campers set up their tents quickly.", "Tired from the long hike, the tents were set up quickly by the campers.", "The campers set up their tents quickly tired from the long hike.", "Setting up their tents, the campers were, tired from the long hike quickly."], "correctIndex": 0, "explanation": "\"Tired from the long hike\" describes the campers, not the tents -- it must sit next to \"the campers.\""}, {"question": "Which sentence correctly places the modifier?", "choices": ["Freshly baked, the bread smelled wonderful.", "Freshly baked, the kitchen smelled wonderful because of the bread.", "The bread smelled wonderful freshly baked in the kitchen today.", "Smelling wonderful, the bread was freshly, baked."], "correctIndex": 0, "explanation": "\"Freshly baked\" describes the bread, not the kitchen -- it must sit next to \"the bread.\""}, {"question": "Which sentence correctly places the modifier?", "choices": ["Excited about the trip, the students boarded the bus.", "Excited about the trip, the bus was boarded by the students.", "The students boarded the bus excited about the trip quickly.", "Boarding the bus, the students were, excited about the trip quickly today."], "correctIndex": 0, "explanation": "\"Excited about the trip\" describes the students, not the bus -- it must sit next to \"the students.\""}, {"question": "Which sentence correctly places the modifier?", "choices": ["Perched on the branch, the owl watched silently.", "Perched on the branch, silence filled the air as the owl watched.", "The owl watched silently perched on the branch nearby.", "Watching silently, the owl was perched, on the branch quietly."], "correctIndex": 0, "explanation": "\"Perched on the branch\" describes the owl, not the silence -- it must sit next to \"the owl.\""}, {"question": "Which sentence correctly places the modifier?", "choices": ["Eager to please, the puppy learned tricks quickly.", "Eager to please, tricks were learned quickly by the puppy.", "The puppy learned tricks quickly eager to please its owner.", "Learning tricks, the puppy was, eager to please quickly today."], "correctIndex": 0, "explanation": "\"Eager to please\" describes the puppy, not the tricks -- it must sit next to \"the puppy.\""}, {"question": "Which sentence is correctly constructed (no dangling modifier)?", "choices": ["After finishing the marathon, she felt a deep sense of pride.", "After finishing the marathon, a deep sense of pride filled her.", "A deep sense of pride was felt after finishing the marathon.", "Finishing the marathon, pride deeply filled her heart."], "correctIndex": 0, "explanation": "\"After finishing the marathon\" needs a logical runner as the subject -- \"pride\" can't finish a marathon. Only \"she\" works."}, {"question": "Which sentence is correctly constructed (no dangling modifier)?", "choices": ["While walking to school, I saw a rainbow.", "While walking to school, a rainbow appeared in the sky.", "A rainbow appeared while walking to school today.", "Walking to school, the sky had a rainbow in it."], "correctIndex": 0, "explanation": "\"While walking to school\" needs a walker as the subject -- a rainbow can't walk. Only \"I\" works."}, {"question": "Which sentence is correctly constructed (no dangling modifier)?", "choices": ["To improve her grades, Maria studied every night.", "To improve her grades, studying happened every night.", "Grades improved to study every night.", "To improve her grades, every night was spent studying."], "correctIndex": 0, "explanation": "\"To improve her grades\" needs a logical person as the subject -- only \"Maria\" works; \"studying\" and \"every night\" can't have grades to improve."}, {"question": "Which sentence is correctly constructed (no dangling modifier)?", "choices": ["Having arrived late, we missed the opening act.", "Having arrived late, the opening act was missed.", "The opening act was missed having arrived late.", "Arriving late, missing the opening act happened to us."], "correctIndex": 0, "explanation": "\"Having arrived late\" needs the late arrivers as the subject -- the opening act didn't arrive late. Only \"we\" works."}, {"question": "Which sentence is correctly constructed (no dangling modifier)?", "choices": ["To qualify for the scholarship, students must maintain a 3.5 GPA.", "To qualify for the scholarship, a 3.5 GPA must be maintained.", "A 3.5 GPA must be maintained to qualify for the scholarship, itself.", "Qualifying for the scholarship, maintaining a 3.5 GPA is required."], "correctIndex": 0, "explanation": "\"To qualify for the scholarship\" needs a logical person as the subject -- a GPA can't qualify itself. Only \"students\" works."}, {"question": "Which sentence is correctly constructed (no dangling modifier)?", "choices": ["Before signing the contract, the lawyer reviewed every clause.", "Before signing the contract, every clause was reviewed.", "Every clause was reviewed before signing the contract, thoroughly.", "Signing the contract, every clause needed review first."], "correctIndex": 0, "explanation": "\"Before signing the contract\" needs the signer as the subject -- a clause doesn't sign a contract. Only \"the lawyer\" works."}, {"question": "Which sentence is correctly constructed (no dangling modifier)?", "choices": ["After cleaning the house, Sam finally relaxed.", "After cleaning the house, relaxation finally came.", "Relaxation finally came after cleaning the house today.", "Cleaning the house, the evening finally brought relaxation."], "correctIndex": 0, "explanation": "\"After cleaning the house\" needs the cleaner as the subject -- relaxation can't clean a house. Only \"Sam\" works."}, {"question": "Which sentence is correctly constructed (no dangling modifier)?", "choices": ["To reach the summit by noon, the climbers woke up at dawn.", "To reach the summit by noon, dawn came early.", "Dawn arrived early to reach the summit by noon.", "Reaching the summit by noon, an early start was necessary."], "correctIndex": 0, "explanation": "\"To reach the summit by noon\" needs the climbers as the subject -- dawn isn't trying to reach a summit. Only \"the climbers\" works."}, {"question": "Having spent countless hours rehearsing every line, __the audition was approached by the actress__ with quiet confidence.\n\nWhich choice most logically completes the sentence?", "choices": ["NO CHANGE", "the actress approached the audition", "confidence was shown in the audition", "the audition was confidently approached"], "correctIndex": 1, "explanation": "\"Having spent countless hours rehearsing\" describes the actress, not the audition -- an audition can't rehearse. Only \"the actress approached the audition\" puts the logical subject right after the modifier."}, {"question": "After analyzing years of climate data, __a troubling pattern was recognized by the researchers__.\n\nWhich choice most logically completes the sentence?", "choices": ["NO CHANGE", "the researchers recognized a troubling pattern", "a troubling pattern emerged for the researchers", "the pattern, troubling to researchers, was recognized"], "correctIndex": 1, "explanation": "\"After analyzing years of climate data\" describes the researchers, who did the analyzing -- a pattern can't analyze data. Only \"the researchers recognized...\" places the logical subject right after the modifier."}, {"question": "Exhausted after the overnight shift, __a cup of coffee seemed essential to the nurse__.\n\nWhich choice most logically completes the sentence?", "choices": ["NO CHANGE", "the nurse considered a cup of coffee essential", "coffee, essential to the nurse, seemed exhausting", "a cup of coffee was needed for exhaustion"], "correctIndex": 1, "explanation": "\"Exhausted after the overnight shift\" describes the nurse, not the coffee -- coffee can't be exhausted. Only \"the nurse considered...\" works."}, {"question": "Determined to finish before sunset, __the trail was hiked quickly by the campers__.\n\nWhich choice most logically completes the sentence?", "choices": ["NO CHANGE", "the campers hiked the trail quickly", "the trail, determined and quick, was hiked", "quickly hiking, determination filled the trail"], "correctIndex": 1, "explanation": "\"Determined to finish before sunset\" describes the campers, not the trail -- a trail can't be determined. Only \"the campers hiked...\" works."}, {"question": "Newly renovated and freshly painted, __visitors admired the historic building__.\n\nWhich choice most logically completes the sentence?", "choices": ["NO CHANGE", "the historic building impressed visitors", "the building's visitors were newly renovated", "admiration for the building was newly painted"], "correctIndex": 1, "explanation": "\"Newly renovated and freshly painted\" describes the building, not the visitors -- visitors can't be renovated. Only \"the historic building impressed visitors\" places the building right after the modifier."}, {"question": "To secure funding for the new wing, __a proposal was drafted by the hospital's board__.\n\nWhich choice most logically completes the sentence?", "choices": ["NO CHANGE", "the hospital's board drafted a proposal", "a proposal, secured by the board, was funded", "funding for the wing drafted a proposal"], "correctIndex": 1, "explanation": "\"To secure funding for the new wing\" describes the board's purpose in acting -- a proposal can't secure funding by being drafted. Only \"the hospital's board drafted a proposal\" gives a logical actor."}, {"question": "Startled by the sudden noise, __the counter was jumped off of by the cat__.\n\nWhich choice most logically completes the sentence?", "choices": ["NO CHANGE", "the cat jumped off the counter", "the counter, startled, held the cat", "jumping off, the counter startled the cat"], "correctIndex": 1, "explanation": "\"Startled by the sudden noise\" describes the cat, not the counter -- a counter can't be startled. Only \"the cat jumped off the counter\" places the logical subject right after the modifier."}, {"question": "Eager to make a good impression, __the interview was prepared for extensively by the candidate__.\n\nWhich choice most logically completes the sentence?", "choices": ["NO CHANGE", "the candidate prepared extensively for the interview", "the interview, eager and extensive, went well", "preparation for the interview felt eager"], "correctIndex": 1, "explanation": "\"Eager to make a good impression\" describes the candidate, not the interview -- an interview can't feel eager. Only \"the candidate prepared...\" places the logical subject right after the modifier."}]}, "appositives": {"name": "Appositives & Clause-Joining Mechanics", "lesson": "**Appositives -- seven ways they get tested**\n\nAn appositive is a noun phrase that renames or identifies another noun,\nright next to it. That sounds simple, but the ACT tests it in at least\nseven distinct disguises:\n\n1. **Basic attachment**: a bare noun phrase joined by ONE comma to an\n   independent clause. The trap: a wrong choice sneaks in a hidden verb\n   (\"it was...\", \"this is...\") that turns the appositive into a second\n   full sentence -- a comma splice.\n\n2. **Redundant restatement**: the same comma-splice trap, but the question\n   asks about concision/redundancy instead of grammar directly. Same fix:\n   strip it down to a bare noun phrase.\n\n3. **Dash-pair bookend matching**: if the appositive is already closed\n   with a dash somewhere in the sentence, the opening punctuation must\n   also be a dash -- a comma there creates a mismatched pair.\n\n4. **\"Which is NOT acceptable\"**: three of four choices are all valid\n   appositive phrasings; one secretly forms a complete clause. You have to\n   verify three answers are fine, not just find the one that's right.\n\n5. **Zero-connector appositives**: a relative pronoun (\"whose,\" \"whom\")\n   gets wrongly inserted where NO connector is needed -- a pure appositive\n   attaches with just a comma, nothing else. Fix: delete the pronoun.\n\n6. **Essential title-then-name appositives** (the highest-value pattern to\n   master) -- but the real rule is NOT simply \"title before name means no\n   commas.\" That's a trap. The actual test is whether the role is\n   GENERIC/INDEFINITE (many people could hold it) or UNIQUE/DEFINITE (only\n   one person holds it at a time):\n   - Generic role, no \"the,\" nothing marking it as one-of-a-kind (\"Polish\n     architect Jakub Szczesny,\" \"veteran journalist Samuel Okoye\") ->\n     ESSENTIAL, zero commas. Many people could be \"a Polish architect.\"\n   - Unique role -- signaled by \"the,\" a possessive (\"our,\" \"her\"), or a\n     superlative (\"oldest,\" \"first\") -- means only one person could hold\n     it (\"the mayor of Springfield, Rebecca Wallace,\" \"our head coach,\n     Diane Foster,\") -> NONESSENTIAL, needs a full comma pair, even\n     though the structure looks identical to the no-comma pattern.\n   Don't just pattern-match on word order -- check whether the role\n   itself could describe one person or many.\n\n7. **Concision between two valid options**: sometimes BOTH a compound\n   predicate (\"The nebula is home to thousands of stars, and is often\n   called...\") AND an appositive version (\"The nebula, home to thousands\n   of stars, is often called...\") are grammatically correct -- neither\n   is a grammar error. The actual test is concision: the appositive\n   version says the same thing with one less repeated verb, so it wins.\n   Watch for two OTHER choices mixed in that ARE genuinely broken: a\n   comma wedged between a subject and its own verb, or an \"and\" left with\n   nothing to coordinate once a verb phrase gets demoted into an\n   appositive. Rule out the truly broken options first, then pick the\n   more concise of the two grammatically valid survivors.\n\n\n**8. FANBOYS: the comma-before-conjunction rule**\n\nFor, And, Nor, But, Or, Yet, So -- when one of these joins two INDEPENDENT\nCLAUSES (each side has its own subject and could stand alone as a full\nsentence), put a comma before it.\n\nWhen a FANBOYS word joins two things that are NOT both independent\nclauses -- most often a compound predicate, where one subject shares two\nverbs -- no comma at all.\n\nThe test: can what follows the conjunction stand alone as a complete\nsentence, with its own subject? If yes, comma. If it's missing a subject\n(just a second verb tacked onto the first), no comma.\n\n*Needs a comma (both sides are independent clauses):* She finished her\nhomework, and she went outside to play.\n*No comma (compound predicate, one shared subject):* She finished her\nhomework and went outside to play.\n\n\n**9. Hyphens for compound modifiers** (a different skill from dashes --\neasy to confuse since they look similar)\n\nHyphenate two or more words when they work TOGETHER to modify a noun\nimmediately following them:\n*Before the noun (hyphenated):* a well-known author, a high-speed chase,\na ten-page essay.\n*After the noun (no hyphen):* The author is well known. The chase\nhappened at high speed.\n*Never hyphenate after an \"-ly\" adverb:* a highly trained team (not\n\"highly-trained\"), a newly renovated building.\n*Numbers and fractions are hyphenated:* twenty-one, one-third.\n\n**10. Em-dash as a colon substitute**\n\nBeyond marking nonessential info, a single dash can introduce a list or\nexplanation after a complete sentence -- exactly like a colon.\n*Example:* The company had one priority -- cutting costs across every\ndepartment.\nSame rule as a colon applies: what comes before the dash must be a\ncomplete sentence on its own.\n", "flashcards": [{"front": "What's the #1 trap in basic appositive-attachment questions?", "back": "A hidden verb sneaks into what should be a bare noun phrase, creating a splice.\nWrong: The old clock, it was a gift from her grandfather, still runs.\nRight: The old clock, a gift from her grandfather, still runs."}, {"front": "Dash-pair rule for appositives?", "back": "If the appositive closes with a dash, it must open with one too.\nWrong: The trail offers three routes, easy, moderate, difficult\u2014each marked by color.\nRight: The trail offers three routes\u2014easy, moderate, difficult\u2014each marked by color."}, {"front": "\"Which is NOT acceptable\" question type -- what's the trick?", "back": "Three choices are valid noun-phrase appositives; the impostor secretly forms a full clause.\nThe impostor: They admired the mural, it was a colorful depiction of local history. (splice)\nA valid option: They admired the mural, a colorful depiction of local history."}, {"front": "When does an appositive need NO connecting word at all?", "back": "Always -- a pure appositive attaches with just a comma.\nWrong: The medal went to Sana Malik, whose a first-time competitor.\nRight: The medal went to Sana Malik, a first-time competitor."}, {"front": "THE key rule: word order flips everything.", "back": "Essential (title before name, no commas): Polish architect Jakub Szczesny noticed the gap.\nNonessential (name before description, needs commas): Jakub Szczesny, a Polish architect, noticed the gap."}, {"front": "Quick test for title-then-name appositives: does it need commas?", "back": "Check whether the role is generic or unique -- word order alone isn't enough.\nGeneric, no commas: veteran journalist Samuel Okoye\nUnique, needs commas: the mayor of Springfield, Rebecca Wallace,"}, {"front": "\"Title before name\" always means no commas, right?", "back": "No -- that's the trap. \"The,\" a possessive, or a superlative signals a unique role.\nLooks the same, opposite answer: our head coach, Diane Foster, (needs commas -- \"our\" signals only one coach)"}, {"front": "\"The mayor of Springfield, Rebecca Wallace,\" -- why commas despite title-before-name?", "back": "\"Mayor of Springfield\" is a unique role -- the name is nonessential extra detail. Compare: \"Polish architect Jakub Szczesny\" needs none, since many people could hold that generic title."}, {"front": "How do you fix two verbs stacked onto one subject?", "back": "Turn the first verb phrase into an appositive -- but note both versions can be grammatically VALID, just one is more concise.\nValid but wordier: The nebula is home to thousands of stars, and is often called a stellar nursery.\nValid and tighter: The nebula, home to thousands of stars, is often called a stellar nursery."}, {"front": "FANBOYS rule: when does a coordinating conjunction need a comma before it?", "back": "Only when it joins two independent clauses (each with its own subject).\nNeeds comma: She finished her homework, and she went outside.\nNo comma (compound predicate): She finished her homework and went outside."}, {"front": "Quick test for the FANBOYS comma rule?", "back": "Can what follows the conjunction stand alone as a full sentence with its own subject? Yes -> comma. No (just a second verb) -> no comma."}, {"front": "Hyphen rule for compound modifiers -- before vs. after the noun?", "back": "Before the noun: hyphenate (a well-known author). After the noun: no hyphen (The author is well known)."}, {"front": "Do you hyphenate after an \"-ly\" adverb?", "back": "Never. \"A highly trained team,\" not \"highly-trained.\" The -ly already signals it's an adverb modifying the adjective, so no hyphen is needed to link them."}, {"front": "Besides marking nonessential info, what's a dash's other main job?", "back": "Introducing a list or explanation after a complete sentence -- exactly like a colon. Example: The company had one priority -- cutting costs."}], "bank": [{"question": "The old lighthouse keeper's log, __it was a leather-bound volume filled with decades of weather notes__, sold at auction for a surprising sum.\n\nWhich choice makes the underlined portion most grammatically acceptable?", "c
