A negative exponent means reciprocal, not negative: 10^(-2) = 1/10^2 = 1/100 = 1/100."}, {"question": "What is 10^(-3)?", "choices": ["1000", "-1000", "1/1000", "1/100"], "correctIndex": 2, "explanation": "A negative exponent means reciprocal, not negative: 10^(-3) = 1/10^3 = 1/1000 = 1/1000."}, {"question": "What is 3^(-2)?", "choices": ["1/9", "-9", "9", "1/3"], "correctIndex": 0, "explanation": "A negative exponent means reciprocal, not negative: 3^(-2) = 1/3^2 = 1/9 = 1/9."}, {"question": "What is 10^(-3)?", "choices": ["1/1000", "-1000", "1000", "1/100"], "correctIndex": 0, "explanation": "A negative exponent means reciprocal, not negative: 10^(-3) = 1/10^3 = 1/1000 = 1/1000."}, {"question": "What is 10^(-4)?", "choices": ["1/10000", "10000", "-10000", "1/1000"], "correctIndex": 0, "explanation": "A negative exponent means reciprocal, not negative: 10^(-4) = 1/10^4 = 1/10000 = 1/10000."}, {"question": "What is 4^(1/2)?", "choices": ["0", "2", "4", "3"], "correctIndex": 1, "explanation": "4^(1/2) means the 2-th root of 4, which is 2."}, {"question": "What is 8^(1/3)?", "choices": ["2", "3", "4", "8"], "correctIndex": 0, "explanation": "8^(1/3) means the 3-th root of 8, which is 2."}, {"question": "What is 9^(2/2)?", "choices": ["4", "18", "9", "3"], "correctIndex": 2, "explanation": "9^(1/2) means the 2-th root of 9, which is 3. Then raise that to the 2 power: 3^2 = 9."}, {"question": "What is 16^(2/2)?", "choices": ["16", "32", "4", "8"], "correctIndex": 0, "explanation": "16^(1/2) means the 2-th root of 16, which is 4. Then raise that to the 2 power: 4^2 = 16."}, {"question": "What is 16^(2/4)?", "choices": ["5", "2", "32", "4"], "correctIndex": 3, "explanation": "16^(1/4) means the 4-th root of 16, which is 2. Then raise that to the 2 power: 2^2 = 4."}, {"question": "What is 25^(2/2)?", "choices": ["12", "5", "50", "25"], "correctIndex": 3, "explanation": "25^(1/2) means the 2-th root of 25, which is 5. Then raise that to the 2 power: 5^2 = 25."}, {"question": "What is 27^(2/3)?", "choices": ["9", "3", "10", "54"], "correctIndex": 0, "explanation": "27^(1/3) means the 3-th root of 27, which is 3. Then raise that to the 2 power: 3^2 = 9."}, {"question": "What is 32^(1/5)?", "choices": ["2", "6", "32", "4"], "correctIndex": 0, "explanation": "32^(1/5) means the 5-th root of 32, which is 2."}, {"question": "Solve for x: 4^(x + 2) = 8^(x - 2)", "choices": ["11", "-10", "-4", "10"], "correctIndex": 3, "explanation": "Rewrite both sides with base 2: 4 = 2^2, 8 = 2^3. So 2(x + 2) = 3(x - 2). Solving that linear equation gives x = 10."}, {"question": "Solve for x: 9^(x + 2) = 27^(x + 1)", "choices": ["2", "-4", "1", "-1"], "correctIndex": 2, "explanation": "Rewrite both sides with base 3: 9 = 3^2, 27 = 3^3. So 2(x + 2) = 3(x + 1). Solving that linear equation gives x = 1."}, {"question": "Solve for x: 25^(x - 4) = 125^(x + 3)", "choices": ["7", "17", "-17", "18"], "correctIndex": 2, "explanation": "Rewrite both sides with base 5: 25 = 5^2, 125 = 5^3. So 2(x - 4) = 3(x + 3). Solving that linear equation gives x = -17."}, {"question": "Solve for x: 16^(x - 3) = 64^(x - 4)", "choices": ["-6", "6", "-1", "1"], "correctIndex": 1, "explanation": "Rewrite both sides with base 2: 16 = 2^4, 64 = 2^6. So 4(x - 3) = 6(x - 4). Solving that linear equation gives x = 6."}, {"question": "Solve for x: 8^(x - 2) = 32^(x + 1)", "choices": ["13/2", "3", "11/2", "-11/2"], "correctIndex": 3, "explanation": "Rewrite both sides with base 2: 8 = 2^3, 32 = 2^5. So 3(x - 2) = 5(x + 1). Solving that linear equation gives x = -11/2."}, {"question": "Solve for x: 9^(x - 1) = 81^(x + 3)", "choices": ["7", "4", "5", "-7"], "correctIndex": 3, "explanation": "Rewrite both sides with base 3: 9 = 3^2, 81 = 3^4. So 2(x - 1) = 4(x + 3). Solving that linear equation gives x = -7."}, {"question": "Solve for x: 27^(x - 4) = 81^(x + 1)", "choices": ["-16", "16", "5", "19"], "correctIndex": 0, "explanation": "Rewrite both sides with base 3: 27 = 3^3, 81 = 3^4. So 3(x - 4) = 4(x + 1). Solving that linear equation gives x = -16."}, {"question": "Solve for x: x^(3/2) = 8", "choices": ["6", "8", "9", "4"], "correctIndex": 3, "explanation": "Raise both sides to the reciprocal power, 2/3: x = 8^(2/3) = 4."}, {"question": "Solve for x: x^(2/3) = 25", "choices": ["25", "128", "125", "26"], "correctIndex": 2, "explanation": "Raise both sides to the reciprocal power, 3/2: x = 25^(3/2) = 125."}, {"question": "Solve for x: x^(2/4) = 4", "choices": ["16", "20", "2", "8"], "correctIndex": 0, "explanation": "Raise both sides to the reciprocal power, 4/2: x = 4^(4/2) = 16."}, {"question": "Solve for x: x^(3/2) = 125", "choices": ["126", "125", "27", "25"], "correctIndex": 3, "explanation": "Raise both sides to the reciprocal power, 2/3: x = 125^(2/3) = 25."}, {"question": "Solve for x: x^(3/2) = 64", "choices": ["16", "512", "65", "18"], "correctIndex": 0, "explanation": "Raise both sides to the reciprocal power, 2/3: x = 64^(2/3) = 16."}, {"question": "Solve for x: x^(3/2) = 27", "choices": ["18", "27", "9", "11"], "correctIndex": 2, "explanation": "Raise both sides to the reciprocal power, 2/3: x = 27^(2/3) = 9."}, {"question": "Simplify: (x^-3 * x^-5) / x^3", "choices": ["x^-11", "x^-1", "x^-5", "x^-8"], "correctIndex": 0, "explanation": "Combine the numerator first (add exponents): -3 + -5 = -8. Then subtract the denominator's exponent: -8 - (3) = -11. Result: x^-11."}, {"question": "Simplify: (x^-3 * x^-3) / x^-1", "choices": ["x^-5", "x^-6", "x^1", "x^-7"], "correctIndex": 0, "explanation": "Combine the numerator first (add exponents): -3 + -3 = -6. Then subtract the denominator's exponent: -6 - (-1) = -5. Result: x^-5."}, {"question": "Simplify: (x^-5 * x^-2) / x^6", "choices": ["x^-1", "x^-7", "x^-9", "x^-13"], "correctIndex": 3, "explanation": "Combine the numerator first (add exponents): -5 + -2 = -7. Then subtract the denominator's exponent: -7 - (6) = -13. Result: x^-13."}, {"question": "Simplify: (x^5 * x^-6) / x^5", "choices": ["x^4", "x^-6", "x^6", "x^-1"], "correctIndex": 1, "explanation": "Combine the numerator first (add exponents): 5 + -6 = -1. Then subtract the denominator's exponent: -1 - (5) = -6. Result: x^-6."}, {"question": "Simplify: (x^6 * x^-2) / x^5", "choices": ["x^3", "x^-1", "x^9", "x^4"], "correctIndex": 1, "explanation": "Combine the numerator first (add exponents): 6 + -2 = 4. Then subtract the denominator's exponent: 4 - (5) = -1. Result: x^-1."}, {"question": "Simplify: (x^0 * x^-1) / x^-3", "choices": ["x^4", "x^2", "x^-1", "x^-4"], "correctIndex": 1, "explanation": "Combine the numerator first (add exponents): 0 + -1 = -1. Then subtract the denominator's exponent: -1 - (-3) = 2. Result: x^2."}]}, "logarithms": {"name": "Logarithms", "lesson": "**Logarithms -- what they mean and how to use them**\n\nlog_b(x) = y means the exact same thing as b^y = x. A logarithm just asks\n\"what power do I need to raise b to, to get x?\" These are two ways of\nwriting the same relationship -- converting between them is the single most\nuseful skill for this topic.\n\nExample: log_2(8) = 3 because 2^3 = 8.\n\nLog rules (these mirror the exponent rules, since logs and exponents are\ninverses of each other):\n- Product rule: log_b(xy) = log_b(x) + log_b(y)\n- Quotient rule: log_b(x/y) = log_b(x) - log_b(y)\n- Power rule: log_b(x^n) = n * log_b(x)\n\nSolving equations:\n- If log_b(x) = c, then x = b^c (rewrite in exponential form and evaluate).\n- If b^x = c, then x = log_b(c) (rewrite in log form -- often solvable by\n  spotting that c is a clean power of b).\n\n\n**Advanced: quadratic-in-disguise log equations**\n\nlog_b(x) + log_b(x-k) = m combines (product rule) into log_b(x(x-k)) = m,\nwhich becomes the exponential equation x(x-k) = b^m -- a quadratic. Solving\nit gives TWO roots, but only the positive one where BOTH original log\narguments are positive is valid. The other root is extraneous and must be\nrejected -- always check both original log arguments before finalizing.\n\n**Advanced: when the equation doesn't reduce to a clean number**\n\nSolving b^x = c doesn't always give a clean integer. When c isn't a clean\npower of b, the answer is simply left in log form: x = log_b(c). That's a\ncompletely valid, exact final answer -- you don't need a decimal.\n\n**Change of base**: log_b(x) can always be rewritten as log(x) / log(b)\n(using any base for both, as long as it's the same base top and bottom).\n", "flashcards": [{"front": "What does log_b(x) = y mean, in exponential form?", "back": "b^y = x. A log answers 'what power gives me x?'"}, {"front": "Log product rule: log_b(xy) = ?", "back": "log_b(x) + log_b(y)"}, {"front": "Log quotient rule: log_b(x/y) = ?", "back": "log_b(x) - log_b(y)"}, {"front": "Log power rule: log_b(x^n) = ?", "back": "n * log_b(x)"}, {"front": "How do you solve log_b(x) = c for x?", "back": "Rewrite in exponential form: x = b^c."}, {"front": "How do you solve b^x = c for x?", "back": "Rewrite in log form: x = log_b(c). Often c is a clean power of b, making this easy to evaluate directly."}, {"front": "log_b(x) + log_b(x-k) = m combines into a quadratic. How many of its roots are valid?", "back": "Usually only one -- reject any root that makes either original log argument zero or negative."}, {"front": "What do you do when b^x = c doesn't give a clean integer for x?", "back": "Leave the answer in log form: x = log_b(c). That's a complete, exact answer."}, {"front": "Change of base formula: log_b(x) = ?", "back": "log(x) / log(b) -- using any consistent base for both logs."}], "bank": [{"question": "What is log_2(2)?", "choices": ["-1", "2", "4", "1"], "correctIndex": 3, "explanation": "log_2(2) asks 'what power of 2 gives 2?' Since 2^1 = 2, log_2(2) = 1."}, {"question": "What is log_2(4)?", "choices": ["3", "2", "0", "4"], "correctIndex": 1, "explanation": "log_2(4) asks 'what power of 2 gives 4?' Since 2^2 = 4, log_2(4) = 2."}, {"question": "What is log_2(8)?", "choices": ["2", "8", "4", "3"], "correctIndex": 3, "explanation": "log_2(8) asks 'what power of 2 gives 8?' Since 2^3 = 8, log_2(8) = 3."}, {"question": "What is log_2(16)?", "choices": ["16", "5", "2", "4"], "correctIndex": 3, "explanation": "log_2(16) asks 'what power of 2 gives 16?' Since 2^4 = 16, log_2(16) = 4."}, {"question": "What is log_2(32)?", "choices": ["6", "2", "5", "32"], "correctIndex": 2, "explanation": "log_2(32) asks 'what power of 2 gives 32?' Since 2^5 = 32, log_2(32) = 5."}, {"question": "What is log_3(3)?", "choices": ["1", "3", "-1", "2"], "correctIndex": 0, "explanation": "log_3(3) asks 'what power of 3 gives 3?' Since 3^1 = 3, log_3(3) = 1."}, {"question": "What is log_3(9)?", "choices": ["3", "0", "2", "9"], "correctIndex": 2, "explanation": "log_3(9) asks 'what power of 3 gives 9?' Since 3^2 = 9, log_3(9) = 2."}, {"question": "What is log_3(27)?", "choices": ["27", "3", "4", "1"], "correctIndex": 1, "explanation": "log_3(27) asks 'what power of 3 gives 27?' Since 3^3 = 27, log_3(27) = 3."}, {"question": "What is log_3(81)?", "choices": ["3", "4", "5", "81"], "correctIndex": 1, "explanation": "log_3(81) asks 'what power of 3 gives 81?' Since 3^4 = 81, log_3(81) = 4."}, {"question": "What is log_5(5)?", "choices": ["-1", "5", "1", "2"], "correctIndex": 2, "explanation": "log_5(5) asks 'what power of 5 gives 5?' Since 5^1 = 5, log_5(5) = 1."}, {"question": "What is log_5(25)?", "choices": ["5", "3", "2", "25"], "correctIndex": 2, "explanation": "log_5(25) asks 'what power of 5 gives 25?' Since 5^2 = 25, log_5(25) = 2."}, {"question": "What is log_5(125)?", "choices": ["5", "3", "125", "4"], "correctIndex": 1, "explanation": "log_5(125) asks 'what power of 5 gives 125?' Since 5^3 = 125, log_5(125) = 3."}, {"question": "What is log_10(10)?", "choices": ["2", "1", "-1", "10"], "correctIndex": 1, "explanation": "log_10(10) asks 'what power of 10 gives 10?' Since 10^1 = 10, log_10(10) = 1."}, {"question": "What is log_10(100)?", "choices": ["10", "3", "100", "2"], "correctIndex": 3, "explanation": " ised to the 0 power is 1, so log_7(1) = 0 no matter what the base is."}, {"question": "What is log_7(7)?", "choices": ["0", "1", "7", "49"], "correctIndex": 1, "explanation": "7^1 = 7, so log_7(7) = 1. This is true for any base."}, {"question": "What is log_10(1)?", "choices": ["10", "0", "1", "undefined"], "correctIndex": 1, "explanation": "Any base raised to the 0 power is 1, so log_10(1) = 0 no matter what the base is."}, {"question": "What is log_10(10)?", "choices": ["100", "1", "10", "0"], "correctIndex": 1, "explanation": "10^1 = 10, so log_10(10) = 1. This is true for any base."}, {"question": "log_5(25) + log_5(25) = log_5(?). What is that missing number?", "choices": ["625", "3125", "50", "25"], "correctIndex": 0, "explanation": "By the product rule, log_5(25) + log_5(25) = log_5(25*25) = log_5(625)."}, {"question": "log_5(3125) - log_5(5) = log_5(?). What is that missing number?", "choices": ["15625", "3120", "625", "5"], "correctIndex": 2, "explanation": "By the quotient rule, log_5(3125) - log_5(5) = log_5(3125/5) = log_5(625)."}, {"question": "log_2(32) - log_2(8) = log_2(?). What is that missing number?", "choices": ["4", "2", "24", "256"], "correctIndex": 0, "explanation": "By the quotient rule, log_2(32) - log_2(8) = log_2(32/8) = log_2(4)."}, {"question": "log_2(32) - log_2(8) = log_2(?). What is that missing number?", "choices": ["256", "24", "2", "4"], "correctIndex": 3, "explanation": "By the quotient rule, log_2(32) - log_2(8) = log_2(32/8) = log_2(4)."}, {"question": "log_2(4) + log_2(4) = log_2(?). What is that missing number?", "choices": ["4", "32", "8", "16"], "correctIndex": 3, "explanation": "By the product rule, log_2(4) + log_2(4) = log_2(4*4) = log_2(16)."}, {"question": "Solve for x: log_5(x) = 2", "choices": ["2", "125", "10", "25"], "correctIndex": 3, "explanation": "Rewrite in exponential form: x = 5^2 = 25."}, {"question": "Solve for x: log_4(x) = 2", "choices": ["64", "8", "2", "16"], "correctIndex": 3, "explanation": "Rewrite in exponential form: x = 4^2 = 16."}, {"question": "Solve for x: log_3(x) = 3", "choices": ["9", "27", "81", "3"], "correctIndex": 1, "explanation": "Rewrite in exponential form: x = 3^3 = 27."}, {"question": "Solve for x: log_2(x) = 3", "choices": ["3", "16", "6", "8"], "correctIndex": 3, "explanation": "Rewrite in exponential form: x = 2^3 = 8."}, {"question": "Solve for x: log_2(x) = 1", "choices": ["1", "2", "3", "4"], "correctIndex": 1, "explanation": "Rewrite in exponential form: x = 2^1 = 2."}, {"question": "Solve for x: 2^x = 8", "choices": ["8", "3", "4", "2"], "correctIndex": 1, "explanation": "Rewrite in log form: x = log_2(8). Since 2^3 = 8, x = 3."}, {"question": "Solve for x: 4^x = 64", "choices": ["3", "4", "1", "64"], "correctIndex": 0, "explanation": "Rewrite in log form: x = log_4(64). Since 4^3 = 64, x = 3."}, {"question": "Solve for x: 2^x = 2", "choices": ["1", "-1", "2", "4"], "correctIndex": 0, "explanation": "Rewrite in log form: x = log_2(2). Since 2^1 = 2, x = 1."}, {"question": "Solve for x: 2^x = 2", "choices": ["2", "-1", "4", "1"], "correctIndex": 3, "explanation": "Rewrite in log form: x = log_2(2). Since 2^1 = 2, x = 1."}, {"question": "Solve for x: 4^x = 4", "choices": ["-1", "4", "2", "1"], "correctIndex": 3, "explanation": "Rewrite in log form: x = log_4(4). Since 4^1 = 4, x = 1."}, {"question": "Solve for x: log_3(x) + log_3(x - 240) = 6", "choices": ["483", "242", "243", "-3"], "correctIndex": 2, "explanation": "Combine with the product rule: log_3(x(x-240)) = 6, so x(x-240) = 3^6 = 729. That's the quadratic x^2 - 240x - 729 = 0, with roots x = 243 and x = -3. Reject x = -3 -- it makes log_3(x) undefined (negative argument). x = 243."}, {"question": "Solve for x: log_2(x) + log_2(x - 14) = 5", "choices": ["15", "30", "16", "-2"], "correctIndex": 2, "explanation": "Combine with the product rule: log_2(x(x-14)) = 5, so x(x-14) = 2^5 = 32. That's the quadratic x^2 - 14x - 32 = 0, with roots x = 16 and x = -2. Reject x = -2 -- it makes log_2(x) undefined (negative argument). x = 16."}, {"question": "Solve for x: log_3(x) + log_3(x - 6) = 3", "choices": ["8", "9", "-3", "15"], "correctIndex": 1, "explanation": "Combine with the product rule: log_3(x(x-6)) = 3, so x(x-6) = 3^3 = 27. That's the quadratic x^2 - 6x - 27 = 0, with roots x = 9 and x = -3. Reject x = -3 -- it makes log_3(x) undefined (negative argument). x = 9."}, {"question": "Solve for x: log_2(x) + log_2(x - 6) = 4", "choices": ["-2", "7", "8", "14"], "correctIndex": 2, "explanation": "Combine with the product rule: log_2(x(x-6)) = 4, so x(x-6) = 2^4 = 16. That's the quadratic x^2 - 6x - 16 = 0, with roots x = 8 and x = -2. Reject x = -2 -- it makes log_2(x) undefined (negative argument). x = 8."}, {"question": "Solve for x: log_3(x) + log_3(x - 78) = 5", "choices": ["159", "81", "-3", "80"], "correctIndex": 1, "explanation": "Combine with the product rule: log_3(x(x-78)) = 5, so x(x-78) = 3^5 = 243. That's the quadratic x^2 - 78x - 243 = 0, with roots x = 81 and x = -3. Reject x = -3 -- it makes log_3(x) undefined (negative argument). x = 81."}, {"question": "Solve for x: log_2(x) + log_2(x - 2) = 3", "choices": ["3", "4", "-2", "6"], "correctIndex": 1, "explanation": "Combine with the product rule: log_2(x(x-2)) = 3, so x(x-2) = 2^3 = 8. That's the quadratic x^2 - 2x - 8 = 0, with roots x = 4 and x = -2. Reject x = -2 -- it makes log_2(x) undefined (negative argument). x = 4."}, {"question": "Solve for x: 5^x = 32", "choices": ["log_32(5)", "27", "32/5", "log_5(32)"], "correctIndex": 3, "explanation": "32 is not a clean power of 5, so the exact answer stays in log form: x = log_5(32). (This is a fully valid final answer -- no decimal needed.)"}, {"question": "Solve for x: 5^x = 53", "choices": ["48", "53/5", "log_5(53)", "log_53(5)"], "correctIndex": 2, "explanation": "53 is not a clean power of 5, so the exact answer stays in log form: x = log_5(53). (This is a fully valid final answer -- no decimal needed.)"}, {"question": "Solve for x: 2^x = 14", "choices": ["log_14(2)", "12", "log_2(14)", "7"], "correctIndex": 2, "explanation": "14 is not a clean power of 2, so the exact answer stays in log form: x = log_2(14). (This is a fully valid final answer -- no decimal needed.)"}, {"question": "Solve for x: 5^x = 38", "choices": ["log_5(38)", "38/5", "33", "log_38(5)"], "correctIndex": 0, "explanation": "38 is not a clean power of 5, so the exact answer stays in log form: x = log_5(38). (This is a fully valid final answer -- no decimal needed.)"}, {"question": "Solve for x: 2^x = 54", "choices": ["27", "52", "log_2(54)", "log_54(2)"], "correctIndex": 2, "explanation": "54 is not a clean power of 2, so the exact answer stays in log form: x = log_2(54). (This is a fully valid final answer -- no decimal needed.)"}, {"question": "log_8(10) is equivalent to which of the following (change of base)?", "choices": ["log(8)/log(10)", "log(10 - 8)", "log(10)/log(8)", "log(10) * log(8)"], "correctIndex": 2, "explanation": "Change of base: log_8(10) = log(10) / log(8) -- the argument goes on top, the base goes on the bottom, using any consistent base for both logs."}, {"question": "log_5(18) is equivalent to which of the following (change of base)?", "choices": ["log(5)/log(18)", "log(18)/log(5)", "log(18 - 5)", "log(18) * log(5)"], "correctIndex": 1, "explanation": "Change of base: log_5(18) = log(18) / log(5) -- the argument goes on top, the base goes on the bottom, using any consistent base for both logs."}, {"question": "log_6(26) is equivalent to which of the following (change of base)?", "choices": ["log(26 - 6)", "log(6)/log(26)", "log(26)/log(6)", "log(26) * log(6)"], "correctIndex": 2, "explanation": "Change of base: log_6(26) = log(26) / log(6) -- the argument goes on top, the base goes on the bottom, using any consistent base for both logs."}, {"question": "log_4(3) is equivalent to which of the following (change of base)?", "choices": ["log(3 - 4)", "log(4)/log(3)", "log(3)/log(4)", "log(3) * log(4)"], "correctIndex": 2, "explanation": "Change of base: log_4(3) = log(3) / log(4) -- the argument goes on top, the base goes on the bottom, using any consistent base for both logs."}]}, "counting_methods": {"name": "Counting Methods", "lesson": "**Counting methods**\n\nFundamental Counting Principle: if you're making a sequence of independent\nchoices, multiply the number of options at each step.\nExample: 3 appetizers, 4 entrees, 2 desserts -> 3 x 4 x 2 = 24 possible meals.\n\nFactorial: n! = n x (n-1) x (n-2) x ... x 1. It's the number of ways to\narrange n distinct things in a row. 0! is defined as 1.\n\nPermutations (order matters -- 1st place is different from 2nd place):\nnPr = n! / (n-r)!\nUse this when you're filling distinct ROLES or POSITIONS.\n\nCombinations (order doesn't matter -- a group is a group):\nnCr = n! / (r!(n-r)!)\nUse this when you're choosing a GROUP where no one's role differs from\nanyone else's (a committee, a hand of cards, a set of toppings).\n\nThe fastest way to tell them apart: ask \"if I picked the same people in a\ndifferent order, would that count as a different outcome?\" If yes ->\npermutation. If no (it's the same group either way) -> combination.\n\n\n**Advanced: Venn diagram / inclusion-exclusion counting**\n\nWhen two groups overlap, count(at least one) = count(A) + count(B) -\ncount(both). Count(neither) = grand total - count(at least one). This is\nthe same inclusion-exclusion idea from Compound OR, just counting people or\nitems directly instead of computing a probability fraction.\n", "flashcards": [{"front": "Fundamental Counting Principle: how do you count a sequence of independent choices?", "back": "Multiply the number of options at each step."}, {"front": "What does n! mean?", "back": "n x (n-1) x (n-2) x ... x 1 -- the number of ways to arrange n distinct things in a row."}, {"front": "Permutation formula, and when do you use it?", "back": "nPr = n! / (n-r)!. Use it when order matters -- filling distinct roles or positions."}, {"front": "Combination formula, and when do you use it?", "back": "nCr = n! / (r!(n-r)!). Use it when order doesn't matter -- choosing a group where no role differs."}, {"front": "Fastest way to tell permutation from combination?", "back": "Ask: would picking the same people in a different order count as a different outcome? Yes -> permutation. No -> combination."}, {"front": "How do you count how many are in NEITHER of two overlapping groups?", "back": "Neither = grand total - (count(A) + count(B) - count(both))."}], "bank": [{"question": "A restaurant offers 5 appetizers, 5 entrees. How many different meals are possible, choosing one of each?", "choices": ["25", "10", "125", "5"], "correctIndex": 0, "explanation": "Multiply the number of choices at each step: 5 x 5 = 25."}, {"question": "A restaurant offers 6 appetizers, 2 entrees, 5 desserts. How many different meals are possible, choosing one of each?", "choices": ["60", "13", "10", "360"], "correctIndex": 0, "explanation": "Multiply the number of choices at each step: 6 x 2 x 5 = 60."}, {"question": "A restaurant offers 2 appetizers, 2 entrees. How many different meals are possible, choosing one of each?", "choices": ["2", "5", "4", "8"], "correctIndex": 2, "explanation": "Multiply the number of choices at each step: 2 x 2 = 4."}, {"question": "A restaurant offers 6 appetizers, 4 entrees, 4 desserts, 6 drinks. How many different meals are possible, choosing one of each?", "choices": ["20", "3456", "576", "96"], "correctIndex": 2, "explanation": "Multiply the number of choices at each step: 6 x 4 x 4 x 6 = 576."}, {"question": "A restaurant offers 6 appetizers, 3 entrees, 5 desserts. How many different meals are possible, choosing one of each?", "choices": ["15", "540", "14", "90"], "correctIndex": 3, "explanation": "Multiply the number of choices at each step: 6 x 3 x 5 = 90."}, {"question": "A restaurant offers 6 appetizers, 2 entrees, 6 desserts, 6 drinks. How many different meals are possible, choosing one of each?", "choices": ["432", "20", "2592", "72"], "correctIndex": 0, "explanation": "Multiply the number of choices at each step: 6 x 2 x 6 x 6 = 432."}, {"question": "Evaluate 4!", "choices": ["10", "6", "16", "24"], "correctIndex": 3, "explanation": "4! = 4 x 3 x 2 x 1 = 24."}, {"question": "Evaluate 5!", "choices": ["25", "15", "120", "24"], "correctIndex": 2, "explanation": "5! = 5 x 4 x 3 x 2 x 1 = 120."}, {"question": "Evaluate 6!", "choices": ["21", "120", "720", "36"], "correctIndex": 2, "explanation": "6! = 6 x 5 x 4 x 3 x 2 x 1 = 720."}, {"question": "Evaluate 7!", "choices": ["49", "28", "720", "5040"], "correctIndex": 3, "explanation": "7! = 7 x 6 x 5 x 4 x 3 x 2 x 1 = 5040."}, {"question": "Evaluate 8!", "choices": ["5040", "40320", "64", "36"], "correctIndex": 1, "explanation": "8! = 8 x 7 x 6 x 5 x 4 x 3 x 2 x 1 = 40320."}, {"question": "How many different ways can 3 of 9 distinctly-named people finish in 1st through 3rd place?", "choices": ["72", "504", "84", "362880"], "correctIndex": 1, "explanation": "Order matters here (1st place differs from 2nd place), so use permutations: 9P3 = 9!/(9-3)! = 504."}, {"question": "How many different ways can 2 of 5 distinctly-named people finish in 1st through 2nd place?", "choices": ["10", "5", "120", "20"], "correctIndex": 3, "explanation": "Order matters here (1st place differs from 2nd place), so use permutations: 5P2 = 5!/(5-2)! = 20."}, {"question": "How many different ways can 3 of 5 distinctly-named people finish in 1st through 3rd place?", "choices": ["60", "10", "20", "120"], "correctIndex": 0, "explanation": "Order matters here (1st place differs from 2nd place), so use permutations: 5P3 = 5!/(5-3)! = 60."}, {"question": "How many different ways can 2 of 5 distinctly-named people finish in 1st through 2nd place?", "choices": ["5", "10", "120", "20"], "correctIndex": 3, "explanation": "Order matters here (1st place differs from 2nd place), so use permutations: 5P2 = 5!/(5-2)! = 20."}, {"question": "How many different ways can 2 of 8 distinctly-named people finish in 1st through 2nd place?", "choices": ["56", "40320", "28", "8"], "correctIndex": 0, "explanation": "Order matters here (1st place differs from 2nd place), so use permutations: 8P2 = 8!/(8-2)! = 56."}, {"question": "How many different ways can 3 of 8 distinctly-named people finish in 1st through 3rd place?", "choices": ["336", "56", "337", "40320"], "correctIndex": 0, "explanation": "Order matters here (1st place differs from 2nd place), so use permutations: 8P3 = 8!/(8-3)! = 336."}, {"question": "How many different 4-person committees can be formed from a group of 11 people?", "choices": ["7920", "165", "660", "330"], "correctIndex": 3, "explanation": "Order doesn't matter for a committee (it's the same group regardless of selection order), so use combinations: 11C4 = 11!/(4!(11-4)!) = 330."}, {"question": "How many different 3-person committees can be formed from a group of 12 people?", "choices": ["220", "1320", "66", "440"], "correctIndex": 0, "explanation": "Order doesn't matter for a committee (it's the same group regardless of selection order), so use combinations: 12C3 = 12!/(3!(12-3)!) = 220."}, {"question": "How many different 4-person committees can be formed from a group of 7 people?", "choices": ["35", "840", "36", "70"], "correctIndex": 0, "explanation": "Order doesn't matter for a committee (it's the same group regardless of selection order), so use combinations: 7C4 = 7!/(4!(7-4)!) = 35."}, {"question": "How many different 3-person committees can be formed from a group of 11 people?", "choices": ["55", "330", "990", "165"], "correctIndex": 3, "explanation": "Order doesn't matter for a committee (it's the same group regardless of selection order), so use combinations: 11C3 = 11!/(3!(11-3)!) = 165."}, {"question": "How many different 4-person committees can be formed from a group of 8 people?", "choices": ["1680", "140", "70", "56"], "correctIndex": 2, "explanation": "Order doesn't matter for a committee (it's the same group regardless of selection order), so use combinations: 8C4 = 8!/(4!(8-4)!) = 70."}, {"question": "How many different 2-person committees can be formed from a group of 8 people?", "choices": ["28", "29", "56", "8"], "correctIndex": 0, "explanation": "Order doesn't matter for a committee (it's the same group regardless of selection order), so use combinations: 8C2 = 8!/(2!(8-2)!) = 28."}, {"question": "A code has 2 letter(s) followed by 1 digit(s), with no repeated letters and no repeated digits allowed. How many different codes are possible?", "choices": ["6760", "6500", "660", "3250"], "correctIndex": 1, "explanation": "Letters (no repeats): 26x25 = 650. Digits (no repeats): 10 = 10. Multiply: 650 x 10 = 6500."}, {"question": "A code has 1 letter(s) followed by 2 digit(s), with no repeated letters and no repeated digits allowed. How many different codes are possible?", "choices": ["116", "1170", "2600", "2340"], "correctIndex": 3, "explanation": "Letters (no repeats): 26 = 26. Digits (no repeats): 10x9 = 90. Multiply: 26 x 90 = 2340."}, {"question": "A code has 2 letter(s) followed by 3 digit(s), with no repeated letters and no repeated digits allowed. How many different codes are possible?", "choices": ["234000", "468000", "1370", "676000"], "correctIndex": 1, "explanation": "Letters (no repeats): 26x25 = 650. Digits (no repeats): 10x9x8 = 720. Multiply: 650 x 720 = 468000."}, {"question": "A code has 3 letter(s) followed by 1 digit(s), with no repeated letters and no repeated digits allowed. How many different codes are possible?", "choices": ["156000", "78000", "175760", "15610"], "correctIndex": 0, "explanation": "Letters (no repeats): 26x25x24 = 15600. Digits (no repeats): 10 = 10. Multiply: 15600 x 10 = 156000."}, {"question": "Of the 26 students in a class, 8 are in debate club, 10 are in chess club, and 4 are in both. How many students are in NEITHER club?", "choices": ["8", "16", "12", "14"], "correctIndex": 2, "explanation": "At least one club: 8 + 10 - 4 = 14. Neither: 26 - 14 = 12."}, {"question": "Of the 20 students in a class, 9 are in debate club, 9 are in student council, and 8 are in both. How many students are in NEITHER club?", "choices": ["11", "10", "18", "2"], "correctIndex": 1, "explanation": "At least one club: 9 + 9 - 8 = 10. Neither: 20 - 10 = 10."}, {"question": "Of the 37 students in a class, 8 are in chess club, 10 are in student council, and 2 are in both. How many students are in AT LEAST ONE of the two clubs?", "choices": ["18", "17", "16", "21"], "correctIndex": 2, "explanation": "Add the two group sizes and subtract the double-counted overlap: 8 + 10 - 2 = 16."}, {"question": "Of the 38 students in a class, 18 are in art club, 12 are in debate club, and 7 are in both. How many students are in AT LEAST ONE of the two clubs?", "choices": ["24", "30", "15", "23"], "correctIndex": 3, "explanation": "Add the two group sizes and subtract the double-counted overlap: 18 + 12 - 7 = 23."}, {"question": "Of the 22 students in a class, 10 are in debate club, 8 are in art club, and 5 are in both. How many students are in NEITHER club?", "choices": ["9", "13", "14", "4"], "correctIndex": 0, "explanation": "At least one club: 10 + 8 - 5 = 13. Neither: 22 - 13 = 9."}, {"question": "Of the 29 students in a class, 10 are in debate club, 11 are in student council, and 9 are in both. How many students are in AT LEAST ONE of the two clubs?", "choices": ["13", "12", "17", "21"], "correctIndex": 1, "explanation": "Add the two group sizes and subtract the double-counted overlap: 10 + 11 - 9 = 12."}, {"question": "Of the 32 students in a class, 12 are in debate club, 10 are in chess club, and 8 are in both. How many students are in NEITHER club?", "choices": ["14", "18", "26", "10"], "correctIndex": 1, "explanation": "At least one club: 12 + 10 - 8 = 14. Neither: 32 - 14 = 18."}, {"question": "Of the 42 students in a class, 21 are in art club, 10 are in robotics club, and 9 are in both. How many students are in AT LEAST ONE of the two clubs?", "choices": ["31", "20", "22", "23"], "correctIndex": 2, "explanation": "Add the two group sizes and subtract the double-counted overlap: 21 + 10 - 9 = 22."}]}, "expected_value": {"name": "Expected Value", "lesson": "**Expected value**\n\nExpected value = the sum of (each outcome's value x its probability).\nE(X) = value_1 x P(value_1) + value_2 x P(value_2) + ...\n\nImportant: expected value is a LONG-RUN AVERAGE, not a prediction of what\nhappens on any single trial. An expected value of -$0.50 on a raffle\nticket doesn't mean you lose exactly 50 cents every time -- it means if you\nplayed many, many times, your average result per ticket would be a loss of\nabout 50 cents. Any single ticket either wins big or wins nothing.\n\nFor a simple two-outcome game (win amount W with probability p, otherwise\nwin nothing), expected value is just W x p. If there's also a cost to\nplay, subtract that cost to get the expected NET result.\n\n\n**Advanced: solve for the probability first**\n\nSometimes the probabilities aren't given directly -- you have to solve for\nthem first using the fact that all probabilities in a scenario sum to 1.\nExample: \"P(heads) = 3 x P(tails).\" Since P(heads) + P(tails) = 1, that's\n3p + p = 1, so p = 1/4. Only after finding the individual probabilities can\nyou plug into the expected value formula.\n", "flashcards": [{"front": "Formula for expected value?", "back": "E(X) = sum of (each outcome's value x its probability)."}, {"front": "Does expected value predict what happens on any one trial?", "back": "No -- it's a long-run average across many trials, not a guaranteed single-trial outcome."}, {"front": "A game has a cost to play. How do you find the expected NET result?", "back": "Find the expected value of the payout, then subtract the cost to play."}, {"front": "A problem says \"P(A) = k times P(B)\" without giving either directly -- what's the first step?", "back": "Solve for the probabilities first: since P(A) + P(B) = 1, set up k*p + p = 1 and solve for p, before computing expected value."}], "bank": [{"question": "A game gives a 1 in 8 chance to win $50, and otherwise wins nothing. What is the expected value of the payout?", "choices": ["$50", "$4/25", "$25/2", "$25/4"], "correctIndex": 3, "explanation": "E(X) = (50)(1/8) + (0)(7/8) = 50/8 = $25/4."}, {"question": "A game gives a 1 in 5 chance to win $25, and otherwise wins nothing. What is the expected value of the payout?", "choices": ["$5", "$1/5", "$10", "$25"], "correctIndex": 0, "explanation": "E(X) = (25)(1/5) + (0)(4/5) = 25/5 = $5."}, {"question": "A game gives a 1 in 6 chance to win $100, and otherwise wins nothing. What is the expected value of the payout?", "choices": ["$100", "$50/3", "$100/3", "$3/50"], "correctIndex": 1, "explanation": "E(X) = (100)(1/6) + (0)(5/6) = 100/6 = $50/3."}, {"question": "A game gives a 1 in 8 chance to win $100, and otherwise wins nothing. What is the expected value of the payout?", "choices": ["$2/25", "$25/2", "$100", "$25"], "correctIndex": 1, "explanation": "E(X) = (100)(1/8) + (0)(7/8) = 100/8 = $25/2."}, {"question": "A game gives a 1 in 4 chance to win $25, and otherwise wins nothing. What is the expected value of the payout?", "choices": ["$25", "$25/4", "$25/2", "$4/25"], "correctIndex": 1, "explanation": "E(X) = (25)(1/4) + (0)(3/4) = 25/4 = $25/4."}, {"question": "A game gives a 1 in 10 chance to win $20, and otherwise wins nothing. What is the expected value of the payout?", "choices": ["$20", "$1/2", "$4", "$2"], "correctIndex": 3, "explanation": "E(X) = (20)(1/10) + (0)(9/10) = 20/10 = $2."}, {"question": "A game costs $4 to play. You have a 1 in 6 chance to win $50 (otherwise you win nothing). What is the expected net result of playing (accounting for the cost)?", "choices": ["$13/3", "$37/3", "$46", "$25/3"], "correctIndex": 0, "explanation": "Expected payout = (50)(1/6) = 25/3. Subtract the $4 cost to play: 25/3 - 4 = $13/3."}, {"question": "A game costs $3 to play. You have a 1 in 5 chance to win $12 (otherwise you win nothing). What is the expected net result of playing (accounting for the cost)?", "choices": ["$27/5", "$12/5", "$-3/5", "$9"], "correctIndex": 2, "explanation": "Expected payout = (12)(1/5) = 12/5. Subtract the $3 cost to play: 12/5 - 3 = $-3/5."}, {"question": "A game costs $4 to play. You have a 1 in 3 chance to win $15 (otherwise you win nothing). What is the expected net result of playing (accounting for the cost)?", "choices": ["$1", "$5", "$9", "$11"], "correctIndex": 0, "explanation": "Expected payout = (15)(1/3) = 5. Subtract the $4 cost to play: 5 - 4 = $1."}, {"question": "A game costs $4 to play. You have a 1 in 6 chance to win $30 (otherwise you win nothing). What is the expected net result of playing (accounting for the cost)?", "choices": ["$5", "$9", "$1", "$26"], "correctIndex": 2, "explanation": "Expected payout = (30)(1/6) = 5. Subtract the $4 cost to play: 5 - 4 = $1."}, {"question": "A game costs $3 to play. You have a 1 in 3 chance to win $12 (otherwise you win nothing). What is the expected net result of playing (accounting for the cost)?", "choices": ["$1", "$7", "$9", "$4"], "correctIndex": 0, "explanation": "Expected payout = (12)(1/3) = 4. Subtract the $3 cost to play: 4 - 3 = $1."}, {"question": "A spinner lands on 45 with probability 5/10, on 35 with probability 4/10, and on 5 with probability 1/10. What is the expected value of one spin?", "choices": ["21", "85/3", "37", "45"], "correctIndex": 2, "explanation": "E(X) = 45(5/10) + 35(4/10) + 5(1/10) = 225/10 + 140/10 + 5/10 = 37."}, {"question": "A spinner lands on 20 with probability 5/10, on 35 with probability 4/10, and on 45 with probability 1/10. What is the expected value of one spin?", "choices": ["100/3", "45", "57/2", "77/2"], "correctIndex": 2, "explanation": "E(X) = 20(5/10) + 35(4/10) + 45(1/10) = 100/10 + 140/10 + 45/10 = 57/2."}, {"question": "A spinner lands on 25 with probability 5/10, on 45 with probability 3/10, and on 30 with probability 2/10. What is the expected value of one spin?", "choices": ["67/2", "32", "100/3", "45"], "correctIndex": 1, "explanation": "E(X) = 25(5/10) + 45(3/10) + 30(2/10) = 125/10 + 135/10 + 60/10 = 32."}, {"question": "A spinner lands on 15 with probability 4/10, on 10 with probability 5/10, and on 35 with probability 1/10. What is the expected value of one spin?", "choices": ["41/2", "29/2", "20", "35"], "correctIndex": 1, "explanation": "E(X) = 15(4/10) + 10(5/10) + 35(1/10) = 60/10 + 50/10 + 35/10 = 29/2."}, {"question": "A spinner lands on 15 with probability 4/10, on 35 with probability 5/10, and on 20 with probability 1/10. What is the expected value of one spin?", "choices": ["27", "70/3", "51/2", "35"], "correctIndex": 2, "explanation": "E(X) = 15(4/10) + 35(5/10) + 20(1/10) = 60/10 + 175/10 + 20/10 = 51/2."}, {"question": "If the expected value of a raffle ticket is -$0.50, what does this mean?", "choices": ["The ticket costs $0.50 more than it's worth to print", "Every single ticket loses exactly $0.50", "Half of all tickets lose $0.50", "On average, over many tickets played, a player loses about $0.50 per ticket"], "correctIndex": 3, "explanation": "Expected value is a long-run average across many trials, not a guaranteed result on any one ticket. Individual tickets either win or lose their full amount -- the -$0.50 only shows up as an average over many plays."}, {"question": "A game has an expected value of exactly $0. What does that tell you about the game?", "choices": ["Over many plays, wins and losses would balance out on average -- a fair game", "The game is impossible to win", "The game always costs nothing to play", "Every play results in exactly $0"], "correctIndex": 0, "explanation": "An expected value of $0 describes a long-run average, not a single outcome -- it means the game is mathematically 'fair' in the sense that average winnings equal average losses over many trials."}, {"question": "Coin C is weighted so that the probability of landing faceup is 4 times the probability of landing facedown. A player wins $2.00 for faceup and $1.00 for facedown. What is the expected value of each toss, to the nearest cent?", "choices": ["$1.20", "$1.80", "$1.50", "$2.00"], "correctIndex": 1, "explanation": "Let P(facedown) = p. Then P(faceup) = 4p, and 4p + p = 1 gives p = 1/5. So P(faceup) = 4/5, P(facedown) = 1/5. E(X) = (2)(4/5) + (1)(1/5) = $1.80."}, {"question": "Coin C is weighted so that the probability of landing faceup is 3 times the probability of landing facedown. A player wins $2.00 for faceup and $3.00 for facedown. What is the expected value of each toss, to the nearest cent?", "choices": ["$2.00", "$2.50", "$2.25", "$2.75"], "correctIndex": 2, "explanation": "Let P(facedown) = p. Then P(faceup) = 3p, and 3p + p = 1 gives p = 1/4. So P(faceup) = 3/4, P(facedown) = 1/4. E(X) = (2)(3/4) + (3)(1/4) = $2.25."}, {"question": "Coin C is weighted so that the probability of landing faceup is 4 times the probability of landing facedown. A player wins $1.00 for faceup and $3.00 for facedown. What is the expected value of each toss, to the nearest cent?", "choices": ["$2.00", "$1.40", "$2.60", "$1.00"], "correctIndex": 1, "explanation": "Let P(facedown) = p. Then P(faceup) = 4p, and 4p + p = 1 gives p = 1/5. So P(faceup) = 4/5, P(facedown) = 1/5. E(X) = (1)(4/5) + (3)(1/5) = $1.40."}, {"question": "Coin C is weighted so that the probability of landing faceup is 4 times the probability of landing facedown. A player wins $2.00 for faceup and $4.00 for facedown. What is the expected value of each toss, to the nearest cent?", "choices": ["$3.00", "$3.60", "$2.00", "$2.40"], "correctIndex": 3, "explanation": "Let P(facedown) = p. Then P(faceup) = 4p, and 4p + p = 1 gives p = 1/5. So P(faceup) = 4/5, P(facedown) = 1/5. E(X) = (2)(4/5) + (4)(1/5) = $2.40."}, {"question": "Coin C is weighted so that the probability of landing faceup is 4 times the probability of landing facedown. A player wins $2.00 for faceup and $3.00 for facedown. What is the expected value of each toss, to the nearest cent?", "choices": ["$2.20", "$2.80", "$2.00", "$2.50"], "correctIndex": 0, "explanation": "Let P(facedown) = p. Then P(faceup) = 4p, and 4p + p = 1 gives p = 1/5. So P(faceup) = 4/5, P(facedown) = 1/5. E(X) = (2)(4/5) + (3)(1/5) = $2.20."}, {"question": "Coin C is weighted so that the probability of landing faceup is 2 times the probability of landing facedown. A player wins $2.00 for faceup and $4.00 for facedown. What is the expected value of each toss, to the nearest cent?", "choices": ["$3.33", "$2.00", "$3.00", "$2.67"], "correctIndex": 3, "explanation": "Let P(facedown) = p. Then P(faceup) = 2p, and 2p + p = 1 gives p = 1/3. So P(faceup) = 2/3, P(facedown) = 1/3. E(X) = (2)(2/3) + (4)(1/3) = $2.67."}]}, "prob_diagnosis": {"name": "Probability: Diagnose the Type", "lesson": "**Diagnosing probability problem types -- the decision tree**\n\nBefore you can solve a probability problem, you have to recognize which\nkind it is. Work through it as a tree, not a checklist:\n\n**Level 1 -- what is the question actually asking for?**\n- \"How many ways...?\" (no fraction being computed) -> Counting Methods\n- \"Expected value,\" \"on average,\" \"over the long run\" -> Expected Value\n- Otherwise, it wants an actual probability -> True Probability (continue below)\n\n**Level 2 -- within True Probability, which of these four applies?**\n- **Geometric**: area- or length-based (a dart, a randomly chosen point,\n  \"along a segment\"). The sample space is continuous, not countable.\n- **Conditional**: \"given that...\" -- something already happened, changing\n  the sample space.\n- **Simple/Single-Event**: one draw, one event, no compounding language.\n- **Compound**: multiple events combined with \"and\"/\"or\"/\"both\"/\"either.\"\n\n**Level 3 -- inside Simple/Single-Event:**\n- **Direct**: favorable / total. The default when nothing suggests flipping.\n- **Complement**: \"not,\" \"at least one,\" \"no more than\" -- flip to\n  1 - P(opposite).\n\n**Level 3 -- inside Compound:**\n- **Compound AND** (\"and,\" \"both,\" \"all of,\" everything must happen):\n  multiply the probabilities.\n- **Compound OR** (\"or,\" \"either,\" any one thing happening counts): add\n  the probabilities (subtract the overlap if not mutually exclusive --\n  the classic \"heart or king\" trap).\n\n**Level 4 -- inside Compound AND specifically:**\n- **With Replacement**: the pool resets, same probability every draw.\n- **Without Replacement**: the pool shrinks, recompute for later draws.\n\n**Why the order matters:** Geometric, Conditional, and Complement get\nchecked before the Simple/AND/OR split -- not because they're harder, but\nbecause they're special cases that would otherwise get misdiagnosed. A\ngeometric problem (one random point) technically IS a single event; a\nconditional or \"at least one\" problem can involve multiple draws. Checking\nthe special signals first avoids those false positives.\n\n**Two more things worth knowing:**\n\n1. Real problems often STACK categories -- a Compound AND problem where\n   one of the two probabilities is itself Conditional (this literally\n   happened on one of your practice tests). The skill isn't always \"pick\n   one bucket,\" sometimes it's \"identify which pieces are layered.\"\n\n2. A **two-way table or a graph** isn't its own category -- it's a\n   presentation format that can wrap any of the types above. Orient\n   yourself in the table or graph first (which row/column/region matters),\n   then diagnose the type underneath.\n", "flashcards": [{"front": "Trigger words for Complement?", "back": "\"not,\" \"at least one,\" \"at least,\" \"no more than.\" Flip to the opposite: 1 - P(opposite)."}, {"front": "Trigger words for Compound AND vs Compound OR?", "back": "AND -> \"and,\" \"both,\" \"all of\" -> multiply. OR -> \"or,\" \"either\" -> add (subtract overlap if not mutually exclusive)."}, {"front": "Trigger phrase for Conditional probability?", "back": "\"given that...\" -- narrows the denominator to only the cases where the condition is already true."}, {"front": "Is a two-way table or graph its own probability category?", "back": "No -- it's a presentation format that can wrap any of the 8 types. Orient yourself in the table/graph first, then diagnose the type underneath."}, {"front": "Can a single problem combine more than one category?", "back": "Yes -- e.g. a Compound AND problem where one of the two probabilities is itself Conditional. Identify all the layered pieces, not just one bucket."}, {"front": "Why check Geometric, Conditional, and Complement before splitting Simple vs. Compound?", "back": "They're special cases that would otherwise be misdiagnosed -- e.g. a geometric problem (one random point) technically IS a single event, so it must be caught first."}, {"front": "Once you've diagnosed Compound AND, what's the next decision?", "back": "With Replacement (pool resets) or Without Replacement (pool shrinks, recompute) -- this determines the second probability in the multiplication."}], "bank": [{"question": "A jar has 8 orange, 5 purple, and 7 white marbles. What is the probability of randomly selecting a purple marble?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 0, "explanation": "One draw, one event, no compounding language -- just favorable (5 purple) over total (20 marbles)."}, {"question": "A restaurant survey found that out of 40 customers, 10 ordered pasta. What is the probability that a randomly selected customer ordered pasta?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 0, "explanation": "A single event with no \"and/or/not/given\" language -- 10/40 = 1/4."}, {"question": "A spinner is divided into 6 equal sections numbered 1 through 6. What is the probability of landing on the number 4?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 0, "explanation": "One spin, one specific outcome -- 1/6."}, {"question": "A box contains 10 tickets numbered 1 through 10. What is the probability of drawing a ticket with a number greater than 7?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 0, "explanation": "Count the qualifying tickets (8, 9, 10) over the total (10) -- 3/10. No compounding needed."}, {"question": "A bag contains exactly 22 solid-colored buttons: 4 red, 6 blue, and 12 white. What is the probability of randomly selecting 1 button that is NOT white?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 1, "explanation": "\"Not\" is the trigger. P(not white) = 1 - P(white) = 1 - 12/22 = 10/22 = 5/11. (This is Test 4, Question 5.)"}, {"question": "A certain data set is normally distributed. The area of a shaded region represents the probability that a randomly selected value is less than some number a. What is the probability that the selected value is greater than a?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 1, "explanation": "This is presented as a graph (a presentation format, not its own category) -- but the technique needed is the complement, since the total area under the curve is 1: P(greater than a) = 1 - P(less than a). (This is Test 7/Form J01, Question 28.)"}, {"question": "A coin is flipped 4 times. What is the probability of getting at least one tails?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 1, "explanation": "\"At least one\" is the clearest complement trigger. P(at least one tails) = 1 - P(all heads) = 1 - (1/2)^4 = 1 - 1/16 = 15/16."}, {"question": "A weather forecast gives a 35% chance of rain tomorrow. What is the probability it does NOT rain?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 1, "explanation": "Straightforward complement: 1 - 0.35 = 0.65, or 65%."}, {"question": "The probability that event A will occur is 0.20. If event A occurs, the probability that event B will occur is 0.30. What is the probability that event A will occur AND event B will occur?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 2, "explanation": "\"And\" signals multiplication: P(A and B) = 0.20 x 0.30 = 0.06. Notice the second probability is itself conditional on A -- this is a real example of two categories stacking (AND, built from a Conditional piece). (This is Test 7/Form J01, Question 8.)"}, {"question": "A coin is flipped and a die is rolled. What is the probability of getting heads AND rolling a 4?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 2, "explanation": "Independent events joined by \"and\": multiply. P(heads) x P(rolling a 4) = (1/2)(1/6) = 1/12."}, {"question": "A bag has 3 red and 2 blue marbles. A marble is drawn, replaced, then a second marble is drawn. What is the probability both draws are blue?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 2, "explanation": "\"Both\" signals AND: multiply. Since it's replaced, both draws use the same probability: (2/5)(2/5) = 4/25."}, {"question": "A card is drawn from a standard 52-card deck. What is the probability that the card is a heart OR a king?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 3, "explanation": "\"Or\" signals addition -- but hearts and kings overlap (the king of hearts is both), so subtract the double-counted card: 13/52 + 4/52 - 1/52 = 16/52 = 4/13."}, {"question": "A die is rolled. What is the probability of rolling an even number OR a 5?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 3, "explanation": "\"Or\" with mutually exclusive categories (no even number is also a 5) -- just add: 3/6 + 1/6 = 4/6 = 2/3."}, {"question": "A jar contains 3 green, 4 yellow, and 5 red candies. What is the probability of picking a yellow OR a red candy?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 3, "explanation": "Mutually exclusive categories joined by \"or\" -- add directly: (4+5)/12 = 9/12 = 3/4."}, {"question": "A questionnaire has 5 questions with \"yes\" or \"no\" answer choices. In how many ways can an employee answer all 5 questions?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 4, "explanation": "\"How many ways\" is the trigger -- this is a setup/counting step (2 choices per question, 5 questions): 2^5 = 32. (This is Test 7/Form J01, Question 41.)"}, {"question": "How many different ways can 5 runners finish 1st, 2nd, and 3rd place in a race?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 4, "explanation": "\"How many different ways\" -- order matters here (places are distinct), so this is a permutation: 5 x 4 x 3 = 60."}, {"question": "How many different 4-person committees can be formed from a group of 10 people?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 4, "explanation": "\"How many different\" groups, where order doesn't matter -- a combination: 10C4 = 210."}, {"question": "A password consists of 2 letters followed by 3 digits, with no repeated letters and no repeated digits allowed. How many different passwords are possible?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 4, "explanation": "A counting-principle chain: 26 x 25 (letters, no repeat) x 10 x 9 x 8 (digits, no repeat) = 11,700,000."}, {"question": "A game costs $2 to play. You have a 1 in 5 chance of winning $8, and otherwise you win nothing. What is the expected value of playing this game?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 5, "explanation": "\"Expected value\" is stated directly. E(X) = (8)(1/5) + (0)(4/5) - 2 (cost) = 1.6 - 2 = -$0.40 on average per play."}, {"question": "A spinner has 4 equal sections labeled 10, 20, 30, and 40. What is the expected value of one spin?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 5, "explanation": "Even without the words \"expected value\" appearing twice, this asks for the long-run average outcome: (10+20+30+40)/4 = 25 (each section equally likely, so this is also a simple average here)."}, {"question": "An insurance policy pays out $1,000 with probability 0.02 and $0 otherwise. What is the expected payout?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 5, "explanation": "\"Expected payout\" = value x probability: (1000)(0.02) + (0)(0.98) = $20."}, {"question": "A committee is composed of 11 juniors and 79 seniors. Two different members will be randomly selected, each for a different role. GIVEN THAT the 1st member selected is a junior, what is the probability that the 2nd member selected will be a senior?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 6, "explanation": "\"Given that\" is the clearest conditional trigger. Since a junior was already removed, only 89 people remain (11-1=10 juniors, 79 seniors), so P(2nd is senior | 1st was junior) = 79/89. (This is Test 7/Form J01, Question 11.)"}, {"question": "Of the students in a class, 60% play a sport. Of those who play a sport, 40% also play an instrument. What is the probability that a student plays an instrument, GIVEN THAT they play a sport?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 6, "explanation": "\"Given that they play a sport\" restricts you to just that group -- the 40% is already the conditional probability itself, directly stated."}, {"question": "A bag has 6 red and 4 blue marbles. Two are drawn without replacement. GIVEN THAT the first marble drawn is red, what is the probability the second is also red?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 6, "explanation": "\"Given that\" narrows the situation: after removing 1 red, 5 red and 4 blue remain (9 total), so P(2nd red | 1st red) = 5/9."}, {"question": "A dart is thrown randomly at a square dartboard with a circle inscribed inside it, touching all four sides. What is the probability the dart lands inside the circle?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 7, "explanation": "This is area-based, not count-based -- ratio of the circle's area to the square's area, not a count of discrete outcomes."}, {"question": "A point is chosen randomly along a 12-inch line segment. What is the probability the point falls within 3 inches of the left end?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 7, "explanation": "Length-based probability: the favorable length (3 inches) over the total length (12 inches) = 1/4."}, {"question": "A random point is chosen inside a rectangular garden. A circular fountain sits entirely inside the garden. What is the probability the point lands inside the fountain?", "choices": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"], "correctIndex": 7, "explanation": "Area ratio (fountain's area over the garden's area), not a count of discrete outcomes -- the geometric-probability signal."}], "mode": "sort", "categories": ["Simple/Single-Event", "Complement (\"not\"/\"at least one\")", "Compound AND", "Compound OR", "Counting Methods", "Expected Value", "Conditional", "Geometric"]}, "prob_conditional": {"name": "Conditional Probability", "lesson": "**Conditional probability: Given Directly vs. Recompute the Pool**\n\nConditional problems are flagged by \"given that...\" language -- something is\nalready known to be true, which changes the sample space.\n\n**Given Directly**: the conditional probability is simply stated as a\npercentage, or readable straight from a table (restricting to one row or\ncolumn). No further math beyond correctly identifying the right\ndenominator.\nExample: a table shows 479 total trucks, 31 of them black.\nP(black | truck) = 31/479 -- just read the restricted count.\n\n**Recompute the Pool**: the condition tells you something already\nhappened (a draw already occurred), so you have to adjust the counts\nbefore computing favorable/total on the new, smaller pool.\nExample: 11 juniors, 79 seniors. Given the 1st person picked is a junior,\nP(2nd is senior) = 79/89 -- the junior pool shrank by 1, so the total pool\nshrank by 1 too.\n\nThe tell for which one you need: if the \"given\" information is already a\nrestricted subgroup you can read directly (like a table row), it's Given\nDirectly. If the \"given\" information describes an EVENT that already\noccurred and changes the remaining counts, it's Recompute the Pool.\n", "flashcards": [{"front": "Trigger phrase for Conditional probability?", "back": "\"given that...\" -- something is already known to be true, changing the sample space."}, {"front": "Given Directly vs. Recompute the Pool -- what's the difference?", "back": "Given Directly: just read a stated % or a table's restricted row/column. Recompute the Pool: an event already happened, so counts must be adjusted before computing favorable/total."}, {"front": "11 juniors, 79 seniors. Given the 1st pick is a junior, what's P(2nd is senior)?", "back": "79/89 -- the junior pool shrank by 1, so the total (90) shrank to 89."}], "bank": [{"question": "A survey recorded 910 vehicles by category and color. Of the 444 total trucks, 248 are gray. What is the probability that a randomly selected truck is gray?", "choices": ["222/455", "62/111", "124/455", "111/62"], "correctIndex": 1, "explanation": "\"A randomly selected truck\" restricts the denominator to trucks only (444), not the grand total. P(gray | trucks) = 248/444 = 62/111."}, {"question": "A survey recorded 1355 vehicles by category and color. Of the 541 total vans, 272 are black. What is the probability that a randomly selected van is black?", "choices": ["541/1355", "272/541", "541/272", "272/1355"], "correctIndex": 1, "explanation": "\"A randomly selected van\" restricts the denominator to vans only (541), not the grand total. P(black | vans) = 272/541 = 272/541."}, {"question": "A survey recorded 1344 vehicles by category and color. Of the 479 total SUVs, 29 are gray. What is the probability that a randomly selected SUV is gray?", "choices": ["29/479", "479/1344", "479/29", "29/1344"], "correctIndex": 0, "explanation": "\"A randomly selected SUV\" restricts the denominator to SUVs only (479), not the grand total. P(gray | SUVs) = 29/479 = 29/479."}, {"question": "A survey recorded 1322 vehicles by category and color. Of the 429 total SUVs, 349 are gray. What is the probability that a randomly selected SUV is gray?", "choices": ["349/429", "429/349", "429/1322", "349/1322"], "correctIndex": 0, "explanation": "\"A randomly selected SUV\" restricts the denominator to SUVs only (429), not the grand total. P(gray | SUVs) = 349/429 = 349/429."}, {"question": "A survey recorded 965 vehicles by category and color. Of the 455 total trucks, 159 are white. What is the probability that a randomly selected truck is white?", "choices": ["159/965", "91/193", "159/455", "455/159"], "correctIndex": 2, "explanation": "\"A randomly selected truck\" restricts the denominator to trucks only (455), not the grand total. P(white | trucks) = 159/455 = 159/455."}, {"question": "A survey recorded 840 vehicles by category and color. Of the 391 total SUVs, 142 are gray. What is the probability that a randomly selected SUV is gray?", "choices": ["391/142", "142/391", "391/840", "71/420"], "correctIndex": 1, "explanation": "\"A randomly selected SUV\" restricts the denominator to SUVs only (391), not the grand total. P(gray | SUVs) = 142/391 = 142/391."}, {"question": "A survey recorded 933 vehicles by category and color. Of the 359 total vans, 85 are black. What is the probability that a randomly selected van is black?", "choices": ["359/933", "85/933", "85/359", "359/85"], "correctIndex": 2, "explanation": "\"A randomly selected van\" restricts the denominator to vans only (359), not the grand total. P(black | vans) = 85/359 = 85/359."}, {"question": "A survey recorded 939 vehicles by category and color. Of the 534 total trucks, 394 are gray. What is the probability that a randomly selected truck is gray?", "choices": ["178/313", "197/267", "267/197", "394/939"], "correctIndex": 1, "explanation": "\"A randomly selected truck\" restricts the denominator to trucks only (534), not the grand total. P(gray | trucks) = 394/534 = 197/267."}, {"question": "Of the students in a class, 75% join student council. Of those who join student council, 45% also do community service. What is the probability that a student also do community service, given that they join student council?", "choices": ["75%", "45%", "34%", "55%"], "correctIndex": 1, "explanation": "\"Given that they join student council\" restricts you to just that group -- the 45% is already the conditional probability itself, directly stated. No further math needed."}, {"question": "Of the students in a class, 60% play a sport. Of those who play a sport, 45% also play an instrument. What is the probability that a student also play an instrument, given that they play a sport?", "choices": ["55%", "27%", "60%", "45%"], "correctIndex": 3, "explanation": "\"Given that they play a sport\" restricts you to just that group -- the 45% is already the conditional probability itself, directly stated. No further math needed."}, {"question": "Of the students in a class, 70% join student council. Of those who join student council, 40% also do community service. What is the probability that a student also do community service, given that they join student council?", "choices": ["70%", "60%", "40%", "28%"], "correctIndex": 2, "explanation": "\"Given that they join student council\" restricts you to just that group -- the 40% is already the conditional probability itself, directly stated. No further math needed."}, {"question": "Of the students in a class, 70% join student council. Of those who join student council, 35% also take a language class. What is the probability that a student also take a language class, given that they join student council?", "choices": ["35%", "65%", "70%", "24%"], "correctIndex": 0, "explanation": "\"Given that they join student council\" restricts you to just that group -- the 35% is already the conditional probability itself, directly stated. No further math needed."}, {"question": "Of the students in a class, 75% play a sport. Of those who play a sport, 45% also play an instrument. What is the probability that a student also play an instrument, given that they play a sport?", "choices": ["45%", "75%", "34%", "55%"], "correctIndex": 0, "explanation": "\"Given that they play a sport\" restricts you to just that group -- the 45% is already the conditional probability itself, directly stated. No further math needed."}, {"question": "A group is composed of 13 juniors and 77 seniors. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a senior, what is the probability that the 2nd member selected is a junior?", "choices": ["76/89", "102/89", "13/89", "13/90"], "correctIndex": 2, "explanation": "The 1st pick removes one senior from the pool, so the total shrinks from 90 to 89. Remaining junior: 13. P(2nd is junior | 1st is senior) = 13/89 = 13/89."}, {"question": "A group is composed of 19 freshmen and 63 sophomores. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a freshmen, what is the probability that the 2nd member selected is a freshmen?", "choices": ["19/82", "7/9", "9/41", "2/9"], "correctIndex": 3, "explanation": "The 1st pick removes one freshmen from the pool, so the total shrinks from 82 to 81. Remaining freshmen: 18. P(2nd is freshmen | 1st is freshmen) = 18/81 = 2/9."}, {"question": "A group is composed of 16 freshmen and 73 seniors. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a senior, what is the probability that the 2nd member selected is a senior?", "choices": ["2/11", "73/89", "72/89", "9/11"], "correctIndex": 3, "explanation": "The 1st pick removes one senior from the pool, so the total shrinks from 89 to 88. Remaining senior: 72. P(2nd is senior | 1st is senior) = 72/88 = 9/11."}, {"question": "A group is composed of 9 juniors and 82 managers. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a manager, what is the probability that the 2nd member selected is a junior?", "choices": ["9/91", "9/10", "1/10", "11/10"], "correctIndex": 2, "explanation": "The 1st pick removes one manager from the pool, so the total shrinks from 91 to 90. Remaining junior: 9. P(2nd is junior | 1st is manager) = 9/90 = 1/10."}, {"question": "A group is composed of 15 interns and 56 sophomores. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a intern, what is the probability that the 2nd member selected is a intern?", "choices": ["15/71", "1/5", "14/71", "4/5"], "correctIndex": 1, "explanation": "The 1st pick removes one intern from the pool, so the total shrinks from 71 to 70. Remaining intern: 14. P(2nd is intern | 1st is intern) = 14/70 = 1/5."}, {"question": "A group is composed of 17 juniors and 77 managers. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a manager, what is the probability that the 2nd member selected is a junior?", "choices": ["17/93", "17/94", "110/93", "76/93"], "correctIndex": 0, "explanation": "The 1st pick removes one manager from the pool, so the total shrinks from 94 to 93. Remaining junior: 17. P(2nd is junior | 1st is manager) = 17/93 = 17/93."}, {"question": "A group is composed of 13 interns and 61 sophomores. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a sophomore, what is the probability that the 2nd member selected is a sophomore?", "choices": ["13/73", "60/73", "30/37", "61/74"], "correctIndex": 1, "explanation": "The 1st pick removes one sophomore from the pool, so the total shrinks from 74 to 73. Remaining sophomore: 60. P(2nd is sophomore | 1st is sophomore) = 60/73 = 60/73."}, {"question": "A group is composed of 11 juniors and 64 sophomores. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a sophomore, what is the probability that the 2nd member selected is a junior?", "choices": ["85/74", "63/74", "11/75", "11/74"], "correctIndex": 3, "explanation": "The 1st pick removes one sophomore from the pool, so the total shrinks from 75 to 74. Remaining junior: 11. P(2nd is junior | 1st is sophomore) = 11/74 = 11/74."}, {"question": "A group is composed of 14 juniors and 59 seniors. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a senior, what is the probability that the 2nd member selected is a senior?", "choices": ["29/36", "58/73", "59/73", "7/36"], "correctIndex": 0, "explanation": "The 1st pick removes one senior from the pool, so the total shrinks from 73 to 72. Remaining senior: 58. P(2nd is senior | 1st is senior) = 58/72 = 29/36."}, {"question": "A group is composed of 17 juniors and 86 seniors. Two different members will be randomly selected, each for a different role. Given that the 1st member selected is a junior, what is the probability that the 2nd member selected is a senior?", "choices": ["8/51", "94/51", "43/51", "86/103"], "correctIndex": 2, "explanation": "The 1st pick removes one junior from the pool, so the total shrinks from 103 to 102. Remaining senior: 86. P(2nd is senior | 1st is junior) = 86/102 = 43/51."}]}, "prob_geometric": {"name": "Geometric Probability", "lesson": "**Geometric probability: Length-based vs. Area-based**\n\nGeometric probability swaps counting for measuring. Instead of favorable\noutcomes over total outcomes, it's favorable area or length over total\narea or length -- because the \"outcomes\" are any point in a continuous\nregion, not a finite list of countable things.\n\n**Length-based (1-D)**: a point is chosen randomly along a segment.\nP = favorable length / total length\n\n**Area-based (2-D)**: a point (or dart) is chosen randomly within a 2-D\nregion.\nP = favorable area / total area\n\nA hallmark of these problems: specific dimensions often cancel out,\nleaving a clean ratio. A circle inscribed in a square (touching all four\nsides) always gives P = pi/4 for landing inside the circle, no matter how\nbig the square is -- the side length cancels completely.\n\nTrigger words: \"randomly chosen point,\" \"a dart is thrown,\" \"along a\nsegment,\" \"within a region.\" If the sample space is continuous (infinitely\nmany possible points) rather than a finite countable list, it's geometric.\n", "flashcards": [{"front": "Formula for length-based (1-D) geometric probability?", "back": "favorable length / total length"}, {"front": "Formula for area-based (2-D) geometric probability?", "back": "favorable area / total area"}, {"front": "A circle is inscribed in a square, touching all four sides. What's P(a random point lands in the circle)?", "back": "pi/4 -- always, regardless of the square's size. The side length cancels out."}, {"front": "What's the signal that a probability problem is geometric, not counting-based?", "back": "The sample space is continuous (infinitely many points along a segment or within a region), not a finite countable list."}], "bank": [{"question": "A point is chosen randomly along a 20-inch line segment. What is the probability the point falls within 6 inches of the left end?", "choices": ["7/10", "1/4", "3/10", "3/5"], "correctIndex": 2, "explanation": "Length-based: favorable length (6) over total length (20) = 3/10."}, {"question": "A point is chosen randomly along a 30-inch line segment. What is the probability the point falls within 16 inches of the left end?", "choices": ["8/15", "1", "7/15", "1/2"], "correctIndex": 0, "explanation": "Length-based: favorable length (16) over total length (30) = 8/15."}, {"question": "A point is chosen randomly along a 15-inch line segment. What is the probability the point falls more than 13 inches from the left end?", "choices": ["4/15", "13/15", "2/15", "1/15"], "correctIndex": 2, "explanation": "Length-based: favorable length (2) over total length (15) = 2/15."}, {"question": "A point is chosen randomly along a 24-inch line segment. What is the probability the point falls more than 21 inches from the left end?", "choices": ["1/4", "7/8", "1/8", "1/12"], "correctIndex": 2, "explanation": "Length-based: favorable length (3) over total length (24) = 1/8."}, {"question": "A point is chosen randomly along a 12-inch line segment. What is the probability the point falls within 2 inches of the left end?", "choices": ["1/6", "1/3", "1/12", "5/6"], "correctIndex": 0, "explanation": "Length-based: favorable length (2) over total length (12) = 1/6."}, {"question": "A point is chosen randomly along a 12-inch line segment. What is the probability the point falls more than 2 inches from the left end?", "choices": ["3/4", "1", "5/6", "1/6"], "correctIndex": 2, "explanation": "Length-based: favorable length (10) over total length (12) = 5/6."}, {"question": "A point is chosen randomly along a 20-inch line segment. What is the probability the point falls more than 15 inches from the left end?", "choices": ["1/5", "1/2", "3/4", "1/4"], "correctIndex": 3, "explanation": "Length-based: favorable length (5) over total length (20) = 1/4."}, {"question": "A dart is thrown randomly at a square target with a circle inscribed inside it, touching all four sides. What is the probability the dart lands inside the circle?", "choices": ["1/2", "4/pi", "pi/4", "pi/2"], "correctIndex": 2, "explanation": "If the square has side s, the inscribed circle has diameter s (radius s/2). Circle area = pi(s/2)^2 = pi*s^2/4. Square area = s^2. Ratio = pi/4 -- the side length s cancels completely."}, {"question": "A dart is thrown randomly at a square dartboard with a circle inscribed inside it, touching all four sides. What is the probability the dart lands inside the circle?", "choices": ["1/2", "pi/2", "4/pi", "pi/4"], "correctIndex": 3, "explanation": "If the square has side s, the inscribed circle has diameter s (radius s/2). Circle area = pi(s/2)^2 = pi*s^2/4. Square area = s^2. Ratio = pi/4 -- the side length s cancels completely."}, {"question": "A dart is thrown randomly at a square dartboard with a circle inscribed inside it, touching all four sides. What is the probability the dart lands inside the circle?", "choices": ["1/2", "pi/4", "pi/2", "4/pi"], "correctIndex": 1, "explanation": "If the square has side s, the inscribed circle has diameter s (radius s/2). Circle area = pi(s/2)^2 = pi*s^2/4. Square area = s^2. Ratio = pi/4 -- the side length s cancels completely."}, {"question": "A dart is thrown randomly at a square target with a circle inscribed inside it, touching all four sides. What is the probability the dart lands inside the circle?", "choices": ["1/2", "pi/2", "pi/4", "4/pi"], "correctIndex": 2, "explanation": "If the square has side s, the inscribed circle has diameter s (radius s/2). Circle area = pi(s/2)^2 = pi*s^2/4. Square area = s^2. Ratio = pi/4 -- the side length s cancels completely."}, {"question": "A point is chosen randomly within a circular region. A square is inscribed in the circle (all four corners touch the circle). What is the probability the point lands inside the square?", "choices": ["pi/4", "pi/2", "1/4", "2/pi"], "correctIndex": 3, "explanation": "If the circle has radius r, the inscribed square's diagonal equals the circle's diameter (2r), so the square's side is r*sqrt(2) and its area is 2r^2. Circle area = pi*r^2. Ratio = 2r^2/(pi*r^2) = 2/pi."}, {"question": "A point is chosen randomly within a circular region. A square is inscribed in the circle (all four corners touch the circle). What is the probability the point lands inside the square?", "choices": ["1/4", "2/pi", "pi/4", "pi/2"], "correctIndex": 1, "explanation": "If the circle has radius r, the inscribed square's diagonal equals the circle's diameter (2r), so the square's side is r*sqrt(2) and its area is 2r^2. Circle area = pi*r^2. Ratio = 2r^2/(pi*r^2) = 2/pi."}, {"question": "A point is chosen randomly within a circular region. A square is inscribed in the circle (all four corners touch the circle). What is the probability the point lands inside the square?", "choices": ["1/4", "pi/4", "2/pi", "pi/2"], "correctIndex": 2, "explanation": "If the circle has radius r, the inscribed square's diagonal equals the circle's diameter (2r)
